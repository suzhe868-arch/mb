components:
  securitySchemes:
    CustomerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT/opaque customer token
    StaffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT/opaque employee token
    SystemAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT/opaque system-admin token
    JytCredential:
      type: apiKey
      in: header
      name: X-JYT-Credential
  schemas:
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              required: []
              properties: {}
              additionalProperties: true
            request_id:
              type: string
          additionalProperties: false
      additionalProperties: false
    OpaqueAssertionExchangeRequest:
      type: object
      required:
      - assertion
      properties:
        assertion:
          type: string
          minLength: 1
          maxLength: 8192
        provider:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false
    AuthSessionDTO:
      type: object
      required:
      - token
      - expires_at
      - identity_domain
      properties:
        token:
          type: string
        expires_at: &id019
          type: string
          format: date-time
        identity_domain:
          type: string
          enum:
          - employee
          - system_admin
        principal_id: *id001
      additionalProperties: false
    WechatSessionRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 2048
      additionalProperties: false
    PhoneAuthorizeRequest:
      type: object
      required:
      - authorization_code
      properties:
        authorization_code:
          type: string
          minLength: 1
          maxLength: 4096
      additionalProperties: false
    ProfileUpdateRequest:
      type: object
      required: []
      properties:
        nickname:
          type: string
          maxLength: 100
        avatar_url:
          type: string
          format: uri
      additionalProperties: false
    FindCarApplicationRequest:
      type: object
      required: []
      properties:
        raw_text:
          type: string
          maxLength: 4000
        conditions:
          type: object
          required: []
          properties: {}
          additionalProperties: true
      additionalProperties: false
    ConsultationCreateRequest:
      type: object
      required: []
      properties:
        intent_type:
          type: string
          enum:
          - explicit_vehicle
          - contact_advisor
        source_recommendation_id: *id001
        source_demand_id: *id001
      additionalProperties: false
    WaitlistCreateRequest:
      type: object
      required:
