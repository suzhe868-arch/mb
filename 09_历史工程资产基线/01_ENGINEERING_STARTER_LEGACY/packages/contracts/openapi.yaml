openapi: 3.1.0
info:
  title: 名邦汽车 V1 API
  version: 1.0.10-predev-final-cr007
  description: Authoritative V1 implementation contract after CR-007 development hardening. It adds Collector-mediated
    phone access, narrow JYT price-label sync, vehicle visibility overlays, unified public matching with customer-level Priority qualification and temporary vehicle Priority leases,
    nullable lock price snapshots, transaction authorization separation and per-item integration results.
servers:
- url: /api/v1
paths:
  /customer/session/wechat:
    post:
      operationId: post_customer_session_wechat
      summary: POST /customer/session/wechat
      security: []
      x-identity-domain: anonymous
      x-permission: customer.session
      x-scope: wechat credential
      x-projection: CustomerSessionDTO
      x-idempotency: not required
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSessionDTO'
        '400':
          description: Malformed input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Permission or scope denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State/concurrency/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Business precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatSessionRequest'
