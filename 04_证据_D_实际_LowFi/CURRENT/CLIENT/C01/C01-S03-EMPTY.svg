<rect x="20.0" y="744" width="81.5" height="38" rx="5" fill="#eee" stroke="#555"/><text x="60.8" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">source</text><rect x="109.5" y="744" width="81.5" height="38" rx="5" fill="#eee" stroke="#555"/><text x="150.2" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">search</text><rect x="199.0" y="744" width="81.5" height="38" rx="5" fill="#eee" stroke="#555"/><text x="239.8" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">filter</text><rect x="288.5" y="744" width="81.5" height="38" rx="5" fill="#eee" stroke="#555"/><text x="329.2" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">sort</text><line x1="20" y1="804" x2="370" y2="804" stroke="#999"/><text x="195" y="824" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">车源  |  帮我找车  |  我的</text><rect x="405" y="30" width="350" height="780" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="419" y="54" font-family="Arial,sans-serif" font-size="12" font-weight="bold">IA V5 当前施工校准（右侧为设计注释，不属于成品视觉）</text><text x="419" y="78" font-family="Arial,sans-serif" font-size="10" font-weight="bold">PAGE_ID：C01｜车源【一级 Tab】</text><text x="419" y="100" font-family="Arial,sans-serif" font-size="10">资产处理：MODIFY｜当前物理状态：EMPTY</text><text x="419" y="122" font-family="Arial,sans-serif" font-size="10">逻辑状态：NORMAL, LOADING, EMPTY,</text><text x="419" y="140" font-family="Arial,sans-serif" font-size="10">ERROR</text><text x="419" y="162" font-family="Arial,sans-serif" font-size="10">本轮局部调整： 交互/权限/文案；</text><text x="419" y="180" font-family="Arial,sans-serif" font-size="10">IA-01: 分享来源、owner 结果与关闭接客边界文案；</text><text x="419" y="198" font-family="Arial,sans-serif" font-size="10">IA-06: 纯展示 Banner、无效目标不跳转、预览</text><text x="419" y="220" font-family="Arial,sans-serif" font-size="10">关键动作： 打开车辆→C01-01；</text><text x="419" y="238" font-family="Arial,sans-serif" font-size="10">头像昵称不完整时继续身份相关动作→C-O01；</text><text x="419" y="256" font-family="Arial,sans-serif" font-size="10">命中有效客户公告→C-O03；客户转发车源→C01-M03</text><text x="419" y="278" font-family="Arial,sans-serif" font-size="10">Guard/权限： vehicle visible in</text><text x="419" y="296" font-family="Arial,sans-serif" font-size="10">feed；current customer profile</text><text x="419" y="314" font-family="Arial,sans-serif" font-size="10">lacks required avatar/nickname;</text><text x="419" y="332" font-family="Arial,sans-serif" font-size="10">dismissing does not fabricate</text><text x="419" y="350" font-family="Arial,sans-serif" font-size="10">completion</text><text x="419" y="372" font-family="Arial,sans-serif" font-size="10">Entry： C-O01：完成或取消完善提示；</text><text x="419" y="390" font-family="Arial,sans-serif" font-size="10">C-O03：关闭公告；C01-M03：完成客户转发结果确认</text><text x="419" y="412" font-family="Arial,sans-serif" font-size="10">Back/Exit： 系统级返回/一级导航切换；不产生业务事实</text></svg>