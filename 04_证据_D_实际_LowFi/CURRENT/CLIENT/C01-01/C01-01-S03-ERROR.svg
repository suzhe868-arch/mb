><rect x="20.0" y="744" width="81.5" height="38" rx="5" fill="#eee" stroke="#555"/><text x="60.8" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">favorite</text><rect x="109.5" y="744" width="81.5" height="38" rx="5" fill="#eee" stroke="#555"/><text x="150.2" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">咨询这辆车</text><rect x="199.0" y="744" width="81.5" height="38" rx="5" fill="#eee" stroke="#555"/><text x="239.8" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">waitlist</text><rect x="288.5" y="744" width="81.5" height="38" rx="5" fill="#eee" stroke="#555"/><text x="329.2" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">price unlock</text><line x1="20" y1="804" x2="370" y2="804" stroke="#999"/><text x="195" y="824" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">车源  |  帮我找车  |  我的</text><rect x="405" y="30" width="350" height="780" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="419" y="54" font-family="Arial,sans-serif" font-size="12" font-weight="bold">IA V5 当前施工校准（右侧为设计注释，不属于成品视觉）</text><text x="419" y="78" font-family="Arial,sans-serif" font-size="10" font-weight="bold">PAGE_ID：C01-01｜客户车辆详情</text><text x="419" y="100" font-family="Arial,sans-serif" font-size="10">资产处理：MODIFY｜当前物理状态：ERROR</text><text x="419" y="122" font-family="Arial,sans-serif" font-size="10">逻辑状态：NORMAL, LOADING, ERROR,</text><text x="419" y="140" font-family="Arial,sans-serif" font-size="10">WAITLISTED, HISTORICAL,</text><text x="419" y="158" font-family="Arial,sans-serif" font-size="10">PERMISSION_DENIED,</text><text x="419" y="216" font-family="Arial,sans-serif" font-size="10">本轮局部调整： CLOSED_NOT_LOCKABLE,</text><text x="419" y="234" font-family="Arial,sans-serif" font-size="10">CUSTOMER_PRICE_EFFECTIVE,</text><text x="419" y="252" font-family="Arial,sans-serif" font-size="10">PRICE_CONSULTATION_VALUE_FACT,</text><text x="419" y="288" font-family="Arial,sans-serif" font-size="10">IA-01: 分享来源、owner 结果与关闭接客边界文案；</text><text x="419" y="306" font-family="Arial,sans-serif" font-size="10">IA-02: 图片冻结、部分失败、失败不回滚提示；</text><text x="419" y="324" font-family="Arial,sans-serif" font-size="10">IA-06: 纯展示 Banner、无效目标不跳转、预览</text><text x="419" y="346" font-family="Arial,sans-serif" font-size="10">关键动作： 命中有效客户公告→C-O03；</text><text x="419" y="364" font-family="Arial,sans-serif" font-size="10">查看车辆图片→C-O04；收藏/取消收藏→C01-01 /</text><text x="419" y="382" font-family="Arial,sans-serif" font-size="10">C03-01；查看价格→C01-M01 / C01-01</text><text x="419" y="404" font-family="Arial,sans-serif" font-size="10">Guard/权限： enabled announcement</text><text x="419" y="422" font-family="Arial,sans-serif" font-size="10">within effective window;</text><text x="419" y="440" font-family="Arial,sans-serif" font-size="10">same announcement/customer</text><text x="419" y="458" font-family="Arial,sans-serif" font-size="10">shown proactively at most once</text><text x="419" y="476" font-family="Arial,sans-serif" font-size="10">per UTC+8 day；actor must</text><text x="419" y="494" font-family="Arial,sans-serif" font-size="10">already have current</text><text x="419" y="512" font-family="Arial,sans-serif" font-size="10">vehicle-view permission in the</text><text x="419" y="530" font-family="Arial,sans-serif" font-size="10">same visibility context;</text><text x="419" y="548" font-family="Arial,sans-serif" font-size="10">image access inherits vehicle</text><text x="419" y="566" font-family="Arial,sans-serif" font-size="10">visibility, including</text><text x="419" y="584" font-family="Arial,sans-serif" font-size="10">hidden/Priority controlled</text><text x="419" y="602" font-family="Arial,sans-serif" font-size="10">visibility; selected image</text><text x="419" y="620" font-family="Arial,sans-serif" font-size="10">belongs to the visible frozen</text><text x="419" y="638" font-family="Arial,sans-serif" font-size="10">image set</text><text x="419" y="660" font-family="Arial,sans-serif" font-size="10">Entry： C01：打开车辆；C-O03：关闭公告；</text><text x="419" y="678" font-family="Arial,sans-serif" font-size="10">C-O04：关闭图片预览</text><text x="419" y="700" font-family="Arial,sans-serif" font-size="10">Back/Exit： 收藏/取消收藏→C01-01 /</text><text x="419" y="718" font-family="Arial,sans-serif" font-size="10">C03-01</text></svg>