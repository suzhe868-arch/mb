z_status=normal + vehicle.convert_mingbang</text><rect x="20" y="450" width="350" height="66" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="470" font-family="Arial,sans-serif" font-size="11" fill="#111">会话边界</text><text x="30" y="490" font-family="Arial,sans-serif" font-size="9" fill="#111">内部模式只对当前详情会话有效；退出/重进恢复客户安全默认</text><rect x="20" y="744" width="350" height="38" rx="5" fill="#eee" stroke="#555"/><text x="195.0" y="768" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#111">退出内部模式 / 返回客户安全详情</text><line x1="20" y1="804" x2="370" y2="804" stroke="#999"/><text x="195" y="824" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#111">工作台  |  车源  |  客户  |  我的</text><rect x="405" y="30" width="350" height="780" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="419" y="54" font-family="Arial,sans-serif" font-size="12" font-weight="bold">IA V5 当前施工校准（右侧为设计注释，不属于成品视觉）</text><text x="419" y="78" font-family="Arial,sans-serif" font-size="10" font-weight="bold">PAGE_ID：E02-M01｜内部模式授权投影 /</text><text x="419" y="96" font-family="Arial,sans-serif" font-size="10" font-weight="bold">敏感动作裁剪</text><text x="419" y="118" font-family="Arial,sans-serif" font-size="10">资产处理：MODIFY｜当前物理状态：AUTHORIZED</text><text x="419" y="140" font-family="Arial,sans-serif" font-size="10">逻辑状态：AUTHORIZED,</text><text x="419" y="158" font-family="Arial,sans-serif" font-size="10">PERMISSION_DENIED,</text><text x="419" y="176" font-family="Arial,sans-serif" font-size="10">ACTION_DISABLED, PHONE_LATEST,</text><text x="419" y="194" font-family="Arial,sans-serif" font-size="10">PHONE_CACHE_AVAILABLE,</text><text x="419" y="212" font-family="Arial,sans-serif" font-size="10">PHONE_LATEST_FAILED_CACHE_AVAIL</text><text x="419" y="230" font-family="Arial,sans-serif" font-size="10">ABLE, PHONE_UNAVAILABLE</text><text x="419" y="252" font-family="Arial,sans-serif" font-size="10">本轮局部调整： ACTION_DISABLED,</text><text x="419" y="270" font-family="Arial,sans-serif" font-size="10">PHONE_CACHE_AVAILABLE,</text><text x="419" y="288" font-family="Arial,sans-serif" font-size="10">PHONE_LATEST, PHONE_LATEST_FAIL</text><text x="419" y="306" font-family="Arial,sans-serif" font-size="10">ED_CACHE_AVAILABLE,</text><text x="419" y="324" font-family="Arial,sans-serif" font-size="10">PHONE_UNAVAILABLE；</text><text x="419" y="342" font-family="Arial,sans-serif" font-size="10">IA-24: 身份、权限与禁用提示校准</text><text x="419" y="364" font-family="Arial,sans-serif" font-size="10">关键动作： 退出内部模式→E02-01；</text><text x="419" y="382" font-family="Arial,sans-serif" font-size="10">查看名邦内部价→E02-M01；编辑→E02-05 /</text><text x="419" y="400" font-family="Arial,sans-serif" font-size="10">E02-02；拨打→E02-M01</text><text x="419" y="422" font-family="Arial,sans-serif" font-size="10">Guard/权限： clear temporary</text><text x="419" y="440" font-family="Arial,sans-serif" font-size="10">internal projection;</text><text x="419" y="458" font-family="Arial,sans-serif" font-size="10">no business fact or permission</text><text x="419" y="476" font-family="Arial,sans-serif" font-size="10">changes；active Mingbang</text><text x="419" y="494" font-family="Arial,sans-serif" font-size="10">employee, not 4S;</text><text x="419" y="512" font-family="Arial,sans-serif" font-size="10">vehicle in data scope;</text><text x="419" y="530" font-family="Arial,sans-serif" font-size="10">existing employee</text><text x="419" y="548" font-family="Arial,sans-serif" font-size="10">internal-price visibility</text><text x="419" y="566" font-family="Arial,sans-serif" font-size="10">applies; internal mode itself</text><text x="419" y="584" font-family="Arial,sans-serif" font-size="10">grants nothing</text><text x="419" y="606" font-family="Arial,sans-serif" font-size="10">Entry： E02-01：进入内部模式；</text><text x="419" y="624" font-family="Arial,sans-serif" font-size="10">E02-M01：查看名邦内部价；E02-M01：拨打</text><text x="419" y="646" font-family="Arial,sans-serif" font-size="10">Back/Exit