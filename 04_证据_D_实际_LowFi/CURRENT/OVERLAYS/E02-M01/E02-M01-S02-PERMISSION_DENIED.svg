-serif" font-size="10">internal projection;</text><text x="419" y="476" font-family="Arial,sans-serif" font-size="10">no business fact or permission</text><text x="419" y="494" font-family="Arial,sans-serif" font-size="10">changes；active Mingbang</text><text x="419" y="512" font-family="Arial,sans-serif" font-size="10">employee, not 4S;</text><text x="419" y="530" font-family="Arial,sans-serif" font-size="10">vehicle in data scope;</text><text x="419" y="548" font-family="Arial,sans-serif" font-size="10">existing employee</text><text x="419" y="566" font-family="Arial,sans-serif" font-size="10">internal-price visibility</text><text x="419" y="584" font-family="Arial,sans-serif" font-size="10">applies; internal mode itself</text><text x="419" y="602" font-family="Arial,sans-serif" font-size="10">grants nothing</text><text x="419" y="624" font-family="Arial,sans-serif" font-size="10">Entry： E02-01：进入内部模式；</text><text x="419" y="642" font-family="Arial,sans-serif" font-size="10">E02-M01：查看名邦内部价；E02-M01：拨打</text><text x="419" y="664" font-family="Arial,sans-serif" font-size="10">Back/Exit： 退出内部模式→E02-01</text></svg>