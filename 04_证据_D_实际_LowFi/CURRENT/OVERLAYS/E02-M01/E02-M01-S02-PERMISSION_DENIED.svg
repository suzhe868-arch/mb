<svg xmlns="http://www.w3.org/2000/svg" width="780" height="844" viewBox="0 0 780 844"><rect width="100%" height="100%" fill="white"/><rect x="8" y="8" width="374" height="828" rx="24" fill="none" stroke="#444" stroke-width="2"/><text x="24" y="34" font-family="Arial,sans-serif" font-size="12" fill="#111">E02-M01-S02-PERMISSION_DENIED</text><text x="24" y="52" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">内部模式权限校验</text><rect x="20" y="90" width="350" height="90" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="110" font-family="Arial,sans-serif" font-size="11" fill="#111">内部模式校验失败</text><text x="30" y="130" font-family="Arial,sans-serif" font-size="9" fill="#111">无员工身份、权限不足、数据范围不符或对象状态不允许</text><rect x="20" y="200" width="350" height="90" rx="5" fill="#f7f7f7" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="220" font-family="Arial,sans-serif" font-size="11" fill="#111">安全结果</text><text x="30" y="240" font-family="Arial,sans-serif" font-size="9" fill="#111">保持 E02-01 客户安全投影；不返回内部价、上游电话、管理动作</text><rect x="20" y="310" width="350" height="80" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="330" font-family="Arial,sans-serif" font-size="11" fill="#111">审计/错误</text><text x="30" y="350" font-family="Arial,sans-serif" font-size="9" fill="#111">返回明确 403/业务状态错误；前端不得自行猜测或显示隐藏字段</text><rect x="20" y="744" width="350" height="38" rx="5" fill="#eee" stroke="#555"/><text x="195.0" y="768" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#111">返回客户安全详情</text><line x1="20" y1="804" x2="370" y2="804" stroke="#999"/><text x="195" y="824" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#111">工作台  |  车源  |  客户  |  我的</text><rect x="405" y="30" width="350" height="780" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="419" y="54" font-family="Arial,sans-serif" font-size="12" font-weight="bold">IA V5 当前施工校准（右侧为设计注释，不属于成品视觉）</text><text x="41