<svg xmlns="http://www.w3.org/2000/svg" width="780" height="844" viewBox="0 0 780 844"><rect width="100%" height="100%" fill="white"/><rect x="8" y="8" width="374" height="828" rx="24" fill="none" stroke="#444" stroke-width="2"/><text x="24" y="34" font-family="Arial,sans-serif" font-size="12">P07-M01-S01-NORMAL</text><text x="24" y="54" font-family="Arial,sans-serif" font-size="15" font-weight="bold">成交撤销 / 纠错确认</text><rect x="20" y="70" width="350" height="58" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="91" font-family="Arial,sans-serif" font-size="11" font-weight="bold">原因</text><text x="30" y="113" font-family="Arial,sans-serif" font-size="9">必填且进入审计；原成交事实保留</text><rect x="20" y="136" width="350" height="58" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="157" font-family="Arial,sans-serif" font-size="11" font-weight="bold">影响</text><text x="30" y="179" font-family="Arial,sans-serif" font-size="9">重算车辆与统计派生状态</text><rect x="20.0" y="744" width="171.0" height="38" rx="5" fill="#eee" stroke="#555"/><text x="105.5" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">取消</text><rect x="199.0" y="744" width="171.0" height="38" rx="5" fill="#eee" stroke="#555"/><text x="284.5" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">确认纠错</text><line x1="20" y1="804" x2="370" y2="804" stroke="#999"/><text x="195" y="824" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">名邦汽车 V1 · CR-006.2</text><rect x="405" y="30" width="350" height="780" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="419" y="54" font-family="Arial,sans-serif" font-size="12" font-weight="bold">IA V5 当前施工校准（右侧为设计注释，不属于成品视觉）</text><text x="419" y="78" font-family="Arial,sans-serif" font-size="10" font-weight="bold">PAGE_ID：P07-M01｜成交撤销 / 纠错确认</text><text x="419" y="100" font-family="Arial,sans-serif" font-size="10">资产处理：MODIFY｜当前物理状态：NORMAL</text><text x="419" y="122" font-family="Arial,sans-serif" font-size="10">逻辑状态：NORMAL</text><text x="419" y="144" font-family="Arial,sans-serif" font-size="10">本轮局部调整： 交互/权限/文案；</text><text x="419" y="162" font-family="Arial,sans-serif" font-size="10">IA-10: 追加冲正/更正确认与历史</text><text x="419" y="184" font-family="Arial,sans-serif" font-size="10">关键动作： 确认成交撤销/纠错→P07-06 / P02-07；</text><text x="419" y="202" font-family="Arial,sans-serif" font-size="10">取消→P07-06</text><text x="419" y="224" font-family="Arial,sans-serif" font-size="10">Guard/权限： revalidate completed</text><text x="419" y="242" font-family="Arial,sans-serif" font-size="10">Transaction and correction</text><text x="419" y="260" font-family="Arial,sans-serif" font-size="10">authority; append correction</text><text x="419" y="278" font-family="Arial,sans-serif" font-size="10">fact in the same authorized</text><text x="419" y="296" font-family="Arial,sans-serif" font-size="10">flow with no second-level</text><text x="419" y="314" font-family="Arial,sans-serif" font-size="10">approval; never erase original</text><text x="419" y="332" font-family="Arial,sans-serif" font-size="10">completion or revive old</text><text x="419" y="350" font-family="Arial,sans-serif" font-size="10">Lock/Waitlist；no Transaction</text><text x="419" y="368" font-family="Arial,sans-serif" font-size="10">mutation</text><text x="419" y="390" font-family="Arial,sans-serif" font-size="10">Entry： P07-06：成交撤销/纠错</text><text x="419" y="412" font-family="Arial,sans-serif" font-size="10">Back/Exit： 取消→P07-06</text></svg>