<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
 <rect width="1440" height="900" fill="white"/>
 <text x="72" y="90" font-size="32" font-family="Arial, sans-serif">pending Refund · 关闭确认</text>
 <text x="72" y="155" font-size="18" font-family="Arial, sans-serif">只有尚未真实退款的 PENDING Refund 可关闭。</text>
 <text x="72" y="205" font-size="18" font-family="Arial, sans-serif">必须填写 close_reason；CLOSED = 决定不再退款，不得记为 REFUNDED。</text>
 <text x="72" y="255" font-size="18" font-family="Arial, sans-serif">不新增专门 close capability 或额外审批；按当前合法 handler + 既有适用 capability + data scope 重验。</text>
 <text x="72" y="315" font-size="18" font-family="Arial, sans-serif">确认 → P07-05；取消 → 保持 PENDING。</text>
</svg>