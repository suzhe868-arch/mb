<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
 <rect width="1440" height="900" fill="white"/>
 <text x="72" y="90" font-size="32" font-family="Arial, sans-serif">C-O03 · 客户公告弹层</text>
 <text x="72" y="155" font-size="18" font-family="Arial, sans-serif">主动触发机会：Customer 当天第一次进入 / 打开小程序（UTC+8 业务自然日）。</text>
 <text x="72" y="205" font-size="18" font-family="Arial, sans-serif">候选：enabled + 当前有效周期 + auto-popup ON。</text>
 <text x="72" y="255" font-size="18" font-family="Arial, sans-serif">同一 Customer 同一 UTC+8 自然日，Announcement 主动弹层全局最多实际展示 1 条。</text>
 <text x="72" y="305" font-size="18" font-family="Arial, sans-serif">多候选按后台当前有效排序择一；不是“每个 Announcement 各每天一次”。</text>
 <text x="72" y="355" font-size="18" font-family="Arial, sans-serif">关闭只结束本次展示，不创建 read/unread 业务状态。</text>
</svg>