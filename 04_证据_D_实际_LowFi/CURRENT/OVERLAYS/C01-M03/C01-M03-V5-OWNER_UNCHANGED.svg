<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="100%" height="100%" fill="white"/><rect x="8" y="8" width="374" height="828" rx="24" fill="none" stroke="#444" stroke-width="2"/><text x="24" y="34" font-family="Arial,sans-serif" font-size="12">C01-M03-V5-OWNER_UNCHANGED</text><text x="24" y="55" font-family="Arial,sans-serif" font-size="15" font-weight="bold">分享 / 直接转介绍结果与来源归属说明</text><text x="24" y="74" font-family="Arial,sans-serif" font-size="10">状态：OWNER_UNCHANGED ｜ 角色：客户</text><rect x="20" y="96" width="350" height="620" rx="10" fill="#f7f7f7" stroke="#888"/><rect x="42" y="148" width="306" height="500" rx="10" fill="white" stroke="#555" stroke-width="1.5"/><rect x="58" y="180" width="274" height="88" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="68" y="200" font-family="Arial,sans-serif" font-size="10" font-weight="bold">状态语义</text><text x="68" y="219" font-family="Arial,sans-serif" font-size="8.5">已有 owner 时追加触达但不抢客；</text><text x="68" y="235" font-family="Arial,sans-serif" font-size="8.5">按 originating action 返回 E02-01</text><rect x="58" y="276" width="274" height="88" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="68" y="296" font-family="Arial,sans-serif" font-size="10" font-weight="bold">权威依据</text><text x="68" y="315" font-family="Arial,sans-serif" font-size="8.5">Step5 C03</text><rect x="58" y="372" width="274" height="88" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="68" y="392" font-family="Arial,sans-serif" font-size="10" font-weight="bold">页面入口</text><text x="68" y="411" font-family="Arial,sans-serif" font-size="8.5">C01：客户转发车源；E02-01：员工分享车源给客户；</text><text x="68" y="427" font-family="Arial,sans-serif" font-size="8.5">C03-07：发起直接转介绍</text><rect x="58" y="468" width="274" height="88" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="68" y="488" font-family="Arial,sans-serif" font-size="10" font-weight="bold">关键动作</text><text x="68" y="507" font-family="Arial,sans-serif" font-size="8.5">完成员工分享结果确认 → E02-01；</text><text x="68" y="523" font-family="Arial,sans-serif" font-size="8.5">完成客户转发结果确认 → C01；完成直接转介绍结果确认 →</text><text x="68" y="539" font-family="Arial,sans-serif" font-size="8.5">C03-07</text><rect x="58" y="564" width="274" height="88" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="68" y="584" font-family="Arial,sans-serif" font-size="10" font-weight="bold">权限 / Guard</text><text x="68" y="603" font-family="Arial,sans-serif" font-size="8.5">originating action was employee</text><text x="68" y="619" font-family="Arial,sans-serif" font-size="8.5">share and result is SOURCE_ONLY,</text><text x="68" y="635" font-family="Arial,sans-serif" font-size="8.5">OWNER_ASSIGNED or OWNER_UNCHANGED;</text><rect x="20" y="742" width="350" height="42" rx="5" fill="#eee" stroke="#555"/><text x="195" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">按当前 IA 对应确认/取消/关闭动作退出；不存在仅打开无退出的 Overlay</text><line x1="20" y1="804" x2="370" y2="804" stroke="#999"/><text x="195" y="824" text-anchor="middle" font-family="Arial,sans-serif" font-size="9">Low-Fi V1 · IA V5 当前承载</text></svg>