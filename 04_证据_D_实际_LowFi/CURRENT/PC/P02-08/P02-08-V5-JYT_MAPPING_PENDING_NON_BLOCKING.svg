<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="100%" height="100%" fill="white"/><rect x="10" y="10" width="1420" height="880" rx="8" fill="none" stroke="#444" stroke-width="2"/><rect x="20" y="20" width="210" height="860" fill="#f2f2f2" stroke="#aaa"/><text x="40" y="54" font-family="Arial,sans-serif" font-size="18" font-weight="bold">名邦汽车 PC · Low-Fi V1</text><text x="260" y="48" font-family="Arial,sans-serif" font-size="13">P02-08-V5-JYT_MAPPING_PENDING_NON_BLOCKING</text><text x="260" y="78" font-family="Arial,sans-serif" font-size="22" font-weight="bold">车型待匹配</text><text x="260" y="106" font-family="Arial,sans-serif" font-size="13">状态：JYT_MAPPING_PENDING_NON_BLOCKING ｜ 角色：PC/后台</text><rect x="260" y="135" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="278" y="163" font-family="Arial,sans-serif" font-size="13" font-weight="bold">状态语义</text><text x="278" y="187" font-family="Arial,sans-serif" font-size="11">Upstream mapping remains pending independently;</text><text x="278" y="209" font-family="Arial,sans-serif" font-size="11">does not block otherwise valid publish/business;</text><text x="278" y="231" font-family="Arial,sans-serif" font-size="11">manual MODEL_MISSING draft rule unchanged</text><rect x="838" y="135" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="163" font-family="Arial,sans-serif" font-size="13" font-weight="bold">权威依据</text><text x="856" y="187" font-family="Arial,sans-serif" font-size="11">NEW-06; Step5/6</text><rect x="260" y="300" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="278" y="328" font-family="Arial,sans-serif" font-size="13" font-weight="bold">页面入口</text><text x="278" y="352" font-family="Arial,sans-serif" font-size="11">E02-02：MODEL_MISSING 交由车型映射；P02-08：绑定已有车型；P02-08：确认保留/纠正映射并关闭任务</text><rect x="838" y="300" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="328" font-family="Arial,sans-serif" font-size="13" font-weight="bold">关键动作</text><text x="856" y="352" font-family="Arial,sans-serif" font-size="11">绑定已有车型 → P02-08 / P02-07；确认保留/纠正映射并关闭任务 → P02-08 / P02-07；</text><text x="856" y="374" font-family="Arial,sans-serif" font-size="11">MODEL_MISSING 处理 → P02-08；完成 MODEL_MISSING 映射并恢复草稿 → E02-02；</text><text x="856" y="396" font-family="Arial,sans-serif" font-size="11">查看 JYT mapping pending → P02-08 / P02-07</text><rect x="260" y="465" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="278" y="493" font-family="Arial,sans-serif" font-size="13" font-weight="bold">权限 / Guard</text><text x="278" y="517" font-family="Arial,sans-serif" font-size="11">vehicle.model.manage permission; select canonical model;</text><text x="278" y="539" font-family="Arial,sans-serif" font-size="11">preserve upstream facts; audit before/after mapping；</text><text x="278" y="561" font-family="Arial,sans-serif" font-size="11">REF_GUARD[MAPPING_CORRECTION]；local_ui_fact=vehicle.model.manage</text><text x="278" y="583" font-family="Arial,sans-serif" font-size="11">permission; conflict task open; retain or correct explicitly;</text><rect x="838" y="465" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="493" font-family="Arial,sans-serif" font-size="13" font-weight="bold">返回 / 退出</text><text x="856" y="517" font-family="Arial,sans-serif" font-size="11">确认保留/纠正映射并关闭任务→P02-08 / P02-07</text><text x="260" y="840" font-family="Arial,sans-serif" font-size="11">结构级低保真：仅表达页面/状态/动作/权限/导航，不冻结高保真视觉。</text></svg>