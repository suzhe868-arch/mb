<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160"><rect width="100%" height="100%" fill="white"/><text x="40" y="45" font-family="Arial,sans-serif" font-size="22" font-weight="bold">P02-08-S01-NORMAL｜车型待匹配</text><rect x="30" y="70" width="1380" height="70" fill="#f5f5f5" stroke="#888"/><text x="50" y="100" font-family="Arial" font-size="15">筛选：待匹配 / 冲突 / 已解决　搜索 car_code / JYT model_id / 车型名称</text><text x="50" y="126" font-family="Arial" font-size="13">权限：vehicle.model.manage</text><rect x="30" y="160" width="850" height="650" fill="white" stroke="#777"/><text x="50" y="190" font-family="Arial" font-size="15" font-weight="bold">待处理列表</text><text x="50" y="225" font-family="Arial" font-size="13">car_code　JYT model_id　完整名称　车系　年款　指导价　排量　能源　状态　候选数</text><line x1="50" y1="240" x2="850" y2="240" stroke="#aaa"/><text x="50" y="275" font-family="Arial" font-size="13">示例：JYT-...　123456　奥迪 2016款 A6L...　A6L　2016　...　待匹配　2</text><rect x="900" y="160" width="510" height="650" fill="#fafafa" stroke="#777"/><text x="920" y="190" font-family="Arial" font-size="15" font-weight="bold">车型对比 / 处理</text><text x="920" y="230" font-family="Arial" font-size="13">上游快照：名称 / 年款 / 指导价 / 排量 / 能源 / 变速箱 / 排放</text><text x="920" y="265" font-family="Arial" font-size="13">候选车型：按完整配置对比，不允许模糊强绑</text><rect x="920" y="320" width="210" height="46" fill="#eee" stroke="#666"/><text x="1025" y="349" text-anchor="middle" font-family="Arial" font-size="13">绑定已有车型</text><rect x="1150" y="320" width="210" height="46" fill="#eee" stroke="#666"/><text x="1255" y="349" text-anchor="middle" font-family="Arial" font-size="13">新建车型并绑定</text><text x="920" y="410" font-family="Arial" font-size="12">确认后：永久映射 → 当前/同 model_id pending 批量回填 → 审计</text><text x="40" y="860" font-family="Arial" font-size="12">P02｜车源管理 ＞ P02-08｜车型待匹配　　Demand Match(P06-10) 与 Vehicle Model Match 分离</text><rect x="260" y="910" width="1140" height="220" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="276" y="936" font-family="Arial,sans-serif" font-size="14" font-weight="bold">IA V5 当前施工校准（下方为设计注释，不属于成品视觉）</text><text x="276" y="959" font-family="Arial,sans-serif" font-size="11" font-weight="bold">PAGE_ID：P02-08｜车型待匹配｜资产处理：MODIFY｜当前物理状态：NORMAL</text><text x="276" y="979" font-family="Arial,sans-serif" font-size="11">本轮局部调整： JYT_MAPPING_PENDING_NON_BLOCKING</text><text x="276" y="999" font-family="Arial,sans-serif" font-size="11">关键动作： 绑定已有车型→P02-08 / P02-07；确认保留/纠正映射并关闭任务→P02-08 / P02-07；MODEL_MISSING 处理→P02-08；完成 MODEL_MISSING 映射并恢复草稿→E02-02</text><text x="276" y="1019" font-family="Arial,sans-serif" font-size="11">Guard/权限： vehicle.model.manage permission; select canonical model; preserve upstream facts; audit before/after mapping；</text><text x="276" y="1037" font-family="Arial,sans-serif" font-size="11">REF_GUARD[MAPPING_CORRECTION]；local_ui_fact=vehicle.model.manage permission; conflict task open;</text><text x="276" y="1055" font-family="Arial,sans-serif" font-size="11">retain or correct explicitly; audit actor/time/old/new mapping</text><text x="276" y="1075" font-family="Arial,sans-serif" font-size="11">Back/Exit： 确认保留/纠正映射并关闭任务→P02-08 / P02-07</text></svg>