h="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="328" font-family="Arial,sans-serif" font-size="13" font-weight="bold">关键动作</text><text x="856" y="352" font-family="Arial,sans-serif" font-size="11">为交接对象逐项选择新负责人 → P04-07；确认交接批次 → P04-07 / P04-06</text><rect x="260" y="465" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="278" y="493" font-family="Arial,sans-serif" font-size="13" font-weight="bold">权限 / Guard</text><text x="278" y="517" font-family="Arial,sans-serif" font-size="11">REF_GUARD[EMPLOYEE_HANDOFF]；local_ui_fact=batch open;</text><text x="278" y="539" font-family="Arial,sans-serif" font-size="11">each Customer/Demand/Consultation/Lock/Transaction/vehicle</text><text x="278" y="561" font-family="Arial,sans-serif" font-size="11">responsibility maps to an active eligible target with covering scope;</text><text x="278" y="583" font-family="Arial,sans-serif" font-size="11">preserve original responsibility history；REF_GUARD[EMPLOYEE_HANDOFF]；</text><rect x="838" y="465" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="493" font-family="Arial,sans-serif" font-size="13" font-weight="bold">返回 / 退出</text><text x="856" y="517" font-family="Arial,sans-serif" font-size="11">返回 P04 页面组；不产生业务事实</text><text x="260" y="840" font-family="Arial,sans-serif" font-size="11">结构级低保真：仅表达页面/状态/动作/权限/导航，不冻结高保真视觉。</text></svg>