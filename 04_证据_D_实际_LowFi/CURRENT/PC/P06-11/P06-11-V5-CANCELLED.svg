 E03-03；解决 → P06-11；无效 → P06-11；</text><text x="856" y="374" font-family="Arial,sans-serif" font-size="11">正常关闭 → P06-11 / C03-03</text><rect x="260" y="465" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="278" y="493" font-family="Arial,sans-serif" font-size="13" font-weight="bold">权限 / Guard</text><text x="278" y="517" font-family="Arial,sans-serif" font-size="11">consultation pending; actor is responsible employee or authorized</text><text x="278" y="539" font-family="Arial,sans-serif" font-size="11">manager/store manager in data scope；consultation open;</text><text x="278" y="561" font-family="Arial,sans-serif" font-size="11">actor is current responsible employee or authorized manager/store</text><text x="278" y="583" font-family="Arial,sans-serif" font-size="11">manager in data scope; append follow-up without changing customer owner；</text><rect x="838" y="465" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="493" font-family="Arial,sans-serif" font-size="13" font-weight="bold">返回 / 退出</text><text x="856" y="517" font-family="Arial,sans-serif" font-size="11">正常关闭→P06-11 / C03-03</text><text x="260" y="840" font-family="Arial,sans-serif" font-size="11">结构级低保真：仅表达页面/状态/动作/权限/导航，不冻结高保真视觉。</text></svg>