<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="100%" height="100%" fill="white"/><rect x="10" y="10" width="1420" height="880" rx="8" fill="none" stroke="#444" stroke-width="2"/><rect x="20" y="20" width="210" height="860" fill="#f2f2f2" stroke="#aaa"/><text x="40" y="54" font-family="Arial,sans-serif" font-size="18" font-weight="bold">名邦汽车 PC · Low-Fi V1</text><text x="260" y="48" font-family="Arial,sans-serif" font-size="13">P04-06-V5-HANDOFF_IN_PROGRESS</text><text x="260" y="78" font-family="Arial,sans-serif" font-size="22" font-weight="bold">离职 / 失去业务资格客户与活跃业务交接</text><text x="260" y="106" font-family="Arial,sans-serif" font-size="13">状态：HANDOFF_IN_PROGRESS ｜ 角色：PC/后台</text><rect x="260" y="135" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="278" y="163" font-family="Arial,sans-serif" font-size="13" font-weight="bold">状态语义</text><text x="278" y="187" font-family="Arial,sans-serif" font-size="11">employee_id remains stable; inactive/lost eligibility blocks new</text><text x="278" y="209" font-family="Arial,sans-serif" font-size="11">responsibility and active work is mapped;</text><text x="278" y="231" font-family="Arial,sans-serif" font-size="11">reinstatement requires fresh authorization, accepting defaults OFF,</text><text x="278" y="253" font-family="Arial,sans-serif" font-size="11">and never revives old permissions/customers/business/responsibility</text><rect x="838" y="135" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="163" font-family="Arial,sans-serif" font-size="13" font-weight="bold">权威依据</text><text x="856" y="187" font-family="Arial,sans-serif" font-size="11">Step4/5; NEW-02/NEW4-01</text><rect x="260" y="300" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="278" y="328" font-family="Arial,sans-serif" font-size="13" font-weight="bold">页面入口</text><text x="278" y="352" font-family="Arial,sans-serif" font-size="11">P06-02：转派归属；P04-01：停用 4S 成员并启动接管；P04-07：确认交接批次</text><rect x="838" y="300" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="328" font-family="Arial,sans-serif" font-size="13" font-weight="bold">关键动作</text><text x="856" y="352" font-family="Arial,sans-serif" font-size="11">完成交接 → P04-07；启动资格丧失交接 → P04-07</text><rect x="260" y="465" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="278" y="493" font-family="Arial,sans-serif" font-size="13" font-weight="bold">权限 / Guard</text><text x="278" y="517" font-family="Arial,sans-serif" font-size="11">REF_GUARD[EMPLOYEE_HANDOFF]；local_ui_fact=all affected active objects</text><text x="278" y="539" font-family="Arial,sans-serif" font-size="11">have explicit mappings to eligible targets; enter batch confirmation;</text><text x="278" y="561" font-family="Arial,sans-serif" font-size="11">submit rechecks every target and object state；</text><text x="278" y="583" font-family="Arial,sans-serif" font-size="11">REF_GUARD[EMPLOYEE_HANDOFF]；local_ui_fact=employee inactive,</text><rect x="838" y="465" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="493" font-family="Arial,sans-serif" font-size="13" font-weight="bold">返回 / 退出</text><text x="856" y="517" font-family="Arial,sans-serif" font-size="11">返回 P04 页面组；不产生业务事实</text><text x="260" y="840" font-family="Arial,sans-serif" font-size="11">结构级低保真：仅表达页面/状态/动作/权限/导航，不冻结高保真视觉。</text></svg>