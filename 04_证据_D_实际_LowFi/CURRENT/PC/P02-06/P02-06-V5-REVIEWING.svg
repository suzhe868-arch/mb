<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="100%" height="100%" fill="white"/><rect x="10" y="10" width="1420" height="880" rx="8" fill="none" stroke="#444" stroke-width="2"/><rect x="20" y="20" width="210" height="860" fill="#f2f2f2" stroke="#aaa"/><text x="40" y="54" font-family="Arial,sans-serif" font-size="18" font-weight="bold">名邦汽车 PC · Low-Fi V1</text><text x="260" y="48" font-family="Arial,sans-serif" font-size="13">P02-06-V5-REVIEWING</text><text x="260" y="78" font-family="Arial,sans-serif" font-size="22" font-weight="bold">异常</text><text x="260" y="106" font-family="Arial,sans-serif" font-size="13">状态：REVIEWING ｜ 角色：PC/后台</text><rect x="260" y="135" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="278" y="163" font-family="Arial,sans-serif" font-size="13" font-weight="bold">状态语义</text><text x="278" y="187" font-family="Arial,sans-serif" font-size="11">Anomaly is a risk/review fact; it does not uniformly block new business.</text><text x="278" y="209" font-family="Arial,sans-serif" font-size="11">Real offline/unavailable/sold facts + each business Guard decide availability; existing Lock/funds/Transaction/history remain.</text><rect x="838" y="135" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="163" font-family="Arial,sans-serif" font-size="13" font-weight="bold">权威依据</text><text x="856" y="187" font-family="Arial,sans-serif" font-size="11">NEW4-02</text><rect x="260" y="300" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="278" y="328" font-family="Arial,sans-serif" font-size="13" font-weight="bold">页面入口</text><text x="278" y="352" font-family="Arial,sans-serif" font-size="11">P02-06：查看系统/上游已标记的 identity conflict / supply anomaly；P02-06：人工审查并清除异常</text><rect x="838" y="300" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="328" font-family="Arial,sans-serif" font-size="13" font-weight="bold">关键动作</text><text x="856" y="352" font-family="Arial,sans-serif" font-size="11">查看系统/上游已标记的 identity conflict / supply anomaly → P02-06；</text><text x="856" y="374" font-family="Arial,sans-serif" font-size="11">人工审查并清除异常 → P02-06</text><rect x="260" y="465" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="278" y="493" font-family="Arial,sans-serif" font-size="13" font-weight="bold">权限 / Guard</text><text x="278" y="517" font-family="Arial,sans-serif" font-size="11">anomaly is produced by verified source/system evidence;</text><text x="278" y="539" font-family="Arial,sans-serif" font-size="11">page is read/triage entry, not an invented manual anomaly-creation</text><text x="278" y="561" font-family="Arial,sans-serif" font-size="11">authority; anomaly itself does not block all new business; real source/resource saleability and each business Guard decide availability; existing Lock/funds/Transaction and</text><text x="278" y="583" font-family="Arial,sans-serif" font-size="11">history remain；authorized reviewer; evidence/reason required;</text><rect x="838" y="465" width="562" height="140" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="5 3"/><text x="856" y="493" font-family="Arial,sans-serif" font-size="13" font-weight="bold">返回 / 退出</text><text x="856" y="517" font-family="Arial,sans-serif" font-size="11">返回 P02 页面组；不产生业务事实</text><text x="260" y="840" font-family="Arial,sans-serif" font-size="11">结构级低保真：仅表达页面/状态/动作/权限/导航，不冻结高保真视觉。</text></svg>