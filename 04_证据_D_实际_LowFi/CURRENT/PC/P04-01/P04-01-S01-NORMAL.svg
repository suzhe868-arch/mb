 x="806" y="825" width="170" height="40" rx="5" fill="#eee" stroke="#555"/><text x="891.0" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">log view strictly by p</text><rect x="260" y="910" width="1140" height="220" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="276" y="936" font-family="Arial,sans-serif" font-size="14" font-weight="bold">IA V5 当前施工校准（下方为设计注释，不属于成品视觉）</text><text x="276" y="959" font-family="Arial,sans-serif" font-size="11" font-weight="bold">PAGE_ID：P04-01｜员工管理｜资产处理：MODIFY｜当前物理状态：NORMAL</text><text x="276" y="979" font-family="Arial,sans-serif" font-size="11">本轮局部调整： EMPLOYEE_ACTIVE, INACTIVE_HANDOFF_REQUIRED, REINSTATED_NO_AUTO_RESTORE；IA-07: 4S 管理权限、合作范围与裁剪态</text><text x="276" y="999" font-family="Arial,sans-serif" font-size="11">关键动作： 新增 4S 成员→P04-01；停用 4S 成员并启动接管→P04-06 / P02-04；新增/停用/恢复普通员工→P04-01</text><text x="276" y="1019" font-family="Arial,sans-serif" font-size="11">Guard/权限： actor is store manager with 4S-member-management permission and covering cooperation scope,</text><text x="276" y="1037" font-family="Arial,sans-serif" font-size="11">or manager explicitly granted both; System Admin identity alone is ineligible; preserve lifecycle audit；</text><text x="276" y="1055" font-family="Arial,sans-serif" font-size="11">REF_GUARD[4S_TAKEOVER]；local_ui_fact=same D7 authority/scope guard;</text><text x="276" y="1073" font-family="Arial,sans-serif" font-size="11">immediately revoke access, pause affected 4S vehicle display/matching,</text><text x="276" y="1091" font-family="Arial,sans-serif" font-size="11">preserve source_type=4S and existing Lock/funds/Transaction, then map responsibility to eligible Mingbang targets;</text><text x="276" y="1109" font-family="Arial,sans-serif" font-size="11">invalid supply enters anomaly review</text><text x="276" y="1129" font-family="Arial,sans-serif" font-size="11">Back/Exit： 返回 P04 页面组；不产生业务事实</text></svg>