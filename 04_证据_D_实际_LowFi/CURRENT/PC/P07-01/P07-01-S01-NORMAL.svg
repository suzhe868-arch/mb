="806" y="825" width="170" height="40" rx="5" fill="#eee" stroke="#555"/><text x="891.0" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">log view strictly by p</text><rect x="260" y="910" width="1140" height="220" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="276" y="936" font-family="Arial,sans-serif" font-size="14" font-weight="bold">IA V5 当前施工校准（下方为设计注释，不属于成品视觉）</text><text x="276" y="959" font-family="Arial,sans-serif" font-size="11" font-weight="bold">PAGE_ID：P07-01｜锁车｜资产处理：MODIFY｜当前物理状态：NORMAL</text><text x="276" y="979" font-family="Arial,sans-serif" font-size="11">本轮局部调整： DEFAULT_LOCK_DURATION_CONFIGURED, EXPIRED, HISTORICAL, LOCKED, LOCK_CREATE_CONFIRM_REQUIRED,</text><text x="276" y="997" font-family="Arial,sans-serif" font-size="11">LOCK_DURATION_SNAPSHOTTED, PERMISSION_DENIED, RELEASED；IA-15: Waitlist/Lock/交易/退款 CTA、历史和正向投影</text><text x="276" y="1017" font-family="Arial,sans-serif" font-size="11">关键动作： 释放/取消锁车→E07-M01；确认创建 Lock→P07-01 / E07-01 / C03-04；取消创建 Lock→P07-02；记录意向金→P07-03</text><text x="276" y="1037" font-family="Arial,sans-serif" font-size="11">Guard/权限： REF_GUARD[LOCK_CREATE_CANCEL]；local_ui_fact=active Lock;</text><text x="276" y="1055" font-family="Arial,sans-serif" font-size="11">current responsible employee or authorized manager/store manager with covering data scope; reason required;</text><text x="276" y="1073" font-family="Arial,sans-serif" font-size="11">reuse one Lock release confirmation；REF_GUARD[LOCK_CREATE_CANCEL]；</text><text x="276" y="1091" font-family="Arial,sans-serif" font-size="11">local_ui_fact=exact canonical final-submit Lock guard as E02-04/E03-06: page state=LOCK_CREATE_CONFIRM_REQUIRED;</text><text x="276" y="1109" font-family="Arial,sans-serif" font-size="11">actor is active eligible Mingbang employee, not 4S, and is current responsible employee or authorized manager/store manager</text><text x="276" y="1127" font-family="Arial,sans-serif" font-size="11">with explicit Lock capability; submit revalidates identity, permission, customer/vehicle scope,</text><text x="276" y="1145" font-family="Arial,sans-serif" font-size="11">current listing_cycle and source/occupancy lockability; create/reuse one active Lock idempotently</text><text x="276" y="1165" font-family="Arial,sans-serif" font-size="11">Back/Exit： 释放/取消锁车→E07-M01；取消创建 Lock→P07-02</text></svg>