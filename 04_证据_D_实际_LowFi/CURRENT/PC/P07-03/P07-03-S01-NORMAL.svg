 x="806" y="825" width="170" height="40" rx="5" fill="#eee" stroke="#555"/><text x="891.0" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">log view strictly by p</text><rect x="260" y="910" width="1140" height="220" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="276" y="936" font-family="Arial,sans-serif" font-size="14" font-weight="bold">IA V5 当前施工校准（下方为设计注释，不属于成品视觉）</text><text x="276" y="959" font-family="Arial,sans-serif" font-size="11" font-weight="bold">PAGE_ID：P07-03｜意向金｜资产处理：MODIFY｜当前物理状态：NORMAL</text><text x="276" y="979" font-family="Arial,sans-serif" font-size="11">本轮局部调整： CORRECTED, EMPTY, HISTORICAL, PERMISSION_DENIED, RECORDED；IA-04: 收款、交易、退款分权 CTA；IA-10: 追加冲正/更正确认与历史</text><text x="276" y="999" font-family="Arial,sans-serif" font-size="11">关键动作： 记录实际意向金→P07-03；追加冲正/更正→P07-M02</text><text x="276" y="1019" font-family="Arial,sans-serif" font-size="11">Guard/权限： actor is current business/Transaction owner with covering data scope; valid Lock/Transaction;</text><text x="276" y="1037" font-family="Arial,sans-serif" font-size="11">append actual receipt fact idempotently；same business guard as E07-04: manager/store manager with funds-correction permission</text><text x="276" y="1055" font-family="Arial,sans-serif" font-size="11">and covering data scope; append-only reason required</text><text x="276" y="1075" font-family="Arial,sans-serif" font-size="11">Back/Exit： 返回 P07 页面组；不产生业务事实</text></svg>