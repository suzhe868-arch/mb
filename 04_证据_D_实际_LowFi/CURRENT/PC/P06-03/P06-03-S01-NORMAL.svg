t><rect x="806" y="825" width="170" height="40" rx="5" fill="#eee" stroke="#555"/><text x="891.0" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">log view strictly by p</text><rect x="260" y="910" width="1140" height="220" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="276" y="936" font-family="Arial,sans-serif" font-size="14" font-weight="bold">IA V5 当前施工校准（下方为设计注释，不属于成品视觉）</text><text x="276" y="959" font-family="Arial,sans-serif" font-size="11" font-weight="bold">PAGE_ID：P06-03｜客户画像｜资产处理：MODIFY｜当前物理状态：NORMAL</text><text x="276" y="979" font-family="Arial,sans-serif" font-size="11">本轮局部调整： COLLABORATION_ACTIVE, COLLABORATION_ENDED, COLLABORATION_HISTORICAL, REBUILD_REQUIRED；IA-03: 个人备注/共享画像分区及可见/继承边界；</text><text x="276" y="997" font-family="Arial,sans-serif" font-size="11">IA-19: 最小个人备注/共享画像，删除大字段倾向</text><text x="276" y="1017" font-family="Arial,sans-serif" font-size="11">关键动作： 新增/更新本人 Personal Note→E03-02 / P06-03；更新 Shared Profile→E03-02 / P06-03；建立 Collaboration→P06-03 / P06-04；</text><text x="276" y="1035" font-family="Arial,sans-serif" font-size="11">结束 Collaboration→P06-03 / P06-04</text><text x="276" y="1055" font-family="Arial,sans-serif" font-size="11">Guard/权限： actor is the note author and customer is visible in scope;</text><text x="276" y="1073" font-family="Arial,sans-serif" font-size="11">personal note remains author-private and is not transferred with owner；</text><text x="276" y="1091" font-family="Arial,sans-serif" font-size="11">actor is current owner, explicit collaborator within collaboration scope,</text><text x="276" y="1109" font-family="Arial,sans-serif" font-size="11">or authorized manager/store manager covering customer scope; audit before/after; never expose personal notes</text><text x="276" y="1129" font-family="Arial,sans-serif" font-size="11">Back/Exit： 返回 P06 页面组；不产生业务事实</text></svg>