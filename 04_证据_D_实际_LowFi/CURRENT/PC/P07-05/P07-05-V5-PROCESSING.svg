<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
 <rect width="1440" height="900" fill="white"/>
 <text x="72" y="90" font-size="32" font-family="Arial, sans-serif">P07-05 · 退款</text>
 <text x="72" y="145" font-size="22" font-family="Arial, sans-serif">状态：PENDING</text>
 <text x="72" y="215" font-size="18" font-family="Arial, sans-serif">主状态仅 pending / refunded / closed。退款未真实发生，不占车。</text>
 <text x="72" y="265" font-size="18" font-family="Arial, sans-serif">实际退款读取现有 refund/funds confirmation capability + data scope。</text>
 <text x="72" y="315" font-size="18" font-family="Arial, sans-serif">关闭 pending：当前合法 handler + 既有适用 capability + scope + close_reason；无专门 close capability/审批。</text>
</svg>