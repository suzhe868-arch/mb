<svg xmlns="http://www.w3.org/2000/svg" width="780" height="844" viewBox="0 0 780 844"><rect width="100%" height="100%" fill="white"/><rect x="8" y="8" width="374" height="828" rx="24" fill="none" stroke="#444" stroke-width="2"/><text x="24" y="34" font-family="Arial,sans-serif" font-size="12">E02-02-S01-NORMAL</text><text x="24" y="54" font-family="Arial,sans-serif" font-size="15" font-weight="bold">发布 / 编辑人工车辆</text><rect x="20" y="70" width="350" height="58" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="91" font-family="Arial,sans-serif" font-size="11" font-weight="bold">车型</text><text x="30" y="113" font-family="Arial,sans-serif" font-size="9">来源类型 · 品牌 → 车系 → 年款 → 具体车型/配置</text><rect x="20" y="136" width="350" height="58" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="157" font-family="Arial,sans-serif" font-size="11" font-weight="bold">单车事实</text><text x="30" y="179" font-family="Arial,sans-serif" font-size="9">表显里程 · 城市 · 车身/内饰标准颜色 · VIN</text><rect x="20" y="202" width="350" height="58" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="223" font-family="Arial,sans-serif" font-size="11" font-weight="bold">车况</text><text x="30" y="245" font-family="Arial,sans-serif" font-size="9">description · 车况标签（选填、多选、manual provenance）</text><rect x="20" y="268" width="350" height="58" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="289" font-family="Arial,sans-serif" font-size="11" font-weight="bold">图片</text><text x="30" y="311" font-family="Arial,sans-serif" font-size="9">图片可为0张；无图时使用默认占位图</text><rect x="20" y="334" width="350" height="58" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="355" font-family="Arial,sans-serif" font-size="11" font-weight="bold">自动保存</text><text x="30" y="377" font-family="Arial,sans-serif" font-size="9">填写过程防抖保存；离开时刷新最后修改；没有手动保存按钮</text><rect x="20" y="400" width="350" height="58" rx="5" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="421" font-family="Arial,sans-serif" font-size="11" font-weight="bold">发布校验</text><text x="30" y="443" font-family="Arial,sans-serif" font-size="9">一次列出并高亮全部缺失项；人工车不走发布后补必填资料</text><rect x="20.0" y="744" width="350.0" height="38" rx="5" fill="#eee" stroke="#555"/><text x="195.0" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">发布</text><line x1="20" y1="804" x2="370" y2="804" stroke="#999"/><text x="195" y="824" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">名邦汽车 V1 · CR-006.2</text><rect x="405" y="30" width="350" height="780" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="419" y="54" font-family="Arial,sans-serif" font-size="12" font-weight="bold">IA V5 当前施工校准（右侧为设计注释，不属于成品视觉）</text><text x="419" y="78" font-family="Arial,sans-serif" font-size="10" font-weight="bold">PAGE_ID：E02-02｜发布 / 编辑人工车辆</text><text x="419" y="100" font-family="Arial,sans-serif" font-size="10">资产处理：MODIFY｜当前物理状态：NORMAL</text><text x="419" y="122" font-family="Arial,sans-serif" font-size="10">逻辑状态：NORMAL, PROCESSING,</text><text x="419" y="140" font-family="Arial,sans-serif" font-size="10">PARTIAL_FAILURE, ERROR,</text><text x="419" y="158" font-family="Arial,sans-serif" font-size="10">DISABLED, MODEL_MISSING,</text><text x="419" y="176" font-family="Arial,sans-serif" font-size="10">DRAFT_LIST, IMAGE_RETRYING…</text><text x="419" y="198" font-family="Arial,sans-serif" font-size="10">本轮局部调整： IMAGE_MANUAL_RECOVERY,</text><text x="419" y="216" font-family="Arial,sans-serif" font-size="10">IMAGE_RECOVERED, IMAGE_RETRYING；</text><text x="419" y="234" font-family="Arial,sans-serif" font-size="10">IA-22: 三类时间标签与历史审计筛选</text><text x="419" y="256" font-family="Arial,sans-serif" font-size="10">关键动作： 查看车辆图片→C-O04；自动保存→E02-02；</text><text x="419" y="274" font-family="Arial,sans-serif" font-size="10">查看草稿列表；继续编辑目标草稿；正式发布目标草稿；删除纯草稿</text><text x="419" y="296" font-family="Arial,sans-serif" font-size="10">Guard/权限： actor must already</text><text x="419" y="314" font-family="Arial,sans-serif" font-size="10">have current vehicle-view</text><text x="419" y="332" font-family="Arial,sans-serif" font-size="10">permission in the same</text><text x="419" y="350" font-family="Arial,sans-serif" font-size="10">visibility context;</text><text x="419" y="368" font-family="Arial,sans-serif" font-size="10">image access inherits vehicle</text><text x="419" y="386" font-family="Arial,sans-serif" font-size="10">visibility, including</text><text x="419" y="404" font-family="Arial,sans-serif" font-size="10">hidden/Priority controlled</text><text x="419" y="422" font-family="Arial,sans-serif" font-size="10">visibility; selected image</text><text x="419" y="440" font-family="Arial,sans-serif" font-size="10">belongs to the visible frozen</text><text x="419" y="458" font-family="Arial,sans-serif" font-size="10">image set；form changed;</text><text x="419" y="476" font-family="Arial,sans-serif" font-size="10">debounce/leave flush</text><text x="419" y="498" font-family="Arial,sans-serif" font-size="10">Entry： C-O04：关闭图片预览；E02：发布车辆；E02：更多→草稿车源；</text><text x="419" y="516" font-family="Arial,sans-serif" font-size="10">E02-02：自动保存</text><text x="419" y="538" font-family="Arial,sans-serif" font-size="10">Back/Exit： 返回 E02 页面组；不产生业务事实</text></svg>