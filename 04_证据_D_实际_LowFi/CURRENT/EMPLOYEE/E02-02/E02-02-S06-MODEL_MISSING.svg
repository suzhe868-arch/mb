<svg xmlns="http://www.w3.org/2000/svg" width="780" height="844" viewBox="0 0 780 844"><rect width="100%" height="100%" fill="white"/><rect x="8" y="8" width="374" height="828" rx="24" fill="none" stroke="#444" stroke-width="2"/><text x="24" y="34" font-family="Arial,sans-serif" font-size="12" fill="#111">E02-02-S06-MODEL_MISSING</text><text x="24" y="52" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">车型不存在 / 待补主档</text><rect x="20" y="68" width="350" height="70" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="88" font-family="Arial,sans-serif" font-size="11" fill="#111">车型目录未命中</text><text x="30" y="108" font-family="Arial,sans-serif" font-size="9" fill="#111">当前品牌/车系/年款/具体车型无法得到唯一有效 vehicle_model_id</text><rect x="20" y="146" width="350" height="88" rx="5" fill="#f7f7f7" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="166" font-family="Arial,sans-serif" font-size="11" fill="#111">普通销售</text><text x="30" y="186" font-family="Arial,sans-serif" font-size="9" fill="#111">不能创建/修改车型主档；可继续补单车资料并草稿自动保留；正式发布保持阻断</text><rect x="20" y="242" width="350" height="100" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="262" font-family="Arial,sans-serif" font-size="11" fill="#111">授权车型管理员</text><text x="30" y="282" font-family="Arial,sans-serif" font-size="9" fill="#111">先查重品牌/车系/车型 → 必要时创建/确认 → 绑定车型 ID</text><rect x="20" y="350" width="350" height="82" rx="5" fill="#f7f7f7" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="370" font-family="Arial,sans-serif" font-size="11" fill="#111">绑定完成后</text><text x="30" y="390" font-family="Arial,sans-serif" font-size="9" fill="#111">返回上传表单；车型固定参数重新由车型主档投影；再执行发布前一次校验/发布</text><rect x="20" y="440" width="350" height="72" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="460" font-family="Arial,sans-serif" font-size="11" fill="#111">禁止</text><text x="30" y="480" font-family="Arial,sans-serif" font-size="9" fill="#111">禁止自由文本冒充稳定车型 ID；禁止相似车型强绑；禁止绕过查重</text><rect x="20" y="744" width="170" height="38" rx="5" fill="#eee" stroke="#555"/><text x="105.0" y="768" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#111">草稿自动保留</text><rect x="200" y="744" width="170" height="38" rx="5" fill="#eee" stroke="#555"/><text x="285.0" y="768" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#111">新建/确认车型（有权限）</text><line x1="20" y1="804" x2="370" y2="804" stroke="#999"/><text x="195" y="824" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#111">工作台  |  车源  |  客户  |  我的</text><rect x="405" y="30" width="350" height="780" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="419" y="54" font-family="Arial,sans-serif" font-size="12" font-weight="bold">IA V5 当前施工校准（右侧为设计注释，不属于成品视觉）</text><text x="419" y="78" font-family="Arial,sans-serif" font-size="10" font-weight="bold">PAGE_ID：E02-02｜发布 / 编辑人工车辆</text><text x="419" y="100" font-family="Arial,sans-serif" font-size="10">资产处理：MODIFY｜当前物理状态：MODEL_MISSIN</text><text x="419" y="118" font-family="Arial,sans-serif" font-size="10">G</text><text x="419" y="140" font-family="Arial,sans-serif" font-size="10">逻辑状态：NORMAL, PROCESSING,</text><text x="419" y="158" font-family="Arial,sans-serif" font-size="10">PARTIAL_FAILURE, ERROR,</text><text x="419" y="176" font-family="Arial,sans-serif" font-size="10">DISABLED, MODEL_MISSING,</text><text x="419" y="194" font-family="Arial,sans-serif" font-size="10">DRAFT_RESUME, IMAGE_RETRYING…</text><text x="419" y="216" font-family="Arial,sans-serif" font-size="10">本轮局部调整： IMAGE_MANUAL_RECOVERY,</text><text x="419" y="234" font-family="Arial,sans-serif" font-size="10">IMAGE_RECOVERED, IMAGE_RETRYING；</text><text x="419" y="252" font-family="Arial,sans-serif" font-size="10">IA-22: 三类时间标签与历史审计筛选</text><text x="419" y="274" font-family="Arial,sans-serif" font-size="10">关键动作： 查看车辆图片→C-O04；自动保存→E02-02；</text><text x="419" y="292" font-family="Arial,sans-serif" font-size="10">继续上次→E02-02；放弃重新发布→E02-02</text><text x="419" y="314" font-family="Arial,sans-serif" font-size="10">Guard/权限： actor must already</text><text x="419" y="332" font-family="Arial,sans-serif" font-size="10">have current vehicle-view</text><text x="419" y="350" font-family="Arial,sans-serif" font-size="10">permission in the same</text><text x="419" y="368" font-family="Arial,sans-serif" font-size="10">visibility context;</text><text x="419" y="386" font-family="Arial,sans-serif" font-size="10">image access inherits vehicle</text><text x="419" y="404" font-family="Arial,sans-serif" font-size="10">visibility, including</text><text x="419" y="422" font-family="Arial,sans-serif" font-size="10">hidden/Priority controlled</text><text x="419" y="440" font-family="Arial,sans-serif" font-size="10">visibility; selected image</text><text x="419" y="458" font-family="Arial,sans-serif" font-size="10">belongs to the visible frozen</text><text x="419" y="476" font-family="Arial,sans-serif" font-size="10">image set；form changed;</text><text x="419" y="494" font-family="Arial,sans-serif" font-size="10">debounce/leave flush</text><text x="419" y="516" font-family="Arial,sans-serif" font-size="10">Entry： C-O04：关闭图片预览；E02：发布车辆；</text><text x="419" y="534" font-family="Arial,sans-serif" font-size="10">E02-02：自动保存</text><text x="419" y="556" font-family="Arial,sans-serif" font-size="10">Back/Exit： 返回 E02 页面组；不产生业务事实</text></svg>