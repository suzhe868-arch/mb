ect x="405" y="30" width="350" height="780" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="419" y="54" font-family="Arial,sans-serif" font-size="12" font-weight="bold">IA V5 当前施工校准（右侧为设计注释，不属于成品视觉）</text><text x="419" y="78" font-family="Arial,sans-serif" font-size="10" font-weight="bold">PAGE_ID：E02-02｜发布 / 编辑人工车辆</text><text x="419" y="100" font-family="Arial,sans-serif" font-size="10">资产处理：MODIFY｜当前物理状态：PROCESSING</text><text x="419" y="122" font-family="Arial,sans-serif" font-size="10">逻辑状态：NORMAL, PROCESSING,</text><text x="419" y="140" font-family="Arial,sans-serif" font-size="10">PARTIAL_FAILURE, ERROR,</text><text x="419" y="158" font-family="Arial,sans-serif" font-size="10">DISABLED, MODEL_MISSING,</text><text x="419" y="176" font-family="Arial,sans-serif" font-size="10">DRAFT_RESUME, IMAGE_RETRYING…</text><text x="419" y="198" font-family="Arial,sans-serif" font-size="10">本轮局部调整： IMAGE_MANUAL_RECOVERY,</text><text x="419" y="216" font-family="Arial,sans-serif" font-size="10">IMAGE_RECOVERED, IMAGE_RETRYING；</text><text x="419" y="234" font-family="Arial,sans-serif" font-size="10">IA-22: 三类时间标签与历史审计筛选</text><text x="419" y="256" font-family="Arial,sans-serif" font-size="10">关键动作： 查看车辆图片→C-O04；自动保存→E02-02；</text><text x="419" y="274" font-family="Arial,sans-serif" font-size="10">继续上次→E02-02；放弃重新发布→E02-02</text><text x="419" y="296" font-family="Arial,sans-serif" font-size="10">Guard/权限： actor must already</text><text x="419" y="314" font-family="Arial,sans-serif" font-size="10">have current vehicle-view</text><text x="419" y="332" font-family="Arial,sans-serif" font-size="10">permission in the same</text><text x="419" y="350" font-family="Arial,sans-serif" font-size="10">visibility context;</text><text x="419" y="368" font-family="Arial,sans-serif" font-size="10">image access inherits vehicle</text><text x="419" y="386" font-family="Arial,sans-serif" font-size="10">visibility, including</text><text x="419" y="404" font-family="Arial,sans-serif" font-size="10">hidden/Priority controlled</text><text x="419" y="422" font-family="Arial,sans-serif" font-size="10">visibility; selected image</text><text x="419" y="440" font-family="Arial,sans-serif" font-size="10">belongs to the visible frozen</text><text x="419" y="458" font-family="Arial,sans-serif" font-size="10">image set；form changed;</text><text x="419" y="476" font-family="Arial,sans-serif" font-size="10">debounce/leave flush</text><text x="419" y="498" font-family="Arial,sans-serif" font-size="10">Entry： C-O04：关闭图片预览；E02：发布车辆；</text><text x="419" y="516" font-family="Arial,sans-serif" font-size="10">E02-02：自动保存</text><text x="419" y="538" font-family="Arial,sans-serif" font-size="10">Back/Exit： 返回 E02 页面组；不产生业务事实</text></svg>