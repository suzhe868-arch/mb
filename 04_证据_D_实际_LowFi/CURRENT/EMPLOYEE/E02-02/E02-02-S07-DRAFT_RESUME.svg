<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="white"/>
  <text x="72" y="90" font-size="32" font-family="Arial, sans-serif">E02-02 · 草稿车源</text>
  <text x="72" y="145" font-size="20" font-family="Arial, sans-serif">状态：DRAFT_LIST｜多草稿独立管理</text>
  <text x="72" y="215" font-size="18" font-family="Arial, sans-serif">入口：E02 → 更多 → 草稿车源</text>
  <text x="72" y="265" font-size="18" font-family="Arial, sans-serif">仅显示当前操作者有权管理范围内的 draft</text>
  <text x="72" y="315" font-size="18" font-family="Arial, sans-serif">每条草稿：继续编辑｜正式发布｜删除纯草稿（二次确认）</text>
  <text x="72" y="365" font-size="18" font-family="Arial, sans-serif">新增车源永远从空白新建开始，不自动恢复“上次草稿”</text>
  <text x="72" y="415" font-size="18" font-family="Arial, sans-serif">多个 draft 互相独立；删除目标 draft 不影响其他草稿</text>
  <text x="72" y="495" font-size="16" font-family="Arial, sans-serif">物理文件名保留 DRAFT_RESUME 仅为历史 Manifest 连续性；Current 逻辑状态已改为 DRAFT_LIST。</text>
</svg>