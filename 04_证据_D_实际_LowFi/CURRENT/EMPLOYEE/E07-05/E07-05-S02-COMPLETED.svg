<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
 <rect width="1440" height="900" fill="white"/>
 <text x="72" y="90" font-size="32" font-family="Arial, sans-serif">E07-05 · 退款</text>
 <text x="72" y="145" font-size="22" font-family="Arial, sans-serif">状态：REFUNDED</text>
 <text x="72" y="215" font-size="18" font-family="Arial, sans-serif">真实退款事实已发生；保留金额、actor、time、source 与多笔退款历史。</text>
 <text x="72" y="265" font-size="18" font-family="Arial, sans-serif">REFUNDED ≠ CLOSED；closed 表示决定不再退款且必须有 close_reason。</text>
 <text x="72" y="330" font-size="15" font-family="Arial, sans-serif">物理文件名 COMPLETED 仅为历史 Manifest 连续性；Current 逻辑状态=REFUNDED。</text>
</svg>