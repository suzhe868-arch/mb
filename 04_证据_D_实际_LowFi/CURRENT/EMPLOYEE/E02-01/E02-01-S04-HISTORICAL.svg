<svg xmlns="http://www.w3.org/2000/svg" width="780" height="844" viewBox="0 0 780 844"><rect width="100%" height="100%" fill="white"/><rect x="8" y="8" width="374" height="828" rx="24" fill="none" stroke="#444" stroke-width="2"/><text x="24" y="34" font-family="Arial,sans-serif" font-size="12" fill="#111">E02-01-S04-HISTORICAL</text><text x="24" y="52" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">员工车辆详情</text><rect x="20" y="68" width="350" height="52" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="88" font-family="Arial,sans-serif" font-size="11" fill="#111">HISTORICAL</text><text x="30" y="108" font-family="Arial,sans-serif" font-size="9" fill="#111">历史只读安全投影</text><rect x="20" y="128" width="350" height="58" rx="5" fill="#f7f7f7" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="148" font-family="Arial,sans-serif" font-size="11" fill="#111">客户安全顶部导航</text><text x="30" y="168" font-family="Arial,sans-serif" font-size="9" fill="#111">返回/主页 ｜ 分享车源 ｜ 车辆标题</text><rect x="20" y="194" width="350" height="64" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="214" font-family="Arial,sans-serif" font-size="11" fill="#111">车辆信息 + 客户展示信息</text><text x="30" y="234" font-family="Arial,sans-serif" font-size="9" fill="#111">图片 / 车型 / 基础参数 / 客户可见车况档案 / 客户展示价</text><rect x="20" y="266" width="350" height="58" rx="5" fill="#f7f7f7" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="286" font-family="Arial,sans-serif" font-size="11" fill="#111">外层高频动作</text><text x="30" y="306" font-family="Arial,sans-serif" font-size="9" fill="#111">推荐给客户 / 锁车；后端仍校验权限和状态</text><rect x="20" y="332" width="350" height="58" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="352" font-family="Arial,sans-serif" font-size="11" fill="#111">内部模式入口</text><text x="30" y="372" font-family="Arial,sans-serif" font-size="9" fill="#111">仅长按价格区域约3秒触发；没有显眼 internal-mode 按钮</text><rect x="20" y="398" width="350" height="70" rx="5" fill="#f7f7f7" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="418" font-family="Arial,sans-serif" font-size="11" fill="#111">客户安全边界</text><text x="30" y="438" font-family="Arial,sans-serif" font-size="9" fill="#111">默认不返回/不渲染：内部价、上游电话、编辑、调价、上下架、一键转名邦</text><rect x="20" y="476" width="350" height="58" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="496" font-family="Arial,sans-serif" font-size="11" fill="#111">日期辅助区 + VEHICLE_DETAIL</text><text x="30" y="516" font-family="Arial,sans-serif" font-size="9" fill="#111">复制仅车辆名称/完整车型、车况；上游电话不复制</text><rect x="20" y="744" width="350" height="38" rx="5" fill="#f5f5f5" stroke="#999"/><text x="195.0" y="768" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#111">历史只读：不展示可写业务动作</text><line x1="20" y1="804" x2="370" y2="804" stroke="#999"/><text x="195" y="824" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#111">工作台  |  车源  |  客户  |  我的</text><rect x="405" y="30" width="350" height="780" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="419" y="54" font-family="Arial,sans-serif" font-size="12" font-weight="bold">IA V5 当前施工校准（右侧为设计注释，不属于成品视觉）</text><text x="419" y="78" font-family="Arial,sans-serif" font-size="10" font-weight="bold">PAGE_ID：E02-01｜员工车辆详情</text><text x="419" y="100" font-family="Arial,sans-serif" font-size="10">资产处理：MODIFY｜当前物理状态：HISTORICAL</text><text x="419" y="122" font-family="Arial,sans-serif" font-size="10">逻辑状态：NORMAL, LOADING, LOCKED,</text><text x="419" y="140" font-family="Arial,sans-serif" font-size="10">HISTORICAL, PERMISSION_DENIED,</text><text x="419" y="158" font-family="Arial,sans-serif" font-size="10">IMAGE_PARTIAL_FAILED,</text><text x="419" y="176" font-family="Arial,sans-serif" font-size="10">IMAGE_FAILED, IMAGE_RETRYING…</text><text x="419" y="198" font-family="Arial,sans-serif" font-size="10">本轮局部调整： IMAGE_FAILED,</text><text x="419" y="216" font-family="Arial,sans-serif" font-size="10">IMAGE_MANUAL_RECOVERY,</text><text x="419" y="234" font-family="Arial,sans-serif" font-size="10">IMAGE_PARTIAL_FAILED,</text><text x="419" y="252" font-family="Arial,sans-serif" font-size="10">IMAGE_RECOVERED,</text><text x="419" y="270" font-family="Arial,sans-serif" font-size="10">IMAGE_RETRYING, PHONE_CACHE_AVA</text><text x="419" y="288" font-family="Arial,sans-serif" font-size="10">ILABLE, PHONE_LATEST,</text><text x="419" y="306" font-family="Arial,sans-serif" font-size="10">PHONE_LATEST_FAILED_CACHE_AVAIL</text><text x="419" y="324" font-family="Arial,sans-serif" font-size="10">ABLE, PHONE_UNAVAILABLE；</text><text x="419" y="342" font-family="Arial,sans-serif" font-size="10">IA-02: 图片冻结、部分失败、失败不回滚提示；</text><text x="419" y="360" font-family="Arial,sans-serif" font-size="10">IA-08: 新 cycle 不继承旧覆盖价提示/历史标签；</text><text x="419" y="378" font-family="Arial,sans-serif" font-size="10">IA-14: 四级结果、确认、Priority</text><text x="419" y="396" font-family="Arial,sans-serif" font-size="10">与隐藏车受控可见</text><text x="419" y="418" font-family="Arial,sans-serif" font-size="10">关键动作： 查看车辆图片→C-O04；</text><text x="419" y="436" font-family="Arial,sans-serif" font-size="10">员工分享车源给客户→C01-M03；</text><text x="419" y="454" font-family="Arial,sans-serif" font-size="10">推荐给客户→E02-03 / E02-01；</text><text x="419" y="472" font-family="Arial,sans-serif" font-size="10">锁车→E02-04 / E07-01</text><text x="419" y="494" font-family="Arial,sans-serif" font-size="10">Guard/权限： actor must already</text><text x="419" y="512" font-family="Arial,sans-serif" font-size="10">have current vehicle-view</text><text x="419" y="530" font-family="Arial,sans-serif" font-size="10">permission in the same</text><text x="419" y="548" font-family="Arial,sans-serif" font-size="10">visibility context;</text><text x="419" y="566" font-family="Arial,sans-serif" font-size="10">image access inherits vehicle</text><text x="419" y="584" font-family="Arial,sans-serif" font-size="10">visibility, including</text><text x="419" y="602" font-family="Arial,sans-serif" font-size="10">hidden/Priority controlled</text><text x="419" y="620" font-family="Arial,sans-serif" font-size="10">visibility; selected image</text><text x="419" y="638" font-family="Arial,sans-serif" font-size="10">belongs to the visible frozen</text><text x="419" y="656" font-family="Arial,sans-serif" font-size="10">image set；active eligible</text><text x="419" y="674" font-family="Arial,sans-serif" font-size="10">Mingbang employee with vehicle</text><text x="419" y="692" font-family="Arial,sans-serif" font-size="10">in scope creates a D1 share</text><text x="419" y="710" font-family="Arial,sans-serif" font-size="10">link; when customer identity is</text><text x="419" y="728" font-family="Arial,sans-serif" font-size="10">established, apply</text><text x="419" y="746" font-family="Arial,sans-serif" font-size="10">SOURCE_ONLY/OWNER_ASSIGNED/OWNE</text><text x="419" y="764" font-family="Arial,sans-serif" font-size="10">R_UNCHANGED under D1;</text><text x="419" y="782" font-family="Arial,sans-serif" font-size="10">sharing grants no</text><text x="419" y="800" font-family="Arial,sans-serif" font-size="10">Recommendation/price-check</text><text x="419" y="818" font-family="Arial,sans-serif" font-size="10">right</text><text x="419" y="840" font-family="Arial,sans-serif" font-size="10">Entry： C-O04：关闭图片预览；</text><text x="419" y="858" font-family="Arial,sans-serif" font-size="10">C01-M03：完成员工分享结果确认；E02-01：推荐给客户</text><text x="419" y="880" font-family="Arial,sans-serif" font-size="10">Back/Exit： 返回 E02 页面组；不产生业务事实</text></svg>