><text x="329.2" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">lock</text><line x1="20" y1="804" x2="370" y2="804" stroke="#999"/><text x="195" y="824" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">工作台  |  车源  |  客户  |  我的</text><rect x="20" y="536" width="350" height="70" rx="5" fill="#fff" stroke="#999" stroke-dasharray="4 3"/><text x="30" y="556" font-family="Arial,sans-serif" font-size="11">客户画像摘要：整块长按复制</text><text x="30" y="576" font-family="Arial,sans-serif" font-size="10">不逐个结构化画像字段加复制</text><rect x="405" y="30" width="350" height="780" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="419" y="54" font-family="Arial,sans-serif" font-size="12" font-weight="bold">IA V5 当前施工校准（右侧为设计注释，不属于成品视觉）</text><text x="419" y="78" font-family="Arial,sans-serif" font-size="10" font-weight="bold">PAGE_ID：E03-02｜客户画像</text><text x="419" y="100" font-family="Arial,sans-serif" font-size="10">资产处理：MODIFY｜当前物理状态：NORMAL</text><text x="419" y="122" font-family="Arial,sans-serif" font-size="10">逻辑状态：NORMAL</text><text x="419" y="144" font-family="Arial,sans-serif" font-size="10">本轮局部调整： 交互/权限/文案；</text><text x="419" y="162" font-family="Arial,sans-serif" font-size="10">IA-19: Personal Note / Shared Profile / 服务称呼三类独立承载，删除大字段倾向</text><text x="419" y="184" font-family="Arial,sans-serif" font-size="10">关键动作： 新增/更新本人 Personal</text><text x="419" y="202" font-family="Arial,sans-serif" font-size="10">Note→E03-02 / P06-03；</text><text x="419" y="220" font-family="Arial,sans-serif" font-size="10">更新 Shared Profile→E03-02 /</text><text x="419" y="238" font-family="Arial,sans-serif" font-size="10">P06-03；客户画像摘要复制→E03-02</text><text x="419" y="260" font-family="Arial,sans-serif" font-size="10">Guard/权限： actor is the note</text><text x="419" y="278" font-family="Arial,sans-serif" font-size="10">author and customer is visible</text><text x="419" y="296" font-family="Arial,sans-serif" font-size="10">in scope; personal note remains</text><text x="419" y="314" font-family="Arial,sans-serif" font-size="10">author-private and is not</text><text x="419" y="332" font-family="Arial,sans-serif" font-size="10">transferred with owner；</text><text x="419" y="350" font-family="Arial,sans-serif" font-size="10">actor is current owner,</text><text x="419" y="368" font-family="Arial,sans-serif" font-size="10">explicit collaborator within</text><text x="419" y="386" font-family="Arial,sans-serif" font-size="10">collaboration scope,</text><text x="419" y="404" font-family="Arial,sans-serif" font-size="10">or authorized manager/store</text><text x="419" y="422" font-family="Arial,sans-serif" font-size="10">manager covering customer</text><text x="419" y="440" font-family="Arial,sans-serif" font-size="10">scope; audit before/after;</text><text x="419" y="458" font-family="Arial,sans-serif" font-size="10">never expose personal notes；service-name is separate from Personal Note/Shared Profile; preserve author/time/source/change history; historical service alone grants no current CRM access</text><text x="419" y="480" font-family="Arial,sans-serif" font-size="10">Entry： E03-02 / P06-03：新增/更新本人</text><text x="419" y="498" font-family="Arial,sans-serif" font-size="10">Personal Note；E03-02 /</text><text x="419" y="516" font-family="Arial,sans-serif" font-size="10">P06-03：更新 Shared Profile；</text><text x="419" y="534" font-family="Arial,sans-serif" font-size="10">E03-02：客户画像摘要复制</text><text x="419" y="556" font-family="Arial,sans-serif" font-size="10">Back/Exit： 返回 E03 页面组；不产生业务事实</text></svg>