e;</text><text x="419" y="368" font-family="Arial,sans-serif" font-size="10">recheck identity, capability,</text><text x="419" y="386" font-family="Arial,sans-serif" font-size="10">scope and object state;</text><text x="419" y="404" font-family="Arial,sans-serif" font-size="10">create/reuse one active Lock</text><text x="419" y="422" font-family="Arial,sans-serif" font-size="10">idempotently and project LOCKED</text><text x="419" y="440" font-family="Arial,sans-serif" font-size="10">to C03-04；no Lock mutation</text><text x="419" y="462" font-family="Arial,sans-serif" font-size="10">Entry： E02-01：锁车；</text><text x="419" y="480" font-family="Arial,sans-serif" font-size="10">E07-02：人工重新确认并发起 Lock；</text><text x="419" y="498" font-family="Arial,sans-serif" font-size="10">E01-01：审核锁车申请并创建 Lock</text><text x="419" y="520" font-family="Arial,sans-serif" font-size="10">Back/Exit： 取消→E02-01</text></svg>