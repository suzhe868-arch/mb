55"/><text x="329.2" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">lock</text><line x1="20" y1="804" x2="370" y2="804" stroke="#999"/><text x="195" y="824" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">工作台  |  车源  |  客户  |  我的</text><rect x="405" y="30" width="350" height="780" rx="8" fill="white" stroke="#555" stroke-width="1.5"/><text x="419" y="54" font-family="Arial,sans-serif" font-size="12" font-weight="bold">IA V5 当前施工校准（右侧为设计注释，不属于成品视觉）</text><text x="419" y="78" font-family="Arial,sans-serif" font-size="10" font-weight="bold">PAGE_ID：E03-04｜客户业务历史</text><text x="419" y="100" font-family="Arial,sans-serif" font-size="10">资产处理：MODIFY｜当前物理状态：NORMAL</text><text x="419" y="122" font-family="Arial,sans-serif" font-size="10">逻辑状态：NORMAL, RECOMMENDATION_ACT</text><text x="419" y="140" font-family="Arial,sans-serif" font-size="10">IVE, RECOMMENDATION_ENDED,</text><text x="419" y="158" font-family="Arial,sans-serif" font-size="10">RECOMMENDATION_VOID, HISTORICAL</text><text x="419" y="180" font-family="Arial,sans-serif" font-size="10">本轮局部调整： HISTORICAL,</text><text x="419" y="198" font-family="Arial,sans-serif" font-size="10">RECOMMENDATION_ACTIVE,</text><text x="419" y="216" font-family="Arial,sans-serif" font-size="10">RECOMMENDATION_ENDED,</text><text x="419" y="234" font-family="Arial,sans-serif" font-size="10">RECOMMENDATION_VOID</text><text x="419" y="256" font-family="Arial,sans-serif" font-size="10">关键动作： 结束 Recommendation→E03-04</text><text x="419" y="274" font-family="Arial,sans-serif" font-size="10">/ C03-02；作废 Recommendation→E03-</text><text x="419" y="292" font-family="Arial,sans-serif" font-size="10">04 / C03-02；查看 cycle</text><text x="419" y="310" font-family="Arial,sans-serif" font-size="10">结束后的推荐历史→E03-04 / C03-02</text><text x="419" y="332" font-family="Arial,sans-serif" font-size="10">Guard/权限： REF_GUARD[RECOMMENDAT</text><text x="419" y="350" font-family="Arial,sans-serif" font-size="10">ION]；local_ui_fact=active</text><text x="419" y="368" font-family="Arial,sans-serif" font-size="10">Recommendation; actor is the</text><text x="419" y="386" font-family="Arial,sans-serif" font-size="10">current customer owner (the</text><text x="419" y="404" font-family="Arial,sans-serif" font-size="10">only creation actor established</text><text x="419" y="422" font-family="Arial,sans-serif" font-size="10">by current authority);</text><text x="419" y="440" font-family="Arial,sans-serif" font-size="10">submit revalidates owner,</text><text x="419" y="458" font-family="Arial,sans-serif" font-size="10">object and listing_cycle;</text><text x="419" y="476" font-family="Arial,sans-serif" font-size="10">end current object and preserve</text><text x="419" y="494" font-family="Arial,sans-serif" font-size="10">history; do not alter Priority</text><text x="419" y="512" font-family="Arial,sans-serif" font-size="10">or price-check facts already</text><text x="419" y="530" font-family="Arial,sans-serif" font-size="10">granted for the cycle；</text><text x="419" y="548" font-family="Arial,sans-serif" font-size="10">REF_GUARD[RECOMMENDATION]；</text><text x="419" y="566" font-family="Arial,sans-serif" font-size="10">local_ui_fact=active</text><text x="419" y="584" font-family="Arial,sans-serif" font-size="10">Recommendation was created</text><text x="419" y="602" font-family="Arial,sans-serif" font-size="10">incorrectly; actor is the</text><text x="419" y="620" font-family="Arial,sans-serif" font-size="10">current customer owner;</text><text x="419" y="638" font-family="Arial,sans-serif" font-size="10">submit revalidates owner and</text><text x="419" y="656" font-family="Arial,sans-serif" font-size="10">object; mark VOID with reason</text><text x="419" y="674" font-family="Arial,sans-serif" font-size="10">and preserve history;</text><text x="419" y="692" font-family="Arial,sans-serif" font-size="10">correction requires a new</text><text x="419" y="710" font-family="Arial,sans-serif" font-size="10">Recommendation</text><text x="419" y="732" font-family="Arial,sans-serif" font-size="10">Entry： E03-01：查看业务历史；</text><text x="419" y="750" font-family="Arial,sans-serif" font-size="10">E02-03：确认正式推荐；E03-05：确认正式推荐</text><text x="419" y="772" font-family="Arial,sans-serif" font-size="10">Back/Exit： 返回 E03 页面组；不产生业务事实</text></svg>