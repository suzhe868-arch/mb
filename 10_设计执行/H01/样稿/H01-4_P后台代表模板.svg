eight="30" rx="9" fill="#E7F4EE" stroke="none"/><text x="872" y="562" font-size="13" fill="#176A45" font-weight="700" font-family="system-ui,Arial,sans-serif">在售</text><text x="1036" y="565" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">2026-10-07</text><text x="1252" y="565" font-size="14" fill="#C7472D" font-weight="700" font-family="system-ui,Arial,sans-serif">查看</text><line x1="318" y1="603" x2="1351" y2="603" stroke="#EDF0F2"/><rect x="318" y="604" width="1033" height="84" rx="0" fill="#FFFFFF" stroke="none"/><text x="338" y="640" font-size="15" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">示例车型 03 · 2025款</text><text x="338" y="663" font-size="12" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">示例名称，不是公开真实车辆</text><text x="655" y="649" font-size="14" fill="#24282E" font-weight="400" font-family="system-ui,Arial,sans-serif">批发车源</text><rect x="848" y="626" width="82" height="30" rx="9" fill="#F1F2F3" stroke="none"/><text x="872" y="646" font-size="13" fill="#6B7280" font-weight="700" font-family="system-ui,Arial,sans-serif">下架</text><text x="1036" y="649" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">2026-10-06</text><text x="1252" y="649" font-size="14" fill="#C7472D" font-weight="700" font-family="system-ui,Arial,sans-serif">查看</text><line x1="318" y1="687" x2="1351" y2="687" stroke="#EDF0F2"/><text x="319" y="741" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">仅显示当前权限范围内的信息；未授权对象不可通过分页、搜索结果或链接绕过。</text><rect x="318" y="768" width="1033" height="64" rx="10" fill="#F9F7F5" stroke="none"/><text x="337" y="797" font-size="14" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">页面状态提示</text><text x="337" y="820" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">加载/空结果/请求失败/权限撤销/对象状态改变：各有独立反馈，不用“有按钮但灰化”表示无权限。</text><rect x="55" y="897" width="1388" height="88" rx="12" fill="#fff" stroke="none"/><text x="82" y="929" font-size="16" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">审查标注（不属于产品界面）</text><text x="82" y="952" font-size="14" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">PC System Admin 控制平面身份 ≠ 员工业务权限；4S 默认不进入 PC，特殊授权仍受 4S 数据范围限制。</text><text x="82" y="974" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">不新增旧 Collector Base URL / Phone Path 设置、取号测试按钮；操作提交的权限和车辆状态需服务端实时重验。</text></svg>