<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img" aria-labelledby="title desc"><title id="title">H01-4 P02 车源管理后台代表模板</title><desc id="desc">设计评审的 PC 数据列表和权限边界，所有车辆为示例，核心颜色尚未批准。</desc><rect x="0" y="0" width="1500" height="1020" rx="0" fill="#F2F4F6" stroke="none"/><text x="56" y="58" font-size="29" fill="#24282E" font-weight="750" font-family="system-ui,Arial,sans-serif">H01-4｜P PC 后台 · 代表性管理列表</text><text x="56" y="89" font-size="15" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">P02 车源管理 · 当前用户须有合法车辆数据范围；候选 B 未批准 · 此图不对应真实 API / 数据</text><rect x="55" y="122" width="1388" height="748" rx="16" fill="#fff" stroke="#DDE2E6"/><rect x="55" y="122" width="226" height="748" rx="16" fill="#252A30" stroke="none"/><rect x="255" y="122" width="26" height="748" rx="0" fill="#252A30" stroke="none"/><text x="81" y="171" font-size="23" fill="#fff" font-weight="750" font-family="system-ui,Arial,sans-serif">名邦汽车</text><text x="81" y="194" font-size="12" fill="#A7B0BB" font-weight="400" font-family="system-ui,Arial,sans-serif">管理后台 · 品牌文字占位</text><line x1="81" y1="214" x2="251" y2="214" stroke="#46505A"/><text x="91" y="259" font-size="16" fill="#C4CBD2" font-weight="400" font-family="system-ui,Arial,sans-serif">概览</text><rect x="73" y="284" width="189" height="49" rx="11" fill="#46434A" stroke="none"/><rect x="73" y="284" width="4" height="49" rx="2" fill="#C7472D" stroke="none"/><text x="91" y="315" font-size="16" fill="#fff" font-weight="700" font-family="system-ui,Arial,sans-serif">车源管理  ·  P02</text><text x="91" y="369" font-size="13" fill="#B2BBC4" font-weight="400" font-family="system-ui,Arial,sans-serif">其他模块依 Current IA</text><text x="91" y="407" font-size="13" fill="#B2BBC4" font-weight="400" font-family="system-ui,Arial,sans-serif">权限裁剪：可见菜单</text><text x="91" y="821" font-size="13" fill="#BAC3CA" font-weight="400" font-family="system-ui,Arial,sans-serif">C 分支视觉提案</text><text x="318" y="183" font-size="26" fill="#24282E" font-weight="750" font-family="system-ui,Arial,sans-serif">车源管理</text><text x="318" y="207" font-size="14" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">当前有权车辆的浏览与管理，样例仅展示通用安全字段</text><rect x="1168" y="156" width="229" height="42" rx="10" fill="#F4F5F6" stroke="none"/><text x="1210" y="182" font-size="14" fill="#24282E" font-weight="650" font-family="system-ui,Arial,sans-serif">当前业务身份 ▾</text><rect x="318" y="236" width="1033" height="88" rx="12" fill="#F8F9FA" stroke="none"/><rect x="339" y="259" width="333" height="43" rx="9" fill="#fff" stroke="#E2E6EA"/><text x="354" y="286" font-size="14" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">⌕  搜索车源 / 车型</text><rect x="688" y="259" width="134" height="43" rx="9" fill="#fff" stroke="#E2E6EA"/><text x="719" y="287" font-size="14" fill="#24282E" font-weight="400" font-family="system-ui,Arial,sans-serif">来源  ▾</text><rect x="833" y="259" width="133" height="43" rx="9" fill="#fff" stroke="#E2E6EA"/><text x="869" y="287" font-size="14" fill="#24282E" font-weight="400" font-family="system-ui,Arial,sans-serif">状态  ▾</text><rect x="978" y="259" width="136" height="43" rx="9" fill="#fff" stroke="#E2E6EA"/><text x="1014" y="287" font-size="14" fill="#24282E" font-weight="400" font-family="system-ui,Arial,sans-serif">更多筛选</text><rect x="1127" y="259" width="195" height="43" rx="9" fill="#C7472D" stroke="none"/><text x="1194" y="287" font-size="15" fill="#fff" font-weight="700" font-family="system-ui,Arial,sans-serif">查询</text><text x="318" y="371" font-size="17" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">当前有权限的车源</text><text x="1210" y="371" font-size="12" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">此处数据为示例</text><rect x="318" y="387" width="1033" height="49" rx="8" fill="#F2F4F6" stroke="none"/><text x="338" y="418" font-size="14" fill="#24282E" font-weight="700" font-family="system-ui,