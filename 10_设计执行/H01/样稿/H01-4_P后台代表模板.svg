"499" font-size="12" fill="var(--semantic-brand-primary)" font-weight="650" text-anchor="middle">在售</text><text x="1033" y="500" font-size="13" fill="var(--semantic-foreground-secondary)" font-weight="400" text-anchor="start">北京市</text><text x="1180" y="500" font-size="12" fill="var(--semantic-foreground-secondary)" font-weight="400" text-anchor="start">10月08日</text><text x="1309" y="500" font-size="13" fill="var(--semantic-brand-primary)" font-weight="700" text-anchor="start">查看</text><line x1="285" y1="539" x2="1377" y2="539" stroke="var(--semantic-border-subtle)"/><rect x="285" y="541" width="1093" height="84" rx="0" fill="var(--semantic-surface-canvas)" stroke="none"/><text x="305" y="574" font-size="15" fill="var(--semantic-foreground-primary)" font-weight="700" text-anchor="start">示例车型乙 · 2024款</text><text x="305" y="596" font-size="11" fill="var(--semantic-foreground-secondary)" font-weight="400" text-anchor="start">业务数据示意：未接入真实车辆</text><text x="700" y="585" font-size="13" fill="var(--semantic-foreground-primary)" font-weight="400" text-anchor="start">名邦车源</text><rect x="865" y="565" width="78" height="28" rx="7" fill="var(--semantic-brand-subtle)" stroke="none"/><text x="904" y="584" font-size="12" fill="var(--semantic-brand-primary)" font-weight="650" text-anchor="middle">在售</text><text x="1033" y="585" font-size="13" fill="var(--semantic-foreground-secondary)" font-weight="400" text-anchor="start">深圳市</text><text x="1180" y="585" font-size="12" fill="var(--semantic-foreground-secondary)" font-weight="400" text-anchor="start">10月07日</text><text x="1309" y="585" font-size="13" fill="var(--semantic-brand-primary)" font-weight="700" text-anchor="start">查看</text><line x1="285" y1="624" x2="1377" y2="624" stroke="var(--semantic-border-subtle)"/><rect x="285" y="626" width="1093" height="84" rx="0" fill="var(--semantic-surface-panel)" stroke="none"/><text x="305" y="659" font-size="15" fill="var(--semantic-foreground-primary)" font-weight="700" text-anchor="start">示例车型丙 · 2023款</text><text x="305" y="681" font-size="11" fill="var(--semantic-foreground-secondary)" font-weight="400" text-anchor="start">业务数据示意：未接入真实车辆</text><text x="700" y="670" font-size="13" fill="var(--semantic-foreground-primary)" font-weight="400" text-anchor="start">4S 店车源</text><rect x="865" y="650" width="78" height="28" rx="7" fill="var(--semantic-surface-soft)" stroke="none"/><text x="904" y="669" font-size="12" fill="var(--semantic-foreground-secondary)" font-weight="650" text-anchor="middle">已下架</text><text x="1033" y="670" font-size="13" fill="var(--semantic-foreground-secondary)" font-weight="400" text-anchor="start">上海市</text><text x="1180" y="670" font-size="12" fill="var(--semantic-foreground-secondary)" font-weight="400" text-anchor="start">10月06日</text><text x="1309" y="670" font-size="13" fill="var(--semantic-brand-primary)" font-weight="700" text-anchor="start">查看</text><line x1="285" y1="709" x2="1377" y2="709" stroke="var(--semantic-border-subtle)"/><text x="286" y="733" font-size="12" fill="var(--semantic-foreground-secondary)" font-weight="400" text-anchor="start">筛选无结果、加载失败、权限撤销与对象状态变化是不同反馈；未授权数据不进入列表。</text><rect x="267" y="776" width="1131" height="86" rx="11" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="286" y="803" font-size="15" fill="var(--semantic-foreground-primary)" font-weight="750" text-anchor="start">数据/权限边界</text><text x="286" y="828" font-size="12" fill="var(--semantic-foreground-secondary)" font-weight="400" text-anchor="start">System Admin 控制平面身份不默认有业务车辆管理权；4S 默认无 PC 业务后台权限。</text><text x="286" y="847" font-size="12" fill="var(--semantic-foreground-secondary)" font-weight="400" text-anchor="start">车源来源与状态各有当前事实，不恢复旧 Collector 电话连接配置 / 测试页。</text></svg>