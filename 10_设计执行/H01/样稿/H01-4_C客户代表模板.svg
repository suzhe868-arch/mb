-ui,Arial,sans-serif">权限演示：普通 JYT 列表不显示数字价；详情额度耗尽为 --万；锁车仅申请；找车意向不自动成为正式推荐。</text><text x="84" y="826" font-size="11" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">候选 B 视觉方向未获确认，全部车型与数值为演示；“状态变化/无权/服务端失败”的完整分支见 H01-3 状态矩阵。</text></svg>