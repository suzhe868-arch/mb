<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="title desc"><title id="title">客户详情 Banner 有效与无效展示状态</title><desc id="desc">固定广告位能力；左有效显示运营内容，右无有效广告时不渲染内容；均保留真实客户价格权益和动作。</desc><style><![CDATA[svg{--semantic-brand-primary:#80611F;--semantic-brand-subtle:#F1E7D1;--semantic-brand-on-primary:#FFFFFF;--semantic-brand-light-metal:#C4A66A;--semantic-surface-canvas:#F8F6F1;--semantic-surface-panel:#FFFFFF;--semantic-surface-soft:#F6F2E9;--semantic-surface-disabled:#EDECE7;--semantic-surface-dark:#25282B;--semantic-foreground-primary:#25282B;--semantic-foreground-secondary:#6B6860;--semantic-foreground-muted:#756F63;--semantic-foreground-inverse:#FFFFFF;--semantic-border-subtle:#E5E0D7;--semantic-border-strong:#C5BBA9;--semantic-feedback-success:#176A45;--semantic-feedback-warning:#995A13;--semantic-feedback-danger:#B42318;--semantic-feedback-focus:#2563EB;font-family:system-ui,'Microsoft YaHei',sans-serif;}text{font-family:system-ui,'Microsoft YaHei',sans-serif;}]]></style><rect x="0" y="0" width="1000" height="1080" rx="0" fill="var(--semantic-surface-canvas)" stroke="none"/><text x="65" y="53" font-size="25" font-weight="750" text-anchor="start" fill="var(--semantic-foreground-primary)">H01｜C01-01 车辆详情：Banner 有效 / 无有效素材</text><text x="65" y="80" font-size="13" font-weight="400" text-anchor="start" fill="var(--semantic-foreground-secondary)">PDM-20 §40 / PDM-24 §6：固定广告位能力；无有效素材只是没有可见广告</text><text x="65" y="115" font-size="15" font-weight="750" text-anchor="start" fill="var(--semantic-foreground-primary)">有效 Banner：1～5 条按规则展示</text><text x="544" y="115" font-size="15" font-weight="750" text-anchor="start" fill="var(--semantic-foreground-primary)">无有效 Banner：内容不渲染</text><g transform="translate(64 133)"><rect x="0" y="0" width="390" height="844" rx="18" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><svg x="0" y="0" width="390" height="844" viewBox="0 0 390 844" overflow="hid