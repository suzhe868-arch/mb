" width="100" height="55" rx="10" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="146" y="800" font-size="14" font-weight="650" text-anchor="middle" fill="var(--semantic-foreground-primary)">咨询</text><rect x="202" y="766" width="176" height="55" rx="10" fill="var(--semantic-brand-primary)" stroke="none"/><text x="290" y="800" font-size="15" font-weight="750" text-anchor="middle" fill="var(--semantic-surface-panel)">锁车</text></svg></g><rect x="64" y="998" width="869" height="54" rx="9" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="83" y="1020" font-size="12" font-weight="650" text-anchor="start" fill="var(--semantic-foreground-primary)">仅为 H01 静态设计样稿，未实现轮播与服务端资格重验。数据均为演示。</text><text x="83" y="1039" font-size="12" font-weight="400" text-anchor="start" fill="var(--semantic-foreground-secondary)">详情价 --万 表示未解锁且额度耗尽；车辆缺合法数字价时展示“价格咨询”，不可混淆。</text></svg>