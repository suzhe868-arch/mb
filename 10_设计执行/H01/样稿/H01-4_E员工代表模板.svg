<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="865" viewBox="0 0 1400 865" role="img" aria-labelledby="title desc"><title id="title">H01-4 E 员工端代表模板</title><desc id="desc">工作台、人工车录入自动保存、锁车申请审核；4S 无权审批；仅为评审样稿。</desc><rect x="0" y="0" width="1400" height="865" rx="0" fill="#F2F4F6" stroke="none"/><text x="64" y="54" font-size="29" fill="#24282E" font-weight="750" font-family="system-ui,Arial,sans-serif">H01-4｜E 员工端 · 代表模板</text><text x="65" y="85" font-size="15" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">来源：PDM-06 / PDM-18 / PDM-21；4S 与名邦使用同一 App，权限裁剪不是禁用灰化</text><text x="65" y="126" font-size="17" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">E01｜工作台（名邦员工）</text><text x="510" y="126" font-size="17" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">E02-02｜发布 / 多草稿自动保存</text><text x="955" y="126" font-size="17" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">E07-08｜锁车申请待审</text><g transform="translate(65 151)"><rect x="0" y="0" width="360" height="606" rx="22" fill="#fff" stroke="#DDE2E6"/><rect x="0" y="0" width="360" height="78" rx="21" fill="#F8F5F3" stroke="none"/><rect x="0" y="48" width="360" height="30" rx="0" fill="#F8F5F3" stroke="none"/><text x="18" y="34" font-size="20" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">员工工作台</text><text x="18" y="57" font-size="12" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">E01 · 名邦销售有权限视图</text><rect x="18" y="93" width="324" height="48" rx="12" fill="#F4F5F6" stroke="none"/><text x="34" y="124" font-size="16" fill="#176A45" font-weight="700" font-family="system-ui,Arial,sans-serif">接客中    ●</text><text x="230" y="124" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">暂停接客 ＞</text><text x="18" y="176" font-size="17" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">强待办  ·  按时效优先</text><rect x="18" y="192" width="324" height="94" rx="12" fill="#FBF3EC" stroke="none"/><text x="32" y="219" font-size="15" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">锁车申请待审核</text><text x="32" y="243" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">需在服务端剩余有效期内处理</text><text x="32" y="267" font-size="13" fill="#9A4D22" font-weight="650" font-family="system-ui,Arial,sans-serif">查看待办  →</text><text x="18" y="325" font-size="17" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">客户机会</text><rect x="18" y="340" width="324" height="65" rx="12" fill="#F4F5F6" stroke="none"/><text x="30" y="368" font-size="13" fill="#24282E" font-weight="400" font-family="system-ui,Arial,sans-serif">当前范围内的客户机会信号</text><text x="30" y="389" font-size="11" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">独立于强待办生命周期</text><text x="18" y="445" font-size="17" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">车源雷达</text><rect x="18" y="460" width="324" height="65" rx="12" fill="#F4F5F6" stroke="none"/><text x="30" y="489" font-size="13" fill="#24282E" font-weight="400" font-family="system-ui,Arial,sans-serif">需求驱动的车源变化线索</text><text x="30" y="510" font-size="11" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">不自动转成正式推荐</text><line x1="18" y1="565" x2="342" y2="565" stroke="#E5E7EB"/><text x="28" y="589" font-size="13" fill="#D65438" font-weight="700" font-family="system-ui,Arial,sans-serif">工作台</text><text x="145" y="589" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">车源</text><text x="280" y="589" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">我的</text></g><g transform="translate(510 151)"><rect x="0" y="0" width="360" height="606" rx="22" fill="#fff" stroke="#DDE2E6"/><rect x="0" y="0" width="360" height="78" rx="21" fill="#F8F5F3" stroke="none"/><rect x="0" y="48" width="360" height="30" rx="0" fill="#F8F5F3" stroke="none"/><text x="18" y="34" font-size="20" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">发布人工车辆</text><text x="18" y="57" font-size="12" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">E02-02 · 有效输入后自动保存</text><text x="18" y="111" font-size="13" fill="#24282E" font-weight="650" font-family="system-ui,Arial,sans-serif">车源类型</text><rect x="18" y="120" width="324" height="43" rx="10" fill="#F4F5F6" stroke="none"/><text x="32" y="148" font-size="14" fill="#24282E" font-weight="400" font-family="system-ui,Arial,sans-serif">名邦车源  ▾</text><text x="18" y="194" font-size="13" fill="#24282E" font-weight="650" font-family="system-ui,Arial,sans-serif">品牌 / 车系 / 车型</text><rect x="18" y="205" width="324" height="45" rx="10" fill="#F4F5F6" stroke="none"/><text x="32" y="235" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">请选择完整车型事实</text><text x="18" y="279" font-size="13" fill="#24282E" font-weight="650" font-family="system-ui,Arial,sans-serif">车辆图片</text><rect x="18" y="293" width="324" height="89" rx="12" fill="#ECEFF1" stroke="none"/><text x="119" y="342" font-size="14" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">＋ 上传图片</text><text x="18" y="417" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">填写车辆资料后自动建立草稿</text><rect x="18" y="429" width="324" height="55" rx="12" fill="#E6F2EA" stroke="none"/><text x="35" y="451" font-size="14" fill="#176A45" font-weight="700" font-family="system-ui,Arial,sans-serif">✓   已自动保存</text><text x="35" y="472" font-size="12" fill="#176A45" font-weight="400" font-family="system-ui,Arial,sans-serif">可从“更多 → 草稿车源”继续编辑</text><rect x="18" y="512" width="324" height="48" rx="11" fill="#D65438" stroke="none"/><text x="154" y="543" font-size="16" fill="#fff" font-weight="700" font-family="system-ui,Arial,sans-serif">发布</text><text x="29" y="584" font-size="12" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">* 无单独“保存草稿”按钮</text></g><g transform="translate(955 151)"><rect x="0" y="0" width="360" height="606" rx="22" fill="#fff" stroke="#DDE2E6"/><rect x="0" y="0" width="360" height="78" rx="21" fill="#F8F5F3" stroke="none"/><rect x="0" y="48" width="360" height="30" rx="0" fill="#F8F5F3" stroke="none"/><text x="18" y="34" font-size="20" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">锁车申请详情</text><text x="18" y="57" font-size="12" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">E07-08 · PENDING</text><rect x="18" y="95" width="324" height="87" rx="12" fill="#FFF3E9" stroke="none"/><text x="33" y="126" font-size="19" fill="#995A13" font-weight="750" font-family="system-ui,Arial,sans-serif">待审核</text><text x="33" y="150" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">剩余时效按服务端时间显示</text><text x="33" y="170" font-size="12" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">最长 6 小时 · 不是正式锁车</text><text x="18" y="216" font-size="14" fill="#24282E" font-weight="650" font-family="system-ui,Arial,sans-serif">申请车辆</text><rect x="18" y="229" width="324" height="75" rx="11" fill="#F3F5F6" stroke="none"/><text x="32" y="257" font-size="14" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">示例车辆｜批发车源</text><text x="32" y="282" font-size="12" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">仅展示审核员有权查看的信息</text><text x="18" y="333" font-size="14" fill="#24282E" font-weight="650" font-family="system-ui,Arial,sans-serif">客户与申请信息</text><rect x="18" y="343" width="324" height="98" rx="11" fill="#F6F7F8" stroke="none"/><text x="32" y="373" font-size="13" fill="#24282E" font-weight="400" font-family="system-ui,Arial,sans-serif">客户资料：按当前权限投影</text><text x="32" y="397" font-size="13" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">申请时间：服务端事实</text><text x="32" y="420" font-size="12" fill="#995A13" font-weight="400" font-family="system-ui,Arial,sans-serif">到期后不可批准</text><rect x="18" y="486" width="145" height="48" rx="11" fill="#fff" stroke="#C8CFD6"/><text x="75" y="517" font-size="16" fill="#24282E" font-weight="700" font-family="system-ui,Arial,sans-serif">拒绝</text><rect x="176" y="486" width="166" height="48" rx="11" fill="#D65438" stroke="none"/><text x="232" y="517" font-size="16" fill="#fff" font-weight="700" font-family="system-ui,Arial,sans-serif">同意</text><text x="27" y="559" font-size="11" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">* 提交需二次确认并重验权限/车辆</text><text x="27" y="581" font-size="11" fill="#B42318" font-weight="400" font-family="system-ui,Arial,sans-serif">* 4S 成员不显示该审核入口</text></g><rect x="64" y="783" width="1250" height="52" rx="10" fill="#fff" stroke="none"/><text x="83" y="807" font-size="14" fill="#24282E" font-weight="650" font-family="system-ui,Arial,sans-serif">安全投影：E01 强待办与机会/雷达独立；草稿只自动保存；LockRequest 6h 不等于 Lock；4S 不出现审批入口。</text><text x="84" y="826" font-size="11" fill="#737B83" font-weight="400" font-family="system-ui,Arial,sans-serif">仅展示已存在页面与合法状态的视觉骨架；候选 B 尚待确认，实际失败和权限撤销分支依组件矩阵检查。</text></svg>