ar(--semantic-foreground-primary)">车辆与申请</text><rect x="16" y="234" width="358" height="126" rx="11" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="31" y="265" font-size="14" font-weight="700" text-anchor="start" fill="var(--semantic-foreground-primary)">示例车型 / 当前 Listing Cycle</text><text x="31" y="291" font-size="12" font-weight="400" text-anchor="start" fill="var(--semantic-foreground-secondary)">申请时间与当前合法对象状态</text><text x="31" y="319" font-size="12" font-weight="400" text-anchor="start" fill="var(--semantic-foreground-secondary)">客户信息：按可见范围裁剪</text><text x="16" y="392" font-size="15" font-weight="750" text-anchor="start" fill="var(--semantic-foreground-primary)">处理要求</text><rect x="16" y="405" width="358" height="105" rx="11" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="31" y="435" font-size="12" font-weight="400" text-anchor="start" fill="var(--semantic-foreground-primary)">批准、拒绝均需权限/范围重验</text><text x="31" y="461" font-size="12" font-weight="400" text-anchor="start" fill="var(--semantic-foreground-secondary)">竞争失败：合法自动候补</text><text x="31" y="487" font-size="12" font-weight="400" text-anchor="start" fill="var(--semantic-feedback-warning)">到期后不得批准</text><rect x="16" y="588" width="171" height="52" rx="11" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-strong)"/><text x="101" y="619" font-size="15" font-weight="700" text-anchor="middle" fill="var(--semantic-foreground-primary)">拒绝</text><rect x="199" y="588" width="175" height="52" rx="11" fill="var(--semantic-brand-primary)" stroke="none"/><text x="286" y="619" font-size="15" font-weight="700" text-anchor="middle" fill="var(--semantic-surface-panel)">同意</text><text x="16" y="679" font-size="12" font-weight="400" text-anchor="start" fill="var(--semantic-foreground-secondary)">无审核权限时入口整体隐藏（4S hard DENY）</text><rect x="0" y="770" width="390" height="74" rx="0" fill="var(--semantic-surface-panel)" stroke="none"/><line x1="0" y1="770" x2="390" y2="770" stroke="var(--semantic-border-subtle)"/><text x="53" y="804" font-size="13" font-weight="750" text-anchor="middle" fill="var(--semantic-brand-primary)">工作台</text><text x="151" y="804" font-size="13" font-weight="500" text-anchor="middle" fill="var(--semantic-foreground-secondary)">车源</text><text x="247" y="804" font-size="13" font-weight="500" text-anchor="middle" fill="var(--semantic-foreground-secondary)">客户</text><text x="345" y="804" font-size="13" font-weight="500" text-anchor="middle" fill="var(--semantic-foreground-secondary)">我的</text></svg></g><rect x="53" y="1011" width="1326" height="70" rx="10" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="72" y="1034" font-size="13" font-weight="700" text-anchor="start" fill="var(--semantic-foreground-primary)">返修检查：E01 员工信息 + 紧急异常 + 今日待处理 + 四快捷入口 + 客户机会 + 车源雷达，结构齐全。</text><text x="72" y="1056" font-size="12" font-weight="400" text-anchor="start" fill="var(--semantic-foreground-secondary)">图示仅名邦有权限视图，4S 按 Current IA 严格裁剪，绝不虚构灰色审批按钮；所有内容都是静态示例。</text></svg>