c-border-subtle)"/><text x="30" y="328" font-size="14" font-weight="700" text-anchor="start" fill="var(--semantic-foreground-primary)">锁车申请待审核</text><text x="30" y="354" font-size="12" font-weight="400" text-anchor="start" fill="var(--semantic-foreground-secondary)">仅有权员工可见 · 6 小时服务端时限</text><text x="16" y="408" font-size="17" font-weight="750" text-anchor="start" fill="var(--semantic-foreground-primary)">快捷入口</text><rect x="16" y="420" width="82" height="62" rx="10" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="57" y="457" font-size="13" font-weight="700" text-anchor="middle" fill="var(--semantic-brand-primary)">待办</text><rect x="108" y="420" width="82" height="62" rx="10" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="149" y="457" font-size="13" font-weight="700" text-anchor="middle" fill="var(--semantic-foreground-primary)">客户</text><rect x="200" y="420" width="82" height="62" rx="10" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="241" y="457" font-size="13" font-weight="700" text-anchor="middle" fill="var(--semantic-foreground-primary)">找车</text><rect x="292" y="420" width="82" height="62" rx="10" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="333" y="457" font-size="13" font-weight="700" text-anchor="middle" fill="var(--semantic-foreground-primary)">车源</text><text x="16" y="517" font-size="17" font-weight="750" text-anchor="start" fill="var(--semantic-foreground-primary)">客户机会</text><rect x="16" y="529" width="358" height="72" rx="11" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="28" y="555" font-size="13" font-weight="650" text-anchor="start" fill="var(--semantic-foreground-primary)">当前范围内的客户机会线索</text><text x="28" y="581" font-size="11" font-weight="400" text-anchor="start" fill="var(--semantic-foreground-secondary)">与强待办生命周期分离</text><text x="16" y="631" font-size="