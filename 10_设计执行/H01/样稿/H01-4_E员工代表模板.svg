<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="1110" viewBox="0 0 1430 1110" role="img" aria-labelledby="title desc"><title id="title">H01 修订 E 员工工作台、上传和锁车审批</title><desc id="desc">E01 紧急异常/今日待处理/快捷入口/客户机会/雷达、E02-02 自动草稿和 E07-08 申请审核。</desc><style><![CDATA[svg{--semantic-brand-primary:#80611F;--semantic-brand-subtle:#F1E7D1;--semantic-brand-on-primary:#FFFFFF;--semantic-brand-light-metal:#C4A66A;--semantic-surface-canvas:#F8F6F1;--semantic-surface-panel:#FFFFFF;--semantic-surface-soft:#F6F2E9;--semantic-surface-disabled:#EDECE7;--semantic-surface-dark:#25282B;--semantic-foreground-primary:#25282B;--semantic-foreground-secondary:#6B6860;--semantic-foreground-muted:#756F63;--semantic-foreground-inverse:#FFFFFF;--semantic-border-subtle:#E5E0D7;--semantic-border-strong:#C5BBA9;--semantic-feedback-success:#176A45;--semantic-feedback-warning:#995A13;--semantic-feedback-danger:#B42318;--semantic-feedback-focus:#2563EB;font-family:system-ui,'Microsoft YaHei',sans-serif;}text{font-family:system-ui,'Microsoft YaHei',sans-serif;}]]></style><rect x="0" y="0" width="1430" height="1110" rx="0" fill="var(--semantic-surface-canvas)" stroke="none"/><text x="53" y="56" font-size="26" font-weight="750" text-anchor="start" fill="var(--semantic-foreground-primary)">H01-4｜E 员工端 · 已确认视觉方向下的真实工作结构</text><text x="53" y="85" font-size="13" font-weight="400" text-anchor="start" fill="var(--semantic-foreground-secondary)">E01 业务内容密度优先 · 自动草稿 · LockRequest 6h / 4S 无权不显示</text><text x="53" y="122" font-size="16" font-weight="750" text-anchor="start" fill="var(--semantic-foreground-primary)">E01｜工作台（名邦员工）</text><text x="520" y="122" font-size="16" font-weight="750" text-anchor="start" fill="var(--semantic-foreground-primary)">E02-02｜多草稿自动保存</text><text x="990" y="122" font-size="16" font-weight="750" text-anchor="start" fill="var(--semantic-foreground-primary)">E07-08｜锁车申请待审</text><g transform="translate(53 142)"><rect x="0" y="0" width="390" height="844" rx="20" fill="var(--semanti