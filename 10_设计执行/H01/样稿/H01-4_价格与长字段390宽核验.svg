ill="var(--semantic-foreground-secondary)">上牌 2025-01  ·  2.8万公里</text><g clip-path="url(#clipCity)"><text x="166" y="222" font-size="11" font-weight="400" fill="var(--semantic-foreground-secondary)">内蒙古自治区呼和浩特市城区</text></g><text x="166" y="245" font-size="11" font-weight="400" fill="var(--semantic-foreground-secondary)">上架 10月08日</text><line x1="27" y1="267" x2="363" y2="267" stroke="var(--semantic-border-subtle)"/><rect x="27" y="280" width="86" height="22" rx="6" fill="var(--semantic-brand-subtle)" stroke="none"/><text x="37" y="296" font-size="12" font-weight="700" fill="var(--semantic-brand-primary)">批发车源</text><text x="253" y="298" font-size="17" font-weight="750" fill="var(--semantic-brand-primary)">18.6万</text><text x="15" y="364" font-size="12" font-weight="400" fill="var(--semantic-foreground-secondary)">同样卡片结构，数字价紧凑放在信息后段</text><rect x="16" y="395" width="358" height="134" rx="11" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="29" y="425" font-size="14" font-weight="750" fill="var(--semantic-foreground-primary)">进入详情时价格状态</text><text x="30" y="456" font-size="13" font-weight="650" fill="var(--semantic-brand-primary)">合法数字客户价  →  18.6万（示例）</text><text x="30" y="482" font-size="13" font-weight="650" fill="var(--semantic-foreground-primary)">无合法数字价      →  价格咨询</text><text x="30" y="508" font-size="13" font-weight="650" fill="var(--semantic-foreground-primary)">额度用尽且未解锁  →  --万</text><text x="15" y="582" font-size="12" font-weight="400" fill="var(--semantic-foreground-secondary)">长标题与长城市溢出：使用安全截断区</text><text x="15" y="609" font-size="12" font-weight="400" fill="var(--semantic-foreground-secondary)">真实 H03 需要测量文字宽度/动态字号</text></svg></g><rect x="50" y="985" width="872" height="75" rx="11" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><text x="68" y="1009" font-size="12" font-weight="650" fill="var(--semantic-foreground-primary)">布局静态断言：卡片右侧字段起点 x=166；裁剪宽 197，最大右界 363，距 390 屏幕边缘 27。</text><text x="68" y="1031" font-size="12" font-weight="400" fill="var(--semantic-foreground-secondary)">长字段在正式小程序需显示省略号/可进入详情看全；本 SVG 用 clipPath 避免越界。</text><text x="68" y="1050" font-size="12" font-weight="400" fill="var(--semantic-foreground-secondary)">当前仅完成固定 390px 结构核验，非浏览器文字实际测量 / 320px 真机可读性验收。</text></svg>