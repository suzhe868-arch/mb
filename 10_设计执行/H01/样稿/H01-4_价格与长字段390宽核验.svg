<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1080" viewBox="0 0 980 1080" role="img" aria-labelledby="title desc"><title id="title">H01 390px 手机卡片标题/城市/客户价格静态排版检查</title><desc id="desc">分别展示 LIMITED 和 UNLIMITED 权益，长标题和长城市受右侧裁剪区保护；没有无权数字泄漏。</desc><style><![CDATA[svg{--semantic-brand-primary:#80611F;--semantic-brand-subtle:#F1E7D1;--semantic-brand-on-primary:#FFFFFF;--semantic-brand-light-metal:#C4A66A;--semantic-surface-canvas:#F8F6F1;--semantic-surface-panel:#FFFFFF;--semantic-surface-soft:#F6F2E9;--semantic-surface-disabled:#EDECE7;--semantic-surface-dark:#25282B;--semantic-foreground-primary:#25282B;--semantic-foreground-secondary:#6B6860;--semantic-foreground-muted:#756F63;--semantic-foreground-inverse:#FFFFFF;--semantic-border-subtle:#E5E0D7;--semantic-border-strong:#C5BBA9;--semantic-feedback-success:#176A45;--semantic-feedback-warning:#995A13;--semantic-feedback-danger:#B42318;--semantic-feedback-focus:#2563EB;font-family:system-ui,'Microsoft YaHei',sans-serif;}text{font-family:system-ui,'Microsoft YaHei',sans-serif;}]]></style><rect x="0" y="0" width="980" height="1080" rx="0" fill="var(--semantic-surface-canvas)" stroke="none"/><text x="53" y="58" font-size="25" font-weight="750" fill="var(--semantic-foreground-primary)">H01｜390px 车源卡片：长字段与价格状态</text><text x="53" y="83" font-size="13" font-weight="400" fill="var(--semantic-foreground-secondary)">同样 390px 可读区域；图片、标题、里程、城市和价区独立，没有大面积右侧价格列</text><defs><clipPath id="clipTitle"><rect x="166" y="0" width="197" height="844"/></clipPath><clipPath id="clipCity"><rect x="166" y="0" width="197" height="844"/></clipPath></defs><g transform="translate(50 117)"><rect x="0" y="0" width="390" height="844" rx="20" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><svg width="390" height="844" viewBox="0 0 390 844" overflow="hidden"><rect x="0" y="0" width="390" height="844" rx="0" fill="var(--semantic-surface-canvas)" stroke="none"/><rect x="0" y="0" width="390" height="67" rx="0" fill="var(--semantic-surface-dark)" stroke="none"/><text x="15" y="43" font-size="22" font-weight="750" fill="var(--semantic-surface-panel)">名邦汽车</text><text x="15" y="111" font-size="16" font-weight="750" fill="var(--semantic-foreground-primary)">普通 / LIMITED · JYT 批发</text><rect x="16" y="134" width="358" height="180" rx="12" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><rect x="27" y="147" width="129" height="106" rx="10" fill="var(--semantic-surface-soft)" stroke="none"/><g clip-path="url(#clipTitle)"><text x="166" y="171" font-size="13" font-weight="700" fill="var(--semantic-foreground-primary)">梅赛德斯-奔驰 E级 2025款  改款</text></g><text x="166" y="199" font-size="11" font-weight="400" fill="var(--semantic-foreground-secondary)">上牌 2025-01  ·  2.8万公里</text><g clip-path="url(#clipCity)"><text x="166" y="222" font-size="11" font-weight="400" fill="var(--semantic-foreground-secondary)">内蒙古自治区呼和浩特市城区</text></g><text x="166" y="245" font-size="11" font-weight="400" fill="var(--semantic-foreground-secondary)">上架 10月08日</text><line x1="27" y1="267" x2="363" y2="267" stroke="var(--semantic-border-subtle)"/><rect x="27" y="280" width="86" height="22" rx="6" fill="var(--semantic-brand-subtle)" stroke="none"/><text x="37" y="296" font-size="12" font-weight="700" fill="var(--semantic-brand-primary)">批发车源</text><text x="287" y="297" font-size="12" font-weight="700" fill="var(--semantic-brand-primary)">查看详情</text><text x="15" y="364" font-size="12" font-weight="400" fill="var(--semantic-foreground-secondary)">列表只显示已授权字段，数值价格不可见</text><rect x="16" y="389" width="358" height="180" rx="12" fill="var(--semantic-surface-panel)" stroke="var(--semantic-border-subtle)"/><rect x="27" y="402" width="129" height="106" rx="10" fill="var(--semantic-surface-soft)" stroke="none"/><g clip-path="url(#clipTitle)"><text x="166" y="426" font-size="13" font-weight="700" fill="var(--semantic-foreground-primary)">梅赛德斯-奔驰 E级 2025款  改款</text></g><text x="166" y="454" font-siz