name: F01 基础构建与安全校验
on:
  push:
    branches: [feat/f01-foundation]
  workflow_dispatch:
jobs:
  foundation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: engineering/package-lock.json
      - name: 锁文件安装
        run: npm ci --ignore-scripts --offline --no-audit --no-fund
      - name: 预检、构建与测试
        run: npm run check
