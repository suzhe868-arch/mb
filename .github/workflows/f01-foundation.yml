name: F01 基础构建与安全校验
on:
  push:
    branches: [feat/f01-foundation]
  workflow_dispatch:
jobs:
  foundation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      # F01-3 技术引入阶段：由 GitHub CI 生成并回传依赖锁草案，
      # 下一次工程提交必须回写锁文件，恢复强制 npm ci。
      - name: 临时生成 pg 锁文件草案（一次性依赖引入）
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "F01_LOCK_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "F01_LOCK_END"
      - name: 依赖安装与基础验证
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
