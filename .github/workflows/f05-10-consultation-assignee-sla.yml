name: F05-10 PDM15 signed Consultation true PostgreSQL16 Source and TLS
on:
  push:
    branches: [feat/f05-10-consultation-assignee-sla]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  consultation-source:
    name: F05-10 new Source v26 true PG16
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: 验证旧脚本的本地PG16容器祖先别名 不访问ECR
        shell: bash
        run: |
          set -euo pipefail
          # 官方DockerHub postgres:16已由GitHub服务启动。只在Runner内加旧镜像名别名，不发起ECR拉取。
          original_id="$(docker image inspect postgres:16 --format '{{.Id}}')"
          docker tag postgres:16 public.ecr.aws/docker/library/postgres:16-alpine
          alias_id="$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
          test "$original_id" = "$alias_id"
          original_container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"
          legacy_container="$(docker ps --filter ancestor=public.ecr.aws/docker/library/postgres:16-alpine --format '{{.ID}}')"
          test -n "$original_container"
          test "$original_container" = "$legacy_container"
          test "$(printf '%s\n' "$legacy_container" | sed '/^$/d' | wc -l)" -eq 1
          echo "F05_PG16_DOCKERHUB_LOCAL_TAG_ALIAS_CONFIRMED_NO_ECR_NETWORK_PULL $original_id"

      - name: Native F05-10 signed-v26 Source and 70 job official proof
        run: bash engineering/f05/consultation-assignee-sla/ci-job.sh source
        env:
          GH_ACTIONS_READ_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: f05-10-source-native-pg16-evidence
          path: engineering/f05/consultation-assignee-sla/artifacts/source/
          retention-days: 30
          if-no-files-found: error
  consultation-https:
    name: F05-10 new HTTPS v26 true PG16
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: 验证旧脚本的本地PG16容器祖先别名 不访问ECR
        shell: bash
        run: |
          set -euo pipefail
          # 官方DockerHub postgres:16已由GitHub服务启动。只在Runner内加旧镜像名别名，不发起ECR拉取。
          original_id="$(docker image inspect postgres:16 --format '{{.Id}}')"
          docker tag postgres:16 public.ecr.aws/docker/library/postgres:16-alpine
          alias_id="$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
          test "$original_id" = "$alias_id"
          original_container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"
          legacy_container="$(docker ps --filter ancestor=public.ecr.aws/docker/library/postgres:16-alpine --format '{{.ID}}')"
          test -n "$original_container"
          test "$original_container" = "$legacy_container"
          test "$(printf '%s\n' "$legacy_container" | sed '/^$/d' | wc -l)" -eq 1
          echo "F05_PG16_DOCKERHUB_LOCAL_TAG_ALIAS_CONFIRMED_NO_ECR_NETWORK_PULL $original_id"

      - name: Native F05-10 HTTPS customer/employee issuer fail closed
        run: bash engineering/f05/consultation-assignee-sla/ci-job.sh https
      - uses: actions/upload-artifact@v4
        with:
          name: f05-10-https-native-pg16-evidence
          path: engineering/f05/consultation-assignee-sla/artifacts/https/
          retention-days: 30
          if-no-files-found: error
