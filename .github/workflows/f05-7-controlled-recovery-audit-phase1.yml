name: F05-7 第一阶段只读安全预检
on:
  push:
    branches: [feat/f05-7-parent-source-controlled-recovery-01]
    paths:
      - 'engineering/f05/source-controlled-recovery-01/**'
      - '.github/workflows/f05-7-controlled-recovery-audit-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'engineering/f05/source-controlled-recovery-01/**'
      - '.github/workflows/f05-7-controlled-recovery-audit-*.yml'
permissions:
  contents: read
  actions: read
jobs:
  phase1-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: 只读预检防伪与安全负例
        run: node --test engineering/f05/source-controlled-recovery-01/tests/*.test.mjs
      - name: GitHub原生旧SHA与队列动态核证（绝不修改旧来源）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node engineering/f05/source-controlled-recovery-01/只读预检.mjs audit
      - name: 上报同HEAD官方只读工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f05-7-controlled-recovery-phase1-read-only
          path: engineering/f05/source-controlled-recovery-01/artifacts/
          if-no-files-found: error
          retention-days: 30
