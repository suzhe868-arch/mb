name: F05 Issue216 published manual Vehicle staged-edit HTTPS PG16 nonproduction
on:
  push:
    branches: [feat/f05-published-manual-vehicle-staged-edit-pg16-01]
    paths:
      - '.github/workflows/f05-published-manual-vehicle-edit.yml'
      - 'engineering/f05/published-manual-vehicle-edit/**'
permissions:
  contents: read
concurrency:
  group: f05-issue216-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mingbang-pg16:
    name: "B Issue216 Mingbang real non-superuser PG16"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
      F05_2_ISOLATION_CONFIRM: I_AUTHORIZE_F05_2_DISPOSABLE_PG16_ONLY
      F05_PUBLISHED_EDIT_CONSENT: I_AUTHORIZE_F05_PUBLISHED_EDIT_DISPOSABLE_PG16_ONLY
      F05_EDIT_TEST_SOURCE: mingbang
      F05_EDIT_HTTP_PORT: '48986'
      F05_EDIT_TLS_KEY: /tmp/f05-issue216-key.pem
      F05_EDIT_TLS_CERT: /tmp/f05-issue216-cert.pem
    defaults:
      run:
        working-directory: engineering
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: engineering/package-lock.json
      - name: Final SHA, syntax and exact changed-path whitelist
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$GITHUB_REPOSITORY" = "suzhe868-arch/mb"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/feat/f05-published-manual-vehicle-staged-edit-pg16-01"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          BASE="$(git merge-base origin/main HEAD)"
          git diff --check "$BASE" HEAD
          while IFS= read -r file; do
            case "$file" in
              engineering/f05/published-manual-vehicle-edit/*|.github/workflows/f05-published-manual-vehicle-edit.yml) ;;
              *) echo "F05_216_FORBIDDEN_CHANGED_PATH: $file"; exit 91 ;;
            esac
          done < <(git -c core.quotePath=false diff --name-only "$BASE" HEAD)
          while IFS= read -r file; do node --check "$file"; done < <(git -c core.quotePath=false diff --name-only "$BASE" HEAD | grep -E '^engineering/.*\.(mjs|cjs|js)$')
          echo "F05_216_SHA_SYNTAX_AND_SCOPE_PASS"
      - name: Fresh dependency and frozen application syntax
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Bootstrap disposable non-superuser original PG16 through M94
        run: |
          set -euo pipefail
          ids="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE f03_ci WITH LOGIN PASSWORD 'f03_ci_synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE f03_auth_test OWNER f03_ci"
          node f03-1/runner.mjs --bootstrap
          node f03-1/runner.mjs --apply
          node f03/runtime-scope/runner.mjs --apply
          node f03/runtime-admin-population/runner.mjs --apply
          node f03/runtime-receiving-pool/runner.mjs --apply
          node f03/runtime-team-scope/runner.mjs --apply
          node f03/runtime-handover-ledger/runner.mjs --apply
          node f03/runtime-customer-owner-handover/runner.mjs --apply
          node f03/runtime-demand-responsible-handover/runner.mjs --apply
          node f03/runtime-consultation-assignee-handover/runner.mjs --apply
          node f03/runtime-waitlist-responsible-handover/runner.mjs --apply
          node f03/runtime-lock-responsible-handover/runner.mjs --apply
          node f03/runtime-lock-responsible-handover/runner.mjs --verify
          mkdir -p f05/published-manual-vehicle-edit/artifacts
          node f03-1/fixtures.mjs
          node f03/runtime-scope/fixtures.mjs
          node f03/runtime-governance-template/fixtures.mjs
          node f03/runtime-receiving-pool/fixtures.mjs
          node f03/runtime-team-scope/fixtures.mjs
          node f03/runtime-handover-ledger/fixtures.mjs
          node f03/runtime-manager-team-governance/fixtures.mjs
          node f03/runtime-handover-preflight/fixtures.mjs
          node f03/runtime-customer-owner-handover/fixtures.mjs
          node f03/runtime-demand-responsible-handover/fixtures.mjs
          node f03/runtime-consultation-assignee-handover/fixtures.mjs
          node f03/runtime-waitlist-responsible-handover/fixtures.mjs
          node f03/runtime-lock-responsible-handover/fixtures.mjs
          node f03/runtime-transaction-responsible-handover/fixtures.mjs
          node f03/runtime-transaction-responsible-handover/evidence.mjs --old
          node f03/runtime-transaction-responsible-handover/runner.mjs --apply
          node f03/runtime-transaction-responsible-handover/runner.mjs --verify
          node f03/runtime-handover-reconciliation/fixtures.mjs
          node f03/field-security-projection/fixtures.mjs
      - name: Apply accepted 000015 stewardship migration/fixtures
        run: |
          set -euo pipefail
          node f05/vehicle-stewardship-physical-scope/runner.mjs --inject-rollback
          node f05/vehicle-stewardship-physical-scope/runner.mjs --apply
          node f05/vehicle-stewardship-physical-scope/runner.mjs --verify
          node f05/vehicle-stewardship-physical-scope/fixtures.mjs
      - name: Apply accepted 000016 member trust migration/fixtures
        run: |
          set -euo pipefail
          node f05/four-s-member-trust-scope/runner.mjs --inject-rollback
          node f05/four-s-member-trust-scope/runner.mjs --apply
          node f05/four-s-member-trust-scope/runner.mjs --verify
          node f05/four-s-member-trust-scope/fixtures.mjs
      - name: Fresh private PG16 rollback, migration and isolated normative-price fixture
        run: |
          set -euo pipefail
          node f05/published-manual-vehicle-edit/runner.mjs --inject-rollback
          node f05/published-manual-vehicle-edit/runner.mjs --apply
          node f05/published-manual-vehicle-edit/runner.mjs --verify
          node f05/published-manual-vehicle-edit/fixtures.mjs
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 -subj '/CN=127.0.0.1' -keyout "$F05_EDIT_TLS_KEY" -out "$F05_EDIT_TLS_CERT" >/dev/null 2>&1
          chmod 600 "$F05_EDIT_TLS_KEY"
      - name: Real HTTPS and physical PG16 staged editor / CAS / price / audit
        run: |
          set -euo pipefail
          mkdir -p f05/published-manual-vehicle-edit/artifacts
          node --test f05/published-manual-vehicle-edit/tests/https-pg16.test.mjs 2>&1 | tee f05/published-manual-vehicle-edit/artifacts/mingbang.log
          grep -q '# fail 0' f05/published-manual-vehicle-edit/artifacts/mingbang.log
          grep -q '# skipped 0' f05/published-manual-vehicle-edit/artifacts/mingbang.log
          node f05/published-manual-vehicle-edit/runner.mjs --verify
      - name: Same-HEAD trace, SHA256 file inventory and redaction size gate
        if: always()
        id: archive
        run: |
          set -euo pipefail
          dir=f05/published-manual-vehicle-edit/artifacts
          mkdir -p "$dir"
          printf '%s\n' "$GITHUB_SHA" > "$dir/head-sha.txt"
          printf '%s\n' "$GITHUB_REF" > "$dir/ref.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$dir/run-id.txt"
          (cd "$dir" && find . -maxdepth 1 -type f ! -name 'sha256sums.txt' -print0 | sort -z | xargs -0 -r sha256sum > sha256sums.txt)
          test "$(du -sb "$dir" | awk '{print $1}')" -le 20971520
          if grep -R -nE 'BEGIN PRIVATE KEY|__Host-mb_pc=[A-Za-z0-9_-]{43}|scrypt[$]v1[$]|SyntheticF04_3_CurrentProof_2026' "$dir"; then exit 92; fi
          echo "F05_216_EVIDENCE_INTEGRITY_PASS"
      - name: Publish immutable-run metadata evidence
        if: always() && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: f05-issue216-mingbang-evidence-${{ github.run_id }}
          path: engineering/f05/published-manual-vehicle-edit/artifacts/
          if-no-files-found: error
          retention-days: 1
