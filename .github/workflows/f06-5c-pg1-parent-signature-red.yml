name: F06-5C-PG1 isolated PG16 upstream parent catalog compatibility red evidence
on:
  push:
    branches: [fix/f06-5c-pg1-parent-priority-guard-ci]
permissions: {contents: read}
concurrency:
  group: f06-5c-pg1-native
  cancel-in-progress: true
jobs:
  pg1-parent-signature-red:
    name: PG1 independent PG16 frozen parent chain and signature conflict diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify native PostgreSQL 16 image alias for frozen parent scripts
        run: |
          set -euo pipefail
          docker image inspect postgres:16-alpine >/dev/null 2>&1 || docker pull postgres:16-alpine
          docker tag postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine
          test "$(docker image inspect postgres:16-alpine --format '{{.Id}}')" = "$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Real PG16 5B parent native regression and PG1 red/green proof
        run: bash engineering/f06/transaction-priority-parent-gate-ci/ci-job.sh
      - name: Upload genuine logs including failed signature attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f06-5c-pg1-native-parent-compat-diagnostic
          path: engineering/f06/transaction-priority-parent-gate-ci/artifacts/source/
          retention-days: 30
          if-no-files-found: warn
