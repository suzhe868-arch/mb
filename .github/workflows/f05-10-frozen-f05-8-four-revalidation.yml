name: F05-8 PDM13 Priority CI PG16 and signed F05-7 equivalent true compatibility
on:
  push:
    branches: [feat/f05-10-consultation-assignee-sla]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  compat-f05-7-source:
    name: F05-8 signed F05-7 Source 28 true PostgreSQL16 PG
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    permissions: {contents: read}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: '22.16.0'}
    - name: 验证旧脚本本地PG16镜像祖先兼容 不访问ECR
      shell: bash
      run: |
        set -euo pipefail
        # CI-only: 同一DockerHub官方postgres:16的本地旧名称别名，不使用ECR网络下载。
        original_id="$(docker image inspect postgres:16 --format '{{.Id}}')"
        docker tag postgres:16 public.ecr.aws/docker/library/postgres:16-alpine
        alias_id="$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
        test "$original_id" = "$alias_id"
        original_container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"
        legacy_container="$(docker ps --filter ancestor=public.ecr.aws/docker/library/postgres:16-alpine --format '{{.ID}}')"
        test -n "$original_container"
        test "$original_container" = "$legacy_container"
        test "$(printf '%s\n' "$legacy_container" | sed '/^$/d' | wc -l)" -eq 1
        echo "F05_PG16_DOCKERHUB_LOCAL_TAG_ALIAS_CONFIRMED_NO_ECR_NETWORK_PULL $original_id"

    - name: True F05-8 nonprivileged PG16 compat-source
      run: bash engineering/f05/recommendation-visibility-grants/compat-f05-8-job.sh compat-source
    - uses: actions/upload-artifact@v4
      with:
        name: f05-8-compat-source-native-evidence
        path: engineering/f05/priority-arbitration-ttl-handover/artifacts/compat-source/
        retention-days: 30
        if-no-files-found: error
  compat-f05-7-https:
    name: F05-8 signed F05-7 HTTPS 7 true PostgreSQL16 PG
