name: F05-10-D1 PDM17 signed public-pool Owner true PG16 Source and TLS
on:
  push:
    branches: [feat/f05-10-d1-pdm17-public-pool-owner-claim]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  owner-source:
    name: F05-10-D1 new Source PG16
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Native F05-10-D1 signed-v25 Source and 70 job official proof
        run: bash engineering/f05/pdm17-public-pool-owner-claim/ci-job.sh source
        env:
          GH_ACTIONS_READ_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: f05-10-d1-source-native-pg16-evidence
          path: engineering/f05/pdm17-public-pool-owner-claim/artifacts/source/
          retention-days: 30
          if-no-files-found: error
  owner-https:
    name: F05-10-D1 new HTTPS PG16
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Native F05-10-D1 HTTPS customer/employee issuer fail closed
        run: bash engineering/f05/pdm17-public-pool-owner-claim/ci-job.sh https
      - uses: actions/upload-artifact@v4
        with:
          name: f05-10-d1-https-native-pg16-evidence
          path: engineering/f05/pdm17-public-pool-owner-claim/artifacts/https/
          retention-days: 30
          if-no-files-found: error
