name: F03-2-1A trusted permission facts - disposable PG16 only
on:
  push:
    branches: [feat/f03-runtime-facts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f03-2-1a-pg16-current-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: engineering
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: engineering/package-lock.json
      - name: Frozen original F01/F02/F03 and F03-1-G0 static gates
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          node f02-g0/closure-audit.mjs
          node f02-g0/full-domain-audit.mjs
          node f02-g0/scope-audit.mjs
          node f03/verify-contract.mjs
          node --test f03/tests/*.test.mjs
          node f03/login-design/verify-contract.mjs
          node --test f03/login-design/test/*.test.mjs
          node f03/runtime-design/verify-contract.mjs
          node --test f03/runtime-design/tests/*.test.mjs
      - name: Guarded creation of ONE empty PostgreSQL 16 CI database
        run: |
          set -euo pipefail
          ids="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE f03_ci WITH LOGIN PASSWORD 'f03_ci_synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE f03_auth_test OWNER f03_ci"
          if F03_1_DATABASE_URL=postgres://f03_ci:no@127.0.0.1:5432/unapproved node f03-1/runner.mjs --bootstrap; then exit 1; fi
          if F03_1_ISOLATION_CONFIRM=NO node f03-1/runner.mjs --bootstrap; then exit 1; fi
      - name: Apply ONLY approved F02 000001 and F03-1 000002 under current-run seal
        run: |
          set -euo pipefail
          node f03-1/runner.mjs --bootstrap
          node f03-1/runner.mjs --apply
          node f03-1/runner.mjs --verify
          node --test f03-1/tests/kdf-budget.test.mjs
          node --test f03-1/tests/runtime-guard.test.mjs
      - name: Seed existing synthetic F03-1 accounts only; never grant new schema authority
        run: node f03-1/fixtures.mjs
      - name: Temporary same-run TLS and HMAC; no key artifact
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/f03-2-1a-key.pem -out /tmp/f03-2-1a-cert.pem -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          echo 'F03_1_TLS_KEY_PATH=/tmp/f03-2-1a-key.pem' >> "$GITHUB_ENV"
          echo 'F03_1_TLS_CERT_PATH=/tmp/f03-2-1a-cert.pem' >> "$GITHUB_ENV"
          key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$key"
          printf 'F03_1_HMAC_KEY_BASE64=%s\n' "$key" >> "$GITHUB_ENV"
          unset key
      - name: Real current permission PG16 and live F03-1 session revocation tests
        run: |
          set -euo pipefail
          mkdir -p f03/runtime-facts/artifacts
          node --test f03/runtime-facts/tests/integration.test.mjs 2>&1 | tee f03/runtime-facts/artifacts/pg16-current-facts-tests.log
          grep -q '# fail 0' f03/runtime-facts/artifacts/pg16-current-facts-tests.log
      - name: Real HTTPS loopback probe / other PG connection revokes SAME old session
        run: |
          set -euo pipefail
          node --test f03/runtime-facts/tests/https-revocation.test.mjs 2>&1 | tee f03/runtime-facts/artifacts/https-revocation-tests.log
          grep -q '# fail 0' f03/runtime-facts/artifacts/https-revocation-tests.log
      - name: Recheck unchanged F02 F03-1 migration versions, seal and physical fingerprint
        run: |
          set -euo pipefail
          node f03-1/runner.mjs --verify
          ids="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          docker exec -e PGPASSWORD=f03_ci_synthetic_only "$ids" pg_dump --host=127.0.0.1 --username=f03_ci --dbname=f03_auth_test --schema-only --no-owner --no-privileges --schema=public > f03/runtime-facts/artifacts/pg16_schema_only.sql
          node f03-1/inventory.mjs > f03/runtime-facts/artifacts/pg16_inventory.json
          test -s f03/runtime-facts/artifacts/pg16_schema_only.sql
          grep -q 'CREATE TABLE public.pc_auth_sessions' f03/runtime-facts/artifacts/pg16_schema_only.sql
          grep -q 'CREATE TABLE public.role_default_permission_history' f03/runtime-facts/artifacts/pg16_schema_only.sql
          sha256sum f03/runtime-facts/artifacts/pg16_schema_only.sql f03/runtime-facts/artifacts/pg16_inventory.json | tee f03/runtime-facts/artifacts/sha256sums.txt
          node f03/runtime-facts/check-evidence.mjs
      - name: Reject any credential or session token in captured artifacts
        if: always()
        run: |
          set -euo pipefail
          if test -d f03/runtime-facts/artifacts; then
            if grep -R -nE 'scrypt[$]v1[$]|__Host-mb_pc=[A-Za-z0-9_-]{43}|BEGIN PRIVATE KEY|SyntheticCurrentFacts_78901|SyntheticF032Https_2026' f03/runtime-facts/artifacts; then exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f03-2-1a-pg16-current-facts-and-revocation
          path: engineering/f03/runtime-facts/artifacts/
          retention-days: 30
          if-no-files-found: warn
