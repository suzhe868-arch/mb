      - name: Bootstrap separate fresh PG16 only with F02 000001 and F03-1 000002 sealed migrations
        run: |
          set -euo pipefail
          ids="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE f03_ci WITH LOGIN PASSWORD 'f03_ci_synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE f03_auth_test OWNER f03_ci"
          node f03-1/runner.mjs --bootstrap
          node f03-1/runner.mjs --apply
          node f03-1/runner.mjs --verify
          node f03-1/fixtures.mjs
      - name: Run UNMODIFIED F03-1 real KDF/login/password/governance/session tests
        run: |
          set -euo pipefail
          mkdir -p f03/runtime-facts/artifacts-auth-integration
          node --test f03-1/tests/integration.test.mjs 2>&1 | tee f03/runtime-facts/artifacts-auth-integration/original-integration.log
          grep -q '# fail 0' f03/runtime-facts/artifacts-auth-integration/original-integration.log
          node f03-1/runner.mjs --verify
      - name: Ensure original regression artifacts exclude secrets
        if: always()
        run: |
          set -euo pipefail
          if test -d f03/runtime-facts/artifacts-auth-integration; then
            if grep -R -nE 'scrypt[$]v1[$]|__Host-mb_pc=[A-Za-z0-9_-]{43}|BEGIN PRIVATE KEY|SyntheticPassword_12345' f03/runtime-facts/artifacts-auth-integration; then exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f03-2-1a-f03-1-integration-security-isolated-pg16
          path: engineering/f03/runtime-facts/artifacts-auth-integration/
          retention-days: 30
          if-no-files-found: warn

