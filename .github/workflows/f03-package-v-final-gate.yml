name: F03-V 24 genuine isolated PostgreSQL16 old17 G3 P2 V2 final gate
on:
  push:
    branches: [feat/f03-package-v-coverage-final-gate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f03-2m-transaction-responsible-handover-pg16:
    name: F03-2-2M isolated PG16 Transaction 93-to-94 one-table discovery
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: engineering
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: engineering/package-lock.json
      - name: Validate frozen project and read-only structural checks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          node --check f03/runtime-transaction-responsible-handover/migration.mjs
          node --check f03/runtime-transaction-responsible-handover/evidence.mjs
          node --check f03/runtime-transaction-responsible-handover/fixtures.mjs
          node --check f03/runtime-transaction-responsible-handover/service.mjs
          node --check f03/runtime-transaction-responsible-handover/tests/integration.test.mjs
      - name: Disposable non-superuser new PG16 exact approved 000001 to 000004 baseline
        run: |
          set -euo pipefail
          ids="$(docker ps --filter ancestor=public.ecr.aws/docker/library/postgres:16-alpine --format '{{.ID}}')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE f03_ci WITH LOGIN PASSWORD 'f03_ci_synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE f03_auth_test OWNER f03_ci"
          node f03-1/runner.mjs --bootstrap
          node f03-1/runner.mjs --apply
          node f03/runtime-scope/runner.mjs --apply
          node f03/runtime-admin-population/runner.mjs --apply
          node f03/runtime-receiving-pool/runner.mjs --apply
          node f03/runtime-receiving-pool/runner.mjs --verify
          node f03/runtime-team-scope/runner.mjs --apply
          node f03/runtime-team-scope/runner.mjs --verify
      - name: Verify immutable 93 tables and 000013 proposed catalog in real PG16 then discover must ROLLBACK
        run: |
          set -euo pipefail
          node f03/runtime-handover-ledger/runner.mjs --apply
          node f03/runtime-customer-owner-handover/runner.mjs --apply
          node f03/runtime-demand-responsible-handover/runner.mjs --apply
          node f03/runtime-consultation-assignee-handover/runner.mjs --apply
          node f03/runtime-consultation-assignee-handover/runner.mjs --verify
          node f03/runtime-waitlist-responsible-handover/runner.mjs --apply
          node f03/runtime-waitlist-responsible-handover/runner.mjs --verify
          node f03/runtime-lock-responsible-handover/runner.mjs --apply
          node f03/runtime-lock-responsible-handover/runner.mjs --verify
          node f03/runtime-transaction-responsible-handover/runner.mjs --discover
          node f03/runtime-lock-responsible-handover/runner.mjs --verify
      - name: Seed all synthetic F03-1/E/F/G/H/I/J/K data and snapshot true old 94-table PG16 physical catalog
        run: |
          set -euo pipefail
          mkdir -p f03/runtime-transaction-responsible-handover/artifacts
          node f03-1/fixtures.mjs
          node f03/runtime-scope/fixtures.mjs
          node f03/runtime-governance-template/fixtures.mjs
          node f03/runtime-receiving-pool/fixtures.mjs
          node f03/runtime-team-scope/fixtures.mjs
          node f03/runtime-handover-ledger/fixtures.mjs
          node f03/runtime-manager-team-governance/fixtures.mjs
          node f03/runtime-handover-preflight/fixtures.mjs
          node f03/runtime-customer-owner-handover/fixtures.mjs
          node f03/runtime-demand-responsible-handover/fixtures.mjs
          node f03/runtime-consultation-assignee-handover/fixtures.mjs
          node f03/runtime-waitlist-responsible-handover/fixtures.mjs
          node f03/runtime-lock-responsible-handover/fixtures.mjs
          node f03/runtime-transaction-responsible-handover/fixtures.mjs
          node f03/runtime-transaction-responsible-handover/evidence.mjs --old
      - name: Reject injected 000013 and prove frozen 94-table full original seal
        run: |
          set -euo pipefail
          if node f03/runtime-transaction-responsible-handover/runner.mjs --inject; then echo 'M_INJECT_UNEXPECTED_ACCEPT'; exit 1; fi
          node f03/runtime-lock-responsible-handover/runner.mjs --verify
      - name: Apply only pinned 000013, verify 94-table, prove 93 fails, rollback to 93, repeat exact 94
        run: |
          set -euo pipefail
          node f03/runtime-transaction-responsible-handover/runner.mjs --apply
          node f03/runtime-transaction-responsible-handover/runner.mjs --verify
          if node f03/runtime-lock-responsible-handover/runner.mjs --verify; then echo 'OLD_93_GUARD_FALSE_POSITIVE'; exit 1; fi
          node f03/runtime-transaction-responsible-handover/runner.mjs --rollback
          node f03/runtime-lock-responsible-handover/runner.mjs --verify
          node f03/runtime-transaction-responsible-handover/runner.mjs --apply
          node f03/runtime-transaction-responsible-handover/runner.mjs --verify
      - name: Real PG16 M01-M11 Transaction CAS, genuine Deposit, 30 directional H/I/J/K/L/M keys, six sessions
        run: |
          set -euo pipefail
          node --test f03/runtime-transaction-responsible-handover/tests/integration.test.mjs 2>&1 | tee f03/runtime-transaction-responsible-handover/artifacts/pg16-transaction-handover-tests.log
          grep -q '# fail 0' f03/runtime-transaction-responsible-handover/artifacts/pg16-transaction-handover-tests.log
          node f03/runtime-transaction-responsible-handover/runner.mjs --verify
      - name: PG16 actual full 93-to-94 catalog old/new, original schema-only and all version checksums
        run: |
          set -euo pipefail
          node f03/runtime-transaction-responsible-handover/evidence.mjs --new
          ids="$(docker ps --filter ancestor=public.ecr.aws/docker/library/postgres:16-alpine --format '{{.ID}}')"
          docker exec -e PGPASSWORD=f03_ci_synthetic_only "$ids" pg_dump --host=127.0.0.1 --username=f03_ci --dbname=f03_auth_test --schema-only --no-owner --no-privileges --schema=public > f03/runtime-transaction-responsible-handover/artifacts/pg16_schema_only.sql
          sha256sum f03/runtime-transaction-responsible-handover/artifacts/pg16_schema_only.sql f03/runtime-transaction-responsible-handover/artifacts/pg16_inventory.json > f03/runtime-transaction-responsible-handover/artifacts/sha256sums.txt
          if test -f f03/runtime-transaction-responsible-handover/evidence/SOURCE.md; then node f03/runtime-transaction-responsible-handover/evidence.mjs --archive-check; fi
      - name: Deny leaking authentication secrets or real private keys in L disposable evidence
        run: |
          set -euo pipefail
          if grep -R -nE 'scrypt[$]v1[$]|__Host-mb_pc=[A-Za-z0-9_-]{43}|BEGIN PRIVATE KEY|Synthetic2L_Transaction_2026|SyntheticGovAdminTwo_2026' f03/runtime-transaction-responsible-handover/artifacts; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: f03-2-2m-real-pg16-94-transaction-responsible-immutable-sg06-evidence
          path: engineering/f03/runtime-transaction-responsible-handover/artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Archive genuine first CI PG16 94-table original source bytes once on authorized B branch
        run: |
          set -euo pipefail
          if test -f f03/runtime-transaction-responsible-handover/evidence/SOURCE.md; then
            echo 'F03-2-2M SOURCE archived and subsequent runs verify full physical catalog plus original raw bytes'
          else
            test "$GITHUB_REF" = 'refs/heads/feat/f03-transaction-responsible-handover-2m'
            mkdir -p f03/runtime-transaction-responsible-handover/evidence
            for file in old-structure.json new-structure.json pg16_schema_only.sql pg16_inventory.json sha256sums.txt; do
              cp "f03/runtime-transaction-responsible-handover/artifacts/$file" "f03/runtime-transaction-responsible-handover/evidence/$file"
            done
            printf 'source_run_id: %s\nsource_commit_sha: %s\nsource_job_name: f03-2m-transaction-responsible-handover-pg16\nsource_artifact_name: f03-2-2m-real-pg16-94-transaction-responsible-immutable-sg06-evidence\nsource_files: original isolated non-privileged real PG16 physical catalog bytes, no customer rows or live secrets\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > f03/runtime-transaction-responsible-handover/evidence/SOURCE.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- f03/runtime-transaction-responsible-handover/evidence/
            git diff --cached --quiet && { echo 'M_ARCHIVE_NOT_STAGED'; exit 1; }
            git commit -m 'F03-2-2M: archive genuine 94-table PG16 original structure source'
            git push origin HEAD:refs/heads/feat/f03-transaction-responsible-handover-2m
          fi
