name: F05-9 PDM14 signed Recommendation true PostgreSQL16 Source and TLS
on:
  push:
    branches: [feat/f05-9-recommendation-visibility-grants]
  pull_request:
    branches: [main]
    paths:
      - 'engineering/f01/**'
      - 'engineering/f02/**'
      - 'engineering/f03/**'
      - 'engineering/f04/**'
      - 'engineering/f05/**'
      - 'engineering/shared/**'
      - 'engineering/db/**'
      - 'engineering/database/**'
      - 'engineering/migrations/**'
      - 'engineering/sql/**'
      - 'engineering/scripts/**'
      - 'engineering/ci/**'
      - 'engineering/package.json'
      - 'engineering/package-lock.json'
      - 'engineering/npm-shrinkwrap.json'
      - 'engineering/pnpm-lock.yaml'
      - 'engineering/yarn.lock'
      - 'engineering/.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - '.npmrc'
      - 'database/**'
      - 'migrations/**'
      - 'sql/**'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/f05-*.yml'
      - '.github/workflows/f05-*.yaml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  recommendation-source:
    name: F05-9 new Source v25 true PG16
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: 验证旧脚本的本地PG16容器祖先别名 不访问ECR
        shell: bash
        run: |
          set -euo pipefail
          # 官方DockerHub postgres:16已由GitHub服务启动。只在Runner内加旧镜像名别名，不发起ECR拉取。
          original_id="$(docker image inspect postgres:16 --format '{{.Id}}')"
          docker tag postgres:16 public.ecr.aws/docker/library/postgres:16-alpine
          alias_id="$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
          test "$original_id" = "$alias_id"
          original_container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"
          legacy_container="$(docker ps --filter ancestor=public.ecr.aws/docker/library/postgres:16-alpine --format '{{.ID}}')"
          test -n "$original_container"
          test "$original_container" = "$legacy_container"
          test "$(printf '%s\n' "$legacy_container" | sed '/^$/d' | wc -l)" -eq 1
          echo "F05_PG16_DOCKERHUB_LOCAL_TAG_ALIAS_CONFIRMED_NO_ECR_NETWORK_PULL $original_id"

      - name: Native F05-9 signed-v25 Source and 70 job official proof
        run: bash engineering/f05/recommendation-visibility-grants/ci-job.sh source
        env:
          GH_ACTIONS_READ_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: f05-9-source-native-pg16-evidence
          path: engineering/f05/recommendation-visibility-grants/artifacts/source/
          retention-days: 30
          if-no-files-found: error
  recommendation-https:
    name: F05-9 new HTTPS v25 true PG16
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: 验证旧脚本的本地PG16容器祖先别名 不访问ECR
        shell: bash
        run: |
          set -euo pipefail
          # 官方DockerHub postgres:16已由GitHub服务启动。只在Runner内加旧镜像名别名，不发起ECR拉取。
          original_id="$(docker image inspect postgres:16 --format '{{.Id}}')"
          docker tag postgres:16 public.ecr.aws/docker/library/postgres:16-alpine
          alias_id="$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
          test "$original_id" = "$alias_id"
          original_container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"
          legacy_container="$(docker ps --filter ancestor=public.ecr.aws/docker/library/postgres:16-alpine --format '{{.ID}}')"
          test -n "$original_container"
          test "$original_container" = "$legacy_container"
          test "$(printf '%s\n' "$legacy_container" | sed '/^$/d' | wc -l)" -eq 1
          echo "F05_PG16_DOCKERHUB_LOCAL_TAG_ALIAS_CONFIRMED_NO_ECR_NETWORK_PULL $original_id"

      - name: Native F05-9 HTTPS customer/employee issuer fail closed
        run: bash engineering/f05/recommendation-visibility-grants/ci-job.sh https
      - uses: actions/upload-artifact@v4
        with:
          name: f05-9-https-native-pg16-evidence
          path: engineering/f05/recommendation-visibility-grants/artifacts/https/
          retention-days: 30
          if-no-files-found: error
