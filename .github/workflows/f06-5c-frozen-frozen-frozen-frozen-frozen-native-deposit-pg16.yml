name: F06-3A isolated native PG16 Deposit receipts and correction ledger Source28 and HTTPS9
on:
  push:
    branches: [feat/f06-5c-transaction-priority-admission-ci]
permissions: {contents: read, actions: read, pull-requests: read}
# Retain all latest SHA jobs; supersede obsolete push workflow runs.
concurrency:
  group: f06-5c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  f06-3a-source:
    name: F06-3A Source real nonprivileged PG16 Deposit receipts and correction ledger immutable audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official PG16 Docker Hub tag and alias original frozen ECR reference
        run: |
          set -euo pipefail
          docker image inspect postgres:16-alpine >/dev/null 2>&1 || docker pull postgres:16-alpine
          docker tag postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine
          test "$(docker image inspect postgres:16-alpine --format '{{.Id}}')" = "$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
          echo F06_5A_OFFICIAL_PG16_IMAGE_ALIAS_VERIFIED
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Old signed F06-1 48 plus new PG16 lifecycle 24 and dual physical OID seal
        run: env GITHUB_REF=refs/heads/feat/f06-3a-deposit-ledger-ci GITHUB_REF_NAME=feat/f06-3a-deposit-ledger-ci bash engineering/f06/deposit-ledger-ci/ci-job.sh source
        env:
          GH_ACTIONS_READ_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: f06-3a-source-native-pg16-evidence
          path: engineering/f06/deposit-ledger-ci/artifacts/source/
          retention-days: 30
          if-no-files-found: error
  f06-3a-https:
    name: F06-3A HTTPS nonprivileged PostgreSQL16 production issuer hard deny
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official PG16 Docker Hub tag and alias original frozen ECR reference
        run: |
          set -euo pipefail
          docker image inspect postgres:16-alpine >/dev/null 2>&1 || docker pull postgres:16-alpine
          docker tag postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine
          test "$(docker image inspect postgres:16-alpine --format '{{.Id}}')" = "$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
          echo F06_5A_OFFICIAL_PG16_IMAGE_ALIAS_VERIFIED
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Real TLS production customer employee issuer and money deny
        run: env GITHUB_REF=refs/heads/feat/f06-3a-deposit-ledger-ci GITHUB_REF_NAME=feat/f06-3a-deposit-ledger-ci bash engineering/f06/deposit-ledger-ci/ci-job.sh https
      - uses: actions/upload-artifact@v4
        with:
          name: f06-3a-https-native-pg16-evidence
          path: engineering/f06/deposit-ledger-ci/artifacts/https/
          retention-days: 30
          if-no-files-found: error
