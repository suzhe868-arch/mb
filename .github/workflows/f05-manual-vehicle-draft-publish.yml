name: F05 manual Mingbang and 4S vehicle drafts real HTTPS PG16 non-production
on:
  push:
    branches:
      - feat/f05-manual-vehicle-draft-publish-pg16-01
    paths:
      - '.github/workflows/f05-manual-vehicle-draft-publish.yml'
      - 'engineering/f05/manual-vehicle-draft-publish/**'
      - 'engineering/f05/vehicle-stewardship-physical-scope/service.mjs'
      - 'engineering/f05/vehicle-stewardship-physical-scope/tests/physical.test.mjs'
      - 'engineering/f05/vehicle-stewardship-physical-scope/tests/https.test.mjs'
      - 'engineering/f05/four-s-member-trust-scope/source-gate.mjs'
      - 'engineering/f05/four-s-member-trust-scope/tests/bridge-source.test.mjs'
      - 'engineering/f05/four-s-member-trust-scope/tests/bridge-https.test.mjs'
permissions:
  contents: read
concurrency:
  group: manual-vehicle-draft-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-draft-publish-pg16:
    name: Original M94 -> F05-2 -> F05-3A and new private draft schema with real HTTPS PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
      F05_2_ISOLATION_CONFIRM: I_AUTHORIZE_F05_2_DISPOSABLE_PG16_ONLY
      F05_MANUAL_VEHICLE_DRAFT_PUBLISH_CONSENT: I_AUTHORIZE_F05_MANUAL_VEHICLE_DRAFT_PUBLISH_PG16_ONLY
      F05_MANUAL_TLS_KEY_PATH: /tmp/f05-manual-vehicle-key.pem
      F05_MANUAL_TLS_CERT_PATH: /tmp/f05-manual-vehicle-cert.pem
    defaults:
      run:
        working-directory: engineering
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: engineering/package-lock.json
      - name: Exact branch SHA and changed-path whitelist
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$GITHUB_REPOSITORY" = "suzhe868-arch/mb"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/feat/f05-manual-vehicle-draft-publish-pg16-01"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          BASE="$(git merge-base origin/main HEAD)"
          git diff --check "$BASE" HEAD
          while IFS= read -r file; do
            case "$file" in
              engineering/f05/manual-vehicle-draft-publish/*|\
              .github/workflows/f05-manual-vehicle-draft-publish.yml|\
              engineering/f05/vehicle-stewardship-physical-scope/service.mjs|\
              engineering/f05/vehicle-stewardship-physical-scope/tests/physical.test.mjs|\
              engineering/f05/vehicle-stewardship-physical-scope/tests/https.test.mjs|\
              engineering/f05/four-s-member-trust-scope/source-gate.mjs|\
              engineering/f05/four-s-member-trust-scope/tests/bridge-source.test.mjs|\
              engineering/f05/four-s-member-trust-scope/tests/bridge-https.test.mjs) ;;
              *) echo "FORBIDDEN_CHANGED_PATH $file"; exit 91 ;;
            esac
          done < <(git -c core.quotePath=false diff --name-only "$BASE" HEAD)
          while IFS= read -r file; do node --check "$file"; done < <(git -c core.quotePath=false diff --name-only "$BASE" HEAD | grep -E '^engineering/.*\.(mjs|cjs|js)$')
          echo "F05_MANUAL_DRAFT_SHA_AND_SCOPE_PASS"
      - name: Frozen dependency and application syntax
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Bootstrap disposable non-superuser original PG16 through M94
        run: |
          set -euo pipefail
          ids="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE f03_ci WITH LOGIN PASSWORD 'f03_ci_synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE f03_auth_test OWNER f03_ci"
          node f03-1/runner.mjs --bootstrap
          node f03-1/runner.mjs --apply
          node f03/runtime-scope/runner.mjs --apply
          node f03/runtime-admin-population/runner.mjs --apply
          node f03/runtime-receiving-pool/runner.mjs --apply
          node f03/runtime-team-scope/runner.mjs --apply
          node f03/runtime-handover-ledger/runner.mjs --apply
          node f03/runtime-customer-owner-handover/runner.mjs --apply
          node f03/runtime-demand-responsible-handover/runner.mjs --apply
          node f03/runtime-consultation-assignee-handover/runner.mjs --apply
          node f03/runtime-waitlist-responsible-handover/runner.mjs --apply
          node f03/runtime-lock-responsible-handover/runner.mjs --apply
          node f03/runtime-lock-responsible-handover/runner.mjs --verify
          mkdir -p f05/manual-vehicle-draft-publish/artifacts
          node f03-1/fixtures.mjs
          node f03/runtime-scope/fixtures.mjs
          node f03/runtime-governance-template/fixtures.mjs
          node f03/runtime-receiving-pool/fixtures.mjs
          node f03/runtime-team-scope/fixtures.mjs
          node f03/runtime-handover-ledger/fixtures.mjs
          node f03/runtime-manager-team-governance/fixtures.mjs
          node f03/runtime-handover-preflight/fixtures.mjs
          node f03/runtime-customer-owner-handover/fixtures.mjs
          node f03/runtime-demand-responsible-handover/fixtures.mjs
          node f03/runtime-consultation-assignee-handover/fixtures.mjs
          node f03/runtime-waitlist-responsible-handover/fixtures.mjs
          node f03/runtime-lock-responsible-handover/fixtures.mjs
          node f03/runtime-transaction-responsible-handover/fixtures.mjs
          node f03/runtime-transaction-responsible-handover/evidence.mjs --old
          node f03/runtime-transaction-responsible-handover/runner.mjs --apply
          node f03/runtime-transaction-responsible-handover/runner.mjs --verify
          node f03/runtime-handover-reconciliation/fixtures.mjs
          node f03/field-security-projection/fixtures.mjs
      - name: Apply unchanged F05-2 original trust schema and its synthetic fixtures
        run: |
          set -euo pipefail
          node f05/vehicle-stewardship-physical-scope/runner.mjs --inject-rollback
          node f05/vehicle-stewardship-physical-scope/runner.mjs --apply
          node f05/vehicle-stewardship-physical-scope/runner.mjs --verify
          node f05/vehicle-stewardship-physical-scope/fixtures.mjs
      - name: Real F05-2 physical and HTTPS affected regressions before 000016
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -subj '/CN=127.0.0.1' -days 1 -keyout /tmp/f04-3-ci-key.pem -out /tmp/f04-3-ci-cert.pem >/dev/null 2>&1
          chmod 600 /tmp/f04-3-ci-key.pem
          node --test f05/vehicle-stewardship-physical-scope/tests/physical.test.mjs 2>&1 | tee f05/manual-vehicle-draft-publish/artifacts/f05-2-physical.log
          grep -q '# fail 0' f05/manual-vehicle-draft-publish/artifacts/f05-2-physical.log
          node --test f05/vehicle-stewardship-physical-scope/tests/https.test.mjs 2>&1 | tee f05/manual-vehicle-draft-publish/artifacts/f05-2-https.log
          grep -q '# fail 0' f05/manual-vehicle-draft-publish/artifacts/f05-2-https.log
      - name: Apply unchanged F05-3A original 000016 trust schema
        run: |
          set -euo pipefail
          node f05/four-s-member-trust-scope/runner.mjs --inject-rollback
          node f05/four-s-member-trust-scope/runner.mjs --apply
          node f05/four-s-member-trust-scope/runner.mjs --verify
          node f05/four-s-member-trust-scope/fixtures.mjs
      - name: Apply private draft schema with injected PG16 rollback proof
        run: |
          set -euo pipefail
          node f05/manual-vehicle-draft-publish/runner.mjs --inject-rollback
          node f05/manual-vehicle-draft-publish/runner.mjs --apply
          node f05/manual-vehicle-draft-publish/runner.mjs --verify
          node f05/manual-vehicle-draft-publish/fixtures.mjs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=127.0.0.1' -keyout "$F05_MANUAL_TLS_KEY_PATH" -out "$F05_MANUAL_TLS_CERT_PATH" >/dev/null 2>&1
          chmod 600 "$F05_MANUAL_TLS_KEY_PATH"
      - name: New Mingbang drafts real TLS PG16
        run: |
          set -euo pipefail
          node --test f05/manual-vehicle-draft-publish/tests/mingbang.pg16.test.mjs 2>&1 | tee f05/manual-vehicle-draft-publish/artifacts/manual-mingbang.log
          grep -q '# fail 0' f05/manual-vehicle-draft-publish/artifacts/manual-mingbang.log
      - name: New four_s drafts real TLS PG16
        run: |
          set -euo pipefail
          node --test f05/manual-vehicle-draft-publish/tests/four-s.pg16.test.mjs 2>&1 | tee f05/manual-vehicle-draft-publish/artifacts/manual-four-s.log
          grep -q '# fail 0' f05/manual-vehicle-draft-publish/artifacts/manual-four-s.log
          node f05/manual-vehicle-draft-publish/runner.mjs --verify
          node f05/four-s-member-trust-scope/runner.mjs --verify
      - name: Same-SHA redacted evidence and size guard
        if: always()
        id: evidence_gate
        run: |
          set -euo pipefail
          artifact=f05/manual-vehicle-draft-publish/artifacts
          mkdir -p "$artifact"
          printf '%s\n' "$GITHUB_SHA" > "$artifact/head-sha.txt"
          printf '%s\n' "$GITHUB_REF" > "$artifact/branch.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$artifact/run-id.txt"
          (cd "$artifact" && find . -maxdepth 1 -type f ! -name 'sha256sums.txt' -print0 | sort -z | xargs -0 -r sha256sum > sha256sums.txt)
          test "$(du -sb "$artifact" | awk '{print $1}')" -le 20971520
          if grep -R -nE 'BEGIN PRIVATE KEY|__Host-mb_pc=[A-Za-z0-9_-]{43}|scrypt[$]v1[$]|SyntheticF04_3_CurrentProof_2026|SyntheticOtherFourS_123456' "$artifact"; then exit 92; fi
          echo "F05_MANUAL_DRAFT_EVIDENCE_SIZE_PASS"
      - name: Upload same-SHA synthetic evidence
        if: always() && steps.evidence_gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: f05-manual-vehicle-draft-evidence-${{ github.run_id }}
          path: engineering/f05/manual-vehicle-draft-publish/artifacts/
          if-no-files-found: error
          retention-days: 1
