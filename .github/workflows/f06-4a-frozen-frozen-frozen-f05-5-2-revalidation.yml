name: F05-11 inherited frozen f05-5-2
on:
  push:
    branches: [feat/f06-4a-transaction-cancel-ci]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  quota-source:
    name: F05-5 source true nonprivileged PostgreSQL16 v21 PDM10 true Employee free quota addition source test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: '22.16.0'}
    - run: bash engineering/f05/employee-price-quota-adjustment/ci-job.sh source
    - uses: actions/upload-artifact@v4
      with:
        name: f05-5-source-native-evidence
        path: engineering/f05/employee-price-quota-adjustment/artifacts/source/
        retention-days: 30
        if-no-files-found: error
  quota-https:
    name: F05-5 https true nonprivileged PostgreSQL16 v21 PDM10 Employee quota HTTPS denial test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: '22.16.0'}
    - run: bash engineering/f05/employee-price-quota-adjustment/ci-job.sh https
    - uses: actions/upload-artifact@v4
      with:
        name: f05-5-https-native-evidence
        path: engineering/f05/employee-price-quota-adjustment/artifacts/https/
        retention-days: 30
        if-no-files-found: error
