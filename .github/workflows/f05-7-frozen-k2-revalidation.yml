name: F05-7 frozen frozen-k2
on:
  push:
    branches: [feat/f05-7-deterministic-matching-readiness-four-tier]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  k-source:
    name: F05-3K source true nonprivileged PostgreSQL16 v19 Favorite converted JYT replay guard test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
    - uses: actions/checkout@v4
    - name: F05-7 冻结PG16旧祖先名仅Runner本地兼容
      run: bash "$GITHUB_WORKSPACE/engineering/f05/source-controlled-recovery-02/pg16-local-alias.sh"
    - uses: actions/setup-node@v4
      with: {node-version: '22.16.0'}
    - run: bash engineering/f05/favorite-converted-jyt-replay-guard/ci-job.sh source
    - uses: actions/upload-artifact@v4
      with:
        name: f05-3k-source-native-evidence
        path: engineering/f05/favorite-converted-jyt-replay-guard/artifacts/source/
        retention-days: 30
        if-no-files-found: error
  k-https:
    name: F05-3K https true nonprivileged PostgreSQL16 v19 Favorite conversion replay guard test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
    - uses: actions/checkout@v4
    - name: F05-7 冻结PG16旧祖先名仅Runner本地兼容
      run: bash "$GITHUB_WORKSPACE/engineering/f05/source-controlled-recovery-02/pg16-local-alias.sh"
    - uses: actions/setup-node@v4
      with: {node-version: '22.16.0'}
    - run: bash engineering/f05/favorite-converted-jyt-replay-guard/ci-job.sh https
    - uses: actions/upload-artifact@v4
      with:
        name: f05-3k-https-native-evidence
        path: engineering/f05/favorite-converted-jyt-replay-guard/artifacts/https/
        retention-days: 30
        if-no-files-found: error
