name: F06-5A frozen original H52 independent 52 native PG16 jobs
on:
  push:
    branches: [feat/f06-5b-lock-refund-conversion-guard-ci]
permissions: {contents: read, actions: read, pull-requests: read}
# Retain all latest SHA jobs; supersede obsolete push workflow runs.
concurrency:
  group: f06-5b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  f03-2m-transaction-responsible-handover-pg16:
    name: F03-2-2M isolated PG16 Transaction 93-to-94 one-table discovery
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: engineering
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official PG16 Docker Hub tag and alias original frozen ECR reference
        run: |
          set -euo pipefail
          docker image inspect postgres:16-alpine >/dev/null 2>&1 || docker pull postgres:16-alpine
          docker tag postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine
          test "$(docker image inspect postgres:16-alpine --format '{{.Id}}')" = "$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
          echo F06_5A_OFFICIAL_PG16_IMAGE_ALIAS_VERIFIED
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Execute every original frozen shell test step from the signed parent YAML
        run: test "$GITHUB_REF" = refs/heads/feat/f06-5b-lock-refund-conversion-guard-ci && test "$GITHUB_REF_NAME" = feat/f06-5b-lock-refund-conversion-guard-ci && GITHUB_REF=refs/heads/feat/f06-5a-transaction-refund-pending-ci GITHUB_REF_NAME=feat/f06-5a-transaction-refund-pending-ci node "$GITHUB_WORKSPACE/engineering/f06/transaction-refund-ci/h52-runner.mjs" f03-2m-transaction-responsible-handover-pg16
      - uses: actions/upload-artifact@v4
        with:
          name: f06-5a-h52-f03-2m-transaction-responsible-handover-pg16
          path: engineering/f06/transaction-refund-ci/artifacts/h52/f03-2m-transaction-responsible-handover-pg16/
          retention-days: 30
          if-no-files-found: error
