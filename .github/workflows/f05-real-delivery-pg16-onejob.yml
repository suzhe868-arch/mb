permissions:
  contents: read
concurrency:
  group: f05-real-pg16-onejob
  cancel-in-progress: true
jobs:
  isolated_real_pg16:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      NODE_ENV: test
      API_HOST: 127.0.0.1
      F05_CATALOG_TEST_CONSENT: I_AUTHORIZE_DISPOSABLE_F05_CATALOG_PG16_ONLY
      F05_CATALOG_DATABASE_URL: postgres://f05_catalog_ci:disposable_f05_ci_only@127.0.0.1:5432/f05_catalog_test
      F05_CATALOG_TEST_VEHICLE_ID: '59001'
      F05_CATALOG_TEST_CYCLE_ID: '59001'
    defaults:
      run:
        working-directory: engineering
        shell: bash
    steps:
      - name: Exact commit checkout, no retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Standard Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Branch, event and SHA guard
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = suzhe868-arch/mb
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/feat/f05-real-delivery-acceptance-closeout-01
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Frozen dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Actual HTTP and safety assertions
        run: node --test tests/catalog.test.mjs tests/catalog-regression.test.mjs tests/f05-favorite.test.mjs tests/f05-consultation.test.mjs tests/f05-consultation-response.test.mjs tests/f05-employee-start.test.mjs tests/f05-handover.test.mjs tests/f05-sla-hold.test.mjs tests/f05-price-unlock.test.mjs tests/f05-quota-addition.test.mjs tests/f05-find-car.test.mjs tests/f05-find-car-activation.test.mjs tests/f05-demand-lifecycle.test.mjs tests/f05-employee-vehicle-read.test.mjs tests/f05-matching.test.mjs tests/f05-matching-dictionary.test.mjs tests/f05-matching-discovery.test.mjs tests/f05-matching-conditions.test.mjs tests/f05-recommendation.test.mjs tests/f05-priority.test.mjs tests/f05-priority-qualification.test.mjs
      - name: Bootstrap truly disposable PG16 non-superuser schema
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import pg from 'pg';
          import {readFile} from 'node:fs/promises';
          import {compileCurrentInitial} from './f02-1/compile-current.mjs';
          if(process.env.APP_ENV!=='test'||process.env.NODE_ENV!=='test'||
             process.env.GITHUB_ACTIONS!=='true'||process.env.GITHUB_REF!=='refs/heads/feat/f05-real-delivery-acceptance-closeout-01') throw Error('NOT_ISOLATED');
          const admin=new pg.Client({connectionString:'postgres://postgres:disposable_bootstrap_only@127.0.0.1:5432/postgres'});
          let client;
          try{
            await admin.connect();
            let z=(await admin.query("SELECT current_database() db,current_user usr,current_setting('server_version_num')::int ver,(SELECT rolsuper FROM pg_roles WHERE rolname=current_user) su")).rows[0];
            if(z.db!=='postgres'||z.usr!=='postgres'||!z.su||z.ver<160000||z.ver>=170000)throw Error('BOOTSTRAP_PG16_IDENTITY');
            if((await admin.query("SELECT 1 FROM pg_database WHERE datname='f05_catalog_test'")).rowCount!==0)throw Error('PREEXISTING_TARGET');
            await admin.query("CREATE ROLE f05_catalog_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'disposable_f05_ci_only'");
            await admin.query("CREATE DATABASE f05_catalog_test OWNER f05_catalog_ci");
            client=new pg.Client({connectionString:process.env.F05_CATALOG_DATABASE_URL});
            await client.connect();
            await client.query('BEGIN');
            // Apply genuine immutable F02-1 Current Initial schema (76 entities), not a miniature imitation.
            const candidate=await compileCurrentInitial();
            const pinned=JSON.parse(await readFile('f02-1/migrations/000001_current_initial.manifest.json','utf8'));
            if(candidate.checksum!==pinned.sha256||candidate.stats.tables!==76||
               JSON.stringify(candidate.stats)!==JSON.stringify(pinned.stats))throw Error('F02_FULL_CURRENT_SCHEMA_CHECKSUM_MISMATCH');
            await client.query(candidate.sql);
            const physical=(await client.query("SELECT count(*)::integer AS n FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace ns ON ns.oid=c.relnamespace WHERE ns.nspname='public' AND c.relkind='r'")).rows[0].n;
            if(physical!==76)throw Error('F02_FULL_CURRENT_SCHEMA_TABLE_COUNT_'+physical);
            console.log('F02_1_FULL_CURRENT_SCHEMA_APPLIED tables='+physical+' checksum='+candidate.checksum);

            await client.query(await readFile('catalog/000027_catalog_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000028_matching_invalidation_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000029_matching_evidence_stale_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000030_matching_source_lock_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000031_matching_ttl_retry_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000032_matching_dictionary_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000033_matching_candidate_discovery_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000034_matching_hard_fields_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000035_matching_discovery_paged_audit_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000036_matching_rule_change_discovery_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000037_matching_dictionary_field_check_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000038_matching_optional_price_safe_view_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000039_recommendation_lifecycle_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000040_priority_arbitration_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000041_priority_safe_consumer_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000042_recommendation_free_price_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000043_priority_ttl_sweep_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000044_priority_qualification_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000045_demand_lifecycle_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000046_consultation_manager_capability_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000047_vehicle_employee_read_scope_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000048_catalog_sort_facts_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000049_consultation_human_response_disposable_test_only.sql','utf8'));
            await client.query(await readFile('catalog/000050_priority_reliable_scheduler_disposable_test_only.sql','utf8'));
            await client.query("INSERT INTO public.vehicle_brands(brand_id,brand_name) VALUES(59001,'隔离测试品牌')");
            await client.query("INSERT INTO public.vehicle_series(series_id,brand_id,series_name) VALUES(59001,59001,'隔离测试车系')");
            await client.query("INSERT INTO public.vehicle_models(model_id,brand_id,series_id,model_name,model_year,profile_status) VALUES(59001,59001,59001,'隔离测试车型',2026,'incomplete')");
            await client.query("INSERT INTO public.vehicles(vehicle_id,source_type,source_sale_status,platform_visibility,model_id,created_at) VALUES(59001,'wholesale','active','visible',59001,statement_timestamp()),(59002,'wholesale','active','hidden',NULL,statement_timestamp())");
            await client.query("INSERT INTO public.vehicle_listing_cycles(listing_cycle_id,vehicle_id,started_at) VALUES(59001,59001,statement_timestamp()),(59002,59002,statement_timestamp())");
            await client.query("INSERT INTO public.vehicle_images(image_id,vehicle_id,relative_path,source_url_fact,asset_storage_status) VALUES(59001,59001,'https://jyt.internal/PRIVATE',NULL,'processing'),(59002,59001,'C7/side.webp',NULL,'processing'),(59003,59001,'C7/front.webp','https://jyt.internal/PRIVATE','processing')");
            await client.query("INSERT INTO public.f05_real_catalog_photo_order_test(image_id,vehicle_id,source_type,original_sort_index) VALUES(59001,59001,'wholesale',0),(59002,59001,'wholesale',2),(59003,59001,'wholesale',1)");
            await client.query("INSERT INTO public.customer_levels(level_id,level_code) VALUES(59001,'normal')");
            await client.query("INSERT INTO public.customers(customer_id,account_status,customer_level_id,owner_assignment_state) VALUES(59001,'active',59001,'owner_assignment_pending'),(59002,'disabled',59001,'owner_assignment_pending')");
            await client.query('COMMIT');
            z=(await client.query("SELECT current_user usr,(SELECT rolsuper FROM pg_roles WHERE rolname=current_user) su")).rows[0];
            if(z.usr!=='f05_catalog_ci'||z.su!==false)throw Error('NON_SUPERUSER_CHECK_FAILED');
            console.log('F05_DISPOSABLE_REAL_PG16_16_NONPRIVILEGED_READY; F02_1_FULL_CURRENT_SCHEMA=YES; HISTORICAL_M94_CHAIN=NOT_ASSERTED; PRODUCTION=NO');
          }catch(e){if(client)try{await client.query('ROLLBACK')}catch{}throw e}
          finally{await client?.end();await admin.end()}
          JS
      - name: Two-connection physical PG16 and HTTP tests
        run: |
          set -euo pipefail
          node --test integration/catalog.pg16.test.mjs
          node --test integration/f05-catalog-sorts.pg16.test.mjs
          node --test integration/f05-full-runtime-wiring.pg16.test.mjs
          node --test integration/f05-favorite.pg16.test.mjs
          node --test integration/f05-consultation.pg16.test.mjs
          node --test integration/f05-consultation-response.pg16.test.mjs
          node --test integration/f05-employee-start.pg16.test.mjs
          node --test integration/f05-handover.pg16.test.mjs
          node --test integration/f05-sla-hold.pg16.test.mjs
          node --test integration/f05-price-unlock.pg16.test.mjs
          node --test integration/f05-quota-addition.pg16.test.mjs
          node --test integration/f05-find-car.pg16.test.mjs
          node --test integration/f05-find-car-activation.pg16.test.mjs
          node --test integration/f05-demand-lifecycle.pg16.test.mjs
          node --test integration/f05-matching.pg16.test.mjs
          node --test integration/f05-matching-invalidation.pg16.test.mjs
          node --test integration/f05-matching-evidence-stale.pg16.test.mjs
          node --test integration/f05-matching-source-race.pg16.test.mjs
          node --test integration/f05-matching-ttl-retry.pg16.test.mjs
          node --test integration/f05-matching-dictionary.pg16.test.mjs
          node --test integration/f05-matching-dictionary-activation.pg16.test.mjs
          node --test integration/f05-matching-rule-change-discovery.pg16.test.mjs
          node --test integration/f05-matching-discovery.pg16.test.mjs
          node --test integration/f05-matching-conditions.pg16.test.mjs
          node --test integration/f05-recommendation.pg16.test.mjs
          node --test integration/f05-recommendation-price-right.pg16.test.mjs
          node --test integration/f05-priority.pg16.test.mjs
          node --test integration/f05-priority-ttl-sweep.pg16.test.mjs
          node --test integration/f05-priority-scheduler.pg16.test.mjs
          node --test integration/f05-priority-qualification.pg16.test.mjs
          node --test integration/f05-employee-vehicle-read.pg16.test.mjs
      - name: No paid artifact, production action or downstream CI
        run: echo 'F05_REAL_PG16_TEST_ONLY_NO_ARTIFACT_NO_PRODUCTION'
  source_lanes_current_pg16:
    name: F05-2 to 3E current isolated source lanes PG16 and TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: engineering
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
      F05_2_ISOLATION_CONFIRM: I_AUTHORIZE_F05_2_DISPOSABLE_PG16_ONLY
      F04_1_ISOLATION_CONFIRM: I_AUTHORIZE_F04_1_DISPOSABLE_PG16_HTTPS_ONLY
      F04_2_ISOLATION_CONFIRM: I_AUTHORIZE_F04_2_DISPOSABLE_PG16_HTTPS_ONLY
      F04_3_ISOLATION_CONFIRM: I_AUTHORIZE_F04_3_DISPOSABLE_PG16_HTTPS_ONLY
      F04_4_ISOLATION_CONFIRM: I_AUTHORIZE_F04_4_DISPOSABLE_PG16_HTTPS_ONLY
      F05_1_ISOLATION_CONFIRM: I_AUTHORIZE_F05_1_DISPOSABLE_PG16_HTTPS_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact B branch and frozen dependencies
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/feat/f05-real-delivery-acceptance-closeout-01
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild each source lane from clean non-superuser PG16 and run current TLS contracts
        run: |
          set -euo pipefail
          ids="$(docker ps --filter ancestor=public.ecr.aws/docker/library/postgres:16-alpine --format '{{.ID}}')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE f03_ci WITH LOGIN PASSWORD 'f03_ci_synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          reset_db() {
            docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "DROP DATABASE IF EXISTS f03_auth_test WITH (FORCE)"
            docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE f03_auth_test OWNER f03_ci"
          }
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -subj '/CN=127.0.0.1' -days 1 \
            -keyout /tmp/f04-3-ci-key.pem -out /tmp/f04-3-ci-cert.pem >/dev/null 2>&1

          reset_db
          node f05/wholesale-to-mingbang-conversion/ci-prepare.mjs f05-2
          node --test f05/vehicle-stewardship-physical-scope/tests/https.test.mjs 2>&1 | tee /tmp/f05-2-current.log
          grep -q '# fail 0' /tmp/f05-2-current.log

          reset_db
          node f05/wholesale-to-mingbang-conversion/ci-prepare.mjs f05-3a
          node --test f05/four-s-member-trust-scope/tests/bridge-https.test.mjs 2>&1 | tee /tmp/f05-3a-current.log
          grep -q '# fail 0' /tmp/f05-3a-current.log

          reset_db
          node f05/wholesale-to-mingbang-conversion/ci-prepare.mjs f05-3b
          node --test f05/jyt-wholesale-lineage-cycle/tests/https.test.mjs 2>&1 | tee /tmp/f05-3b-current.log
          grep -q '# fail 0' /tmp/f05-3b-current.log

          reset_db
          node f05/wholesale-to-mingbang-conversion/ci-run.mjs https 2>&1 | tee /tmp/f05-3c-current.log
          grep -q 'F05_3C_TWO_PHASE_GENUINE_PG16_HTTPS_TESTED' /tmp/f05-3c-current.log
          node --test f05/wholesale-object-scope-trust/tests/https.test.mjs 2>&1 | tee /tmp/f05-3d-current.log
          grep -q '# fail 0' /tmp/f05-3d-current.log
          node --test f05/hide-reason-trust-recalculation/tests/https.test.mjs 2>&1 | tee /tmp/f05-3e-current.log
          grep -q '# fail 0' /tmp/f05-3e-current.log

          echo 'F05_SOURCE_LANES_CURRENT_PG16_TLS_PASS'
      - name: No artifacts, no production credentials, no main write
        run: echo 'F05_SOURCE_LANES_TEST_ONLY_NO_ARTIFACT_NO_PRODUCTION'
  d1_current_owner_consultation_pg16:
    name: F05-10-D1 current Owner to Consultation PG16
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: engineering
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
