            echo 'F07_RUNTIME_FILE_ALLOWLIST_VIOLATION'
            exit 1
          fi
      - name: 实际 server.mjs loopback HTTPS 黑箱（真实 PG16）
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 engineering/f07/nonprod-runtime-integration/tests/https.test.mjs 2>&1 | tee f07-runtime-https.log
          grep -q 'F07_RUNTIME_HTTPS_BLACKBOX_15_SCENARIOS_PASS' f07-runtime-https.log
          grep -q '# fail 0' f07-runtime-https.log
      - name: 归档本 Job 的真实 Run/SHA/数据库证据
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'commit\t%s\nrun_id\t%s\nref\t%s\njob\truntime_https_pg16\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REF" > f07-runtime-run-evidence.tsv
          if [ -f f07-runtime-identity.tsv ]; then cat f07-runtime-identity.tsv >> f07-runtime-run-evidence.tsv; fi
