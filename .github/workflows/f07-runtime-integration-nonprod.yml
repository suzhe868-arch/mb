          node engineering/f03-1/runner.mjs --apply 2>&1 | tee -a f07-runtime-f03-bootstrap.log
          node engineering/f03-1/runner.mjs --verify 2>&1 | tee -a f07-runtime-f03-bootstrap.log
          node engineering/f03-1/fixtures.mjs 2>&1 | tee -a f07-runtime-f03-bootstrap.log
      - name: 白名单、语法与差异空白门禁
        shell: bash
        run: |
