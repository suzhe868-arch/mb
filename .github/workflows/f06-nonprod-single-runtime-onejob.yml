name: F06 Issue164 单Runtime合法部分与真实PG16失签拒绝
on:
  push:
    branches:
      - feat/f06-nonprod-single-runtime-trusted-source-01
    paths:
      - engineering/f06/nonprod-single-runtime-integration/**
      - engineering/src/f06-nonprod-composite-runtime.mjs
      - engineering/src/server.mjs
      - engineering/src/app.mjs
      - engineering/src/f06-lock-service.mjs
      - engineering/src/f06-lock-readiness.mjs
      - engineering/src/f06-lock-http.mjs
      - engineering/src/f06-lock-lifecycle-service.mjs
      - engineering/src/f06-lock-lifecycle-http.mjs
      - engineering/f06/lock-transaction-http-pg16/service.mjs
      - engineering/f06/transaction-cancel-http-pg16/service.mjs
      - engineering/f06/transaction-refund-http-pg16/service.mjs
      - engineering/f06/transaction-handoff-http-pg16/service.mjs
      - engineering/f06/post-handoff-cancel-http-pg16/service.mjs
      - engineering/f06/post-handoff-refund-bridge-http-pg16/签名来源只读核验.mjs
      - engineering/f06/lockrequest-approval-waitlist-ci/migration.mjs
      - engineering/f06/lock-lifecycle-ci/migration.mjs
      - engineering/f06/deposit-ledger-ci/migration.mjs
      - engineering/f06/deposit-ledger-ci/service.mjs
      - engineering/f06/lock-transaction-ci/migration.mjs
      - engineering/f06/refund-pending-ci/migration.mjs
      - .github/workflows/f06-nonprod-single-runtime-onejob.yml
permissions:
  contents: read
concurrency:
  group: f06-issue164-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native_preliminary_signed_source_gap:
    name: 真实非特权PG16与隔离HTTP安全拒绝｜未完成全链｜NOT_READY
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synthetic_pg_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: 施工分支HEAD与授权文件隔离
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = suzhe868-arch/mb
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = feat/f06-nonprod-single-runtime-trusted-source-01
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git -c core.quotePath=false diff --name-only origin/main...HEAD | while IFS= read -r path; do
            case "$path" in
              engineering/f06/nonprod-single-runtime-integration/*|engineering/f06/nonprod-single-runtime-integration/tests/*|engineering/src/f06-nonprod-composite-runtime.mjs|engineering/src/server.mjs|engineering/src/app.mjs|engineering/src/f06-lock-service.mjs|engineering/src/f06-lock-readiness.mjs|engineering/src/f06-lock-http.mjs|engineering/src/f06-lock-lifecycle-service.mjs|engineering/src/f06-lock-lifecycle-http.mjs|engineering/f06/lock-transaction-http-pg16/service.mjs|engineering/f06/transaction-cancel-http-pg16/service.mjs|engineering/f06/transaction-refund-http-pg16/service.mjs|engineering/f06/transaction-handoff-http-pg16/service.mjs|engineering/f06/post-handoff-cancel-http-pg16/service.mjs|engineering/f06/post-handoff-refund-bridge-http-pg16/签名来源只读核验.mjs|engineering/f06/lockrequest-approval-waitlist-ci/migration.mjs|engineering/f06/lock-lifecycle-ci/migration.mjs|engineering/f06/deposit-ledger-ci/migration.mjs|engineering/f06/deposit-ledger-ci/service.mjs|engineering/f06/lock-transaction-ci/migration.mjs|engineering/f06/refund-pending-ci/migration.mjs|.github/workflows/f06-nonprod-single-runtime-onejob.yml) ;;
              *) echo "::error::超出Issue164精确授权: $path"; exit 1 ;;
            esac
          done
      - name: 准备Node依赖与验证语法
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix engineering --ignore-scripts --no-audit --no-fund
          node --check engineering/src/f06-nonprod-composite-runtime.mjs
          node --check 'engineering/f06/nonprod-single-runtime-integration/tests/真实PG16单Runtime闭环验收.test.mjs'
          bash -n engineering/f06/nonprod-single-runtime-integration/核对同Ref上游签名PG16.sh
          node --check engineering/src/server.mjs
          node --check engineering/src/f06-lock-service.mjs
          node --check engineering/src/f06-lock-readiness.mjs
          node --check engineering/src/f06-lock-http.mjs
          node --check engineering/src/f06-lock-lifecycle-service.mjs
          node --check engineering/src/f06-lock-lifecycle-http.mjs
          node --check engineering/f06/lock-transaction-http-pg16/service.mjs
          node --check engineering/f06/transaction-cancel-http-pg16/service.mjs
          node --check engineering/f06/transaction-refund-http-pg16/service.mjs
          node --check engineering/f06/transaction-handoff-http-pg16/service.mjs
          node --check engineering/f06/post-handoff-cancel-http-pg16/service.mjs
          node --check engineering/f06/post-handoff-refund-bridge-http-pg16/签名来源只读核验.mjs
          node --check engineering/f06/lockrequest-approval-waitlist-ci/migration.mjs
          node --check engineering/f06/lock-lifecycle-ci/migration.mjs
          node --check engineering/f06/deposit-ledger-ci/migration.mjs
          node --check engineering/f06/lock-transaction-ci/migration.mjs
          node --check engineering/f06/refund-pending-ci/migration.mjs
          node --check engineering/f06/deposit-ledger-ci/service.mjs
          node --check engineering/f06/nonprod-single-runtime-integration/composite-issuer.mjs
          node --check engineering/f06/nonprod-single-runtime-integration/可信Composite签名根.mjs
          node --check engineering/f06/nonprod-single-runtime-integration/tests/隔离装配与真实HTTP拒绝.test.mjs
          node --check engineering/f06/nonprod-single-runtime-integration/tests/真实PG16冻结来源拒绝.test.mjs
      - name: 初始化真实非超管PG16但绝不伪签父库
        shell: bash
        run: |
          set -euo pipefail
          service=$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')
          test "$(printf '%s\n' "$service" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$service" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE f06_lock_ci WITH LOGIN PASSWORD 'synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          docker exec "$service" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE f06_lock_test OWNER f06_lock_ci"
      - name: 真实HTTP安全拒绝32项
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engineering/f06/nonprod-single-runtime-integration/evidence
          node --test engineering/f06/nonprod-single-runtime-integration/tests/隔离装配与真实HTTP拒绝.test.mjs | tee engineering/f06/nonprod-single-runtime-integration/evidence/HTTP隔离拒绝_TAP.log
      - name: 真实PG16缺合法签名父数据拒绝6项
        shell: bash
        run: |
          set -euo pipefail
          node --test engineering/f06/nonprod-single-runtime-integration/tests/真实PG16冻结来源拒绝.test.mjs | tee engineering/f06/nonprod-single-runtime-integration/evidence/真实PG16缺签_TAP.log
      - name: 32加6中间拒绝门禁
        shell: bash
        run: |
          set -euo pipefail
          node engineering/f06/nonprod-single-runtime-integration/原生拒绝门禁校验.mjs

      - name: 同真实GitHub Ref初始化原生签名父链（不伪造旧Issuer）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engineering/f06/nonprod-single-runtime-integration/evidence
          bash engineering/f06/nonprod-single-runtime-integration/核对同Ref上游签名PG16.sh | tee engineering/f06/nonprod-single-runtime-integration/evidence/父链签名与初始化.log

      - name: 真实PG16单Runtime业务闭环验收
        shell: bash
        run: |
          set -euo pipefail
          node --test engineering/f06/nonprod-single-runtime-integration/tests/真实PG16单Runtime闭环验收.test.mjs | tee engineering/f06/nonprod-single-runtime-integration/evidence/单Runtime闭环_TAP.log

      - name: F06 Issue164最终独立证据门禁
        shell: bash
        run: |
          set -euo pipefail
          F06_164_REQUIRE_E2E=1 node engineering/f06/nonprod-single-runtime-integration/原生拒绝门禁校验.mjs
