name: F05-7 frozen frozen-f05
on:
  push:
    branches: [feat/f05-7-deterministic-matching-readiness-four-tier]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  find-source:
    name: F05-6 source true nonprivileged PostgreSQL16 v22 PDM11 Application and manual Demand source test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: '22.16.0'}
    - run: bash engineering/f05/find-car-application-demand-eligibility/ci-job.sh source
    - uses: actions/upload-artifact@v4
      with:
        name: f05-6-source-native-evidence
        path: engineering/f05/find-car-application-demand-eligibility/artifacts/source/
        retention-days: 30
        if-no-files-found: error
  find-https:
    name: F05-6 https true nonprivileged PostgreSQL16 v22 PDM11 Customer and Employee HTTPS denial test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: '22.16.0'}
    - run: bash engineering/f05/find-car-application-demand-eligibility/ci-job.sh https
    - uses: actions/upload-artifact@v4
      with:
        name: f05-6-https-native-evidence
        path: engineering/f05/find-car-application-demand-eligibility/artifacts/https/
        retention-days: 30
        if-no-files-found: error
