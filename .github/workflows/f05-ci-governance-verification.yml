name: F05 CI治理隔离审计及真实PG16回归
on:
  push:
    branches: [fix/f05-legacy-ci-governance-01]
    paths:
      - '.github/workflows/f05-7-deterministic-matching-readiness-four-tier.yml'
      - '.github/workflows/f05-8-priority-arbitration-ttl-handover.yml'
      - '.github/workflows/f05-9-recommendation-visibility-grants.yml'
      - '.github/workflows/f05-10-consultation-assignee-sla.yml'
      - '.github/workflows/f05-10-d1-public-pool-owner-claim.yml'
      - '.github/workflows/f05-10-d1-frozen-f05-8-four-revalidation.yml'
      - '.github/workflows/f05-10-d1-frozen-f05-9-two-revalidation.yml'
      - '.github/workflows/f05-9-frozen-f05-8-four-revalidation.yml'
      - '.github/workflows/f05-10-frozen-f05-9-two-revalidation.yml'
      - '.github/workflows/f05-10-frozen-f05-8-four-revalidation.yml'
      - '.github/workflows/f05-ci-governance-*.yml'
      - 'engineering/f05/ci-governance/**'
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  actions: read
jobs:
  governance_node:
    name: F05治理Node 45项含冻结16镜像无提权审计
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 真实提交和原旧workflow一致性校验
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check engineering/f05/ci-governance/audit.mjs
          node --check engineering/f05/ci-governance/tests/audit.test.mjs
          node engineering/f05/ci-governance/audit.mjs audit 2>&1 | tee f05-ci-governance-static.log
          grep -q F05_GOVERNANCE_STATIC_28_JOBS_PRESERVED f05-ci-governance-static.log
          grep -q F05_HISTORICAL_PARENT_PROOF_SOURCE_GAP f05-ci-governance-static.log
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 45项独立反例与10旧CI工作流28 Job合同测试
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 engineering/f05/ci-governance/tests/audit.test.mjs 2>&1 | tee f05-ci-governance-node.log
          grep -q F05_GOVERNANCE_NODE_45_ASSERTIONS_PASS f05-ci-governance-node.log
          grep -q '# tests 46' f05-ci-governance-node.log
          grep -q '# fail 0' f05-ci-governance-node.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f05-ci-governance-node-${{ github.sha }}
          path: |
            f05-ci-governance-static.log
            f05-ci-governance-node.log
            f05-ci-governance-static.json
            f05-ci-governance-live.json
          if-no-files-found: error
          retention-days: 14
  governance_pg16:
    name: F05治理真非超级用户PG16 24项
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 25
    env:
      F05_GOVERNANCE_CI: I_AUTHORIZE_ISOLATED_PG16_ONLY
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: f05_governance
      PGDATABASE: f05_governance_test
      PGPASSWORD: disposable_governance_ci_only
      F05_PARENT_PROOF_SIGNED: 'NO'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 建立真实隔离库和非超级用户
        shell: bash
        env:
          PGPASSWORD: disposable_bootstrap_only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE f05_governance LOGIN PASSWORD 'disposable_governance_ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE f05_governance_test OWNER f05_governance;"
      - name: 真实PG16业务兼容约束权限回滚和并发测试
        shell: bash
        run: |
          set -euo pipefail
          psql -XAt -h 127.0.0.1 -U f05_governance -d f05_governance_test -c "SELECT current_user||'|'||current_database()||'|'||current_setting('server_version_num')" | tee f05-ci-governance-pg-identity.log
          grep -q 'f05_governance|f05_governance_test|16' f05-ci-governance-pg-identity.log
          node --test --test-concurrency=1 engineering/f05/ci-governance/tests/pg16.test.mjs 2>&1 | tee f05-ci-governance-pg16.log
          grep -q F05_GOVERNANCE_PG16_24_ASSERTIONS_PASS f05-ci-governance-pg16.log
          grep -q '# tests 25' f05-ci-governance-pg16.log
          grep -q '# fail 0' f05-ci-governance-pg16.log
          echo F05_OFFICIAL_PARENT_SOURCE_GAP_NO_BUSINESS_CLAIM
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f05-ci-governance-pg16-${{ github.sha }}
          path: |
            f05-ci-governance-pg16.log
            f05-ci-governance-pg-identity.log
          if-no-files-found: error
          retention-days: 14
