name: F03-F04 Phone Permission Admin PG16 Nonproduction
on:
  push:
    branches:
      - feat/f03-f04-publisher-phone-staff-admin-http-pg16-01
    paths:
      - 'engineering/f03/publisher-phone-staff-admin/**'
      - 'engineering/src/f03-publisher-phone-admin-service.mjs'
      - 'engineering/src/f03-publisher-phone-admin-http.mjs'
      - 'engineering/src/app.mjs'
      - 'engineering/src/server.mjs'
      - '.github/workflows/f03-publisher-phone-staff-admin-nonprod.yml'
permissions:
  contents: read
jobs:
  business_pg16:
    name: Business / PG16 non-superuser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_PUBLISHER_PHONE_ADMIN_CONSENT: I_AUTHORIZE_DISPOSABLE_F03_PHONE_ADMIN_ONLY
      F03_PUBLISHER_PHONE_TLS_KEY_PATH: /tmp/f03-phone-key.pem
      F03_PUBLISHER_PHONE_TLS_CERT_PATH: /tmp/f03-phone-cert.pem
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engineering/package-lock.json
      - name: Install locked engineering dependencies
        run: npm --prefix engineering ci --ignore-scripts --no-audit --no-fund
      - name: Create disposable non-superuser PG16 and ephemeral TLS secret
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE f03_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'f03_ci_synthetic_only';
          CREATE DATABASE f03_auth_test OWNER f03_ci;
          SQL
          printf 'F03_1_HMAC_KEY_BASE64=%s\n' "$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$F03_PUBLISHER_PHONE_TLS_KEY_PATH" -out "$F03_PUBLISHER_PHONE_TLS_CERT_PATH" -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1'
      - name: Verify exact B branch, scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/f03-f04-publisher-phone-staff-admin-http-pg16-01'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          git diff --check origin/main...HEAD
          while IFS= read -r path; do
            case "$path" in
              engineering/f03/publisher-phone-staff-admin/*|engineering/src/f03-publisher-phone-admin-service.mjs|engineering/src/f03-publisher-phone-admin-http.mjs|engineering/src/app.mjs|engineering/src/server.mjs|.github/workflows/f03-publisher-phone-staff-admin-nonprod.yml) ;;
              *) echo "OUT_OF_SCOPE:$path"; exit 1 ;;
            esac
          done < <(git -c core.quotePath=false diff --name-only origin/main...HEAD)
          node --check engineering/src/app.mjs
          node --check engineering/src/f03-publisher-phone-admin-service.mjs
          node --check engineering/src/f03-publisher-phone-admin-http.mjs
          find engineering/f03/publisher-phone-staff-admin -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Apply original F03-1 and SG01 migrations unchanged
        shell: bash
        run: |
          set -euo pipefail
          node engineering/f03-1/runner.mjs --bootstrap
          node engineering/f03-1/runner.mjs --apply
          node engineering/f03-1/runner.mjs --verify
          node engineering/f03-1/fixtures.mjs
          node engineering/f03/runtime-scope/runner.mjs --apply
          node engineering/f03/runtime-scope/runner.mjs --verify
          node engineering/f03/runtime-scope/fixtures.mjs
          node engineering/f03/publisher-phone-staff-admin/fixtures.mjs
      - name: Run true same-database transactional business tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 engineering/f03/publisher-phone-staff-admin/tests/business.test.mjs 2>&1 | tee f03-phone-admin-test.log
          grep -q '# fail 0' f03-phone-admin-test.log
          grep -q 'F03_PHONE_ADMIN_BUSINESS_PG16_30_CASES_PASS' f03-phone-admin-test.log
      - name: Affected default-production-gate Node regressions
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix engineering test 2>&1 | tee f03-phone-admin-regression.log
          grep -q '# fail 0' f03-phone-admin-regression.log
      - name: Final SHA/PG16 and SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          node engineering/f03/publisher-phone-staff-admin/evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f03-phone-admin-business-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            f03-phone-admin-test.log
            f03-phone-admin-regression.log
            f03-phone-admin-evidence.json
            engineering/f03/publisher-phone-staff-admin/schema.sql
            engineering/f03/publisher-phone-staff-admin/B工程中文交接.md
