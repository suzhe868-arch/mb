name: F05-7 v23 PDM12 deterministic Matching PG16 and TLS CI
on:
  push:
    branches: [feat/f05-7-deterministic-matching-readiness-four-tier]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  match-source:
    name: F05-7 source true nonprivileged PostgreSQL16 v23 PDM12 deterministic matching source test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    timeout-minutes: 40
    permissions: {contents: read, actions: read}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: '22.16.0'}
    - name: 验证旧脚本的本地PG16容器祖先别名 不访问ECR
      shell: bash
      run: |
        set -euo pipefail
        # 官方DockerHub postgres:16已由GitHub服务启动。只在Runner内加旧镜像名别名，不发起ECR拉取。
        original_id="$(docker image inspect postgres:16 --format '{{.Id}}')"
        docker tag postgres:16 public.ecr.aws/docker/library/postgres:16-alpine
        alias_id="$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
        test "$original_id" = "$alias_id"
        original_container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"
        legacy_container="$(docker ps --filter ancestor=public.ecr.aws/docker/library/postgres:16-alpine --format '{{.ID}}')"
        test -n "$original_container"
        test "$original_container" = "$legacy_container"
        test "$(printf '%s\n' "$legacy_container" | sed '/^$/d' | wc -l)" -eq 1
        echo "F05_PG16_DOCKERHUB_LOCAL_TAG_ALIAS_CONFIRMED_NO_ECR_NETWORK_PULL $original_id"

    - run: bash engineering/f05/deterministic-matching-readiness-four-tier/ci-job.sh source
      env:
        GH_ACTIONS_READ_TOKEN: ${{ github.token }}
    - uses: actions/upload-artifact@v4
      with:
        name: f05-7-source-native-evidence
        path: engineering/f05/deterministic-matching-readiness-four-tier/artifacts/source/
        retention-days: 30
        if-no-files-found: error
  match-https:
    name: F05-7 https true nonprivileged PostgreSQL16 v23 PDM12 matching HTTPS denial test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    timeout-minutes: 40
    permissions: {contents: read, actions: read}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: '22.16.0'}
    - name: 验证旧脚本的本地PG16容器祖先别名 不访问ECR
      shell: bash
      run: |
        set -euo pipefail
        # 官方DockerHub postgres:16已由GitHub服务启动。只在Runner内加旧镜像名别名，不发起ECR拉取。
        original_id="$(docker image inspect postgres:16 --format '{{.Id}}')"
        docker tag postgres:16 public.ecr.aws/docker/library/postgres:16-alpine
        alias_id="$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
        test "$original_id" = "$alias_id"
        original_container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"
        legacy_container="$(docker ps --filter ancestor=public.ecr.aws/docker/library/postgres:16-alpine --format '{{.ID}}')"
        test -n "$original_container"
        test "$original_container" = "$legacy_container"
        test "$(printf '%s\n' "$legacy_container" | sed '/^$/d' | wc -l)" -eq 1
        echo "F05_PG16_DOCKERHUB_LOCAL_TAG_ALIAS_CONFIRMED_NO_ECR_NETWORK_PULL $original_id"

    - run: bash engineering/f05/deterministic-matching-readiness-four-tier/ci-job.sh https
    - uses: actions/upload-artifact@v4
      with:
        name: f05-7-https-native-evidence
        path: engineering/f05/deterministic-matching-readiness-four-tier/artifacts/https/
        retention-days: 30
        if-no-files-found: error
