name: F05-11 inherited frozen f05-5-2
on:
  push:
    branches: [feat/f06-5c-transaction-priority-admission-ci]
  workflow_dispatch:
permissions: {contents: read}
# Retain all latest SHA jobs; supersede obsolete push workflow runs.
concurrency:
  group: f06-5c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quota-source:
    name: F05-5 source true nonprivileged PostgreSQL16 v21 PDM10 true Employee free quota addition source test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
    - uses: actions/checkout@v4
    - name: Resolve official PG16 Docker Hub tag and alias original frozen ECR reference
      run: |
        set -euo pipefail
        docker image inspect postgres:16-alpine >/dev/null 2>&1 || docker pull postgres:16-alpine
        docker tag postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine
        test "$(docker image inspect postgres:16-alpine --format '{{.Id}}')" = "$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
        echo F06_5A_OFFICIAL_PG16_IMAGE_ALIAS_VERIFIED
    - uses: actions/setup-node@v4
      with: {node-version: '22.16.0'}
    - run: bash engineering/f05/employee-price-quota-adjustment/ci-job.sh source
    - uses: actions/upload-artifact@v4
      with:
        name: f05-5-source-native-evidence
        path: engineering/f05/employee-price-quota-adjustment/artifacts/source/
        retention-days: 30
        if-no-files-found: error
  quota-https:
    name: F05-5 https true nonprivileged PostgreSQL16 v21 PDM10 Employee quota HTTPS denial test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: disposable_bootstrap_only, POSTGRES_DB: postgres}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
    - uses: actions/checkout@v4
    - name: Resolve official PG16 Docker Hub tag and alias original frozen ECR reference
      run: |
        set -euo pipefail
        docker image inspect postgres:16-alpine >/dev/null 2>&1 || docker pull postgres:16-alpine
        docker tag postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine
        test "$(docker image inspect postgres:16-alpine --format '{{.Id}}')" = "$(docker image inspect public.ecr.aws/docker/library/postgres:16-alpine --format '{{.Id}}')"
        echo F06_5A_OFFICIAL_PG16_IMAGE_ALIAS_VERIFIED
    - uses: actions/setup-node@v4
      with: {node-version: '22.16.0'}
    - run: bash engineering/f05/employee-price-quota-adjustment/ci-job.sh https
    - uses: actions/upload-artifact@v4
      with:
        name: f05-5-https-native-evidence
        path: engineering/f05/employee-price-quota-adjustment/artifacts/https/
        retention-days: 30
        if-no-files-found: error
