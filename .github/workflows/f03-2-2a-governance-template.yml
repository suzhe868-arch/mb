          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f03-2-1a-f03-1-integration-security-isolated-pg16
          path: engineering/f03/runtime-facts/artifacts-auth-integration/
          retention-days: 30
          if-no-files-found: warn

  f03-1-frozen-https-2a:
    name: F03-1 frozen HTTPS security - its OWN new PG16
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: engineering
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: engineering/package-lock.json
      - name: Check exact frozen F03-1 build and current F01/F02 safety guard
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Bootstrap separate fresh PG16 only with F02 000001 and F03-1 000002 sealed migrations
        run: |
          set -euo pipefail
          ids="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE f03_ci WITH LOGIN PASSWORD 'f03_ci_synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE f03_auth_test OWNER f03_ci"
          node f03-1/runner.mjs --bootstrap
          node f03-1/runner.mjs --apply
          node f03-1/runner.mjs --verify
          node f03-1/fixtures.mjs
      - name: Temporary TLS/HMAC strictly for original F03-1 HTTPS security regression
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/f03-1-key.pem -out /tmp/f03-1-cert.pem -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          echo 'F03_1_TLS_KEY_PATH=/tmp/f03-1-key.pem' >> "$GITHUB_ENV"
          echo 'F03_1_TLS_CERT_PATH=/tmp/f03-1-cert.pem' >> "$GITHUB_ENV"
          key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$key"
          printf 'F03_1_HMAC_KEY_BASE64=%s\n' "$key" >> "$GITHUB_ENV"
          unset key
      - name: Run UNMODIFIED F03-1 real HTTPS and Origin/CSRF/Cookie/readiness tests
        run: |
          set -euo pipefail
          mkdir -p f03/runtime-facts/artifacts-auth-https
          node --test f03-1/tests/https.test.mjs 2>&1 | tee f03/runtime-facts/artifacts-auth-https/original-https.log
          grep -q '# fail 0' f03/runtime-facts/artifacts-auth-https/original-https.log
