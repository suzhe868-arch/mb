name: F03-2-2A isolated template atomic governance PG16
on:
  push:
    branches: [feat/f03-governance-template-2a]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f03-2-2a-pg16-template:
    name: F03-2-2A sealed 81-table admin governance CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: engineering
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: engineering/package-lock.json
      - name: Original F01/F02/F03/F03-2-G0 static safety regressions and new source syntax check
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          node --check f03/runtime-governance-template/enable-template.mjs
          node --check f03/runtime-governance-template/fixtures.mjs
          node --check f03/runtime-governance-template/tests/integration.test.mjs
          node f02-g0/closure-audit.mjs
          node f02-g0/full-domain-audit.mjs
          node f02-g0/scope-audit.mjs
          node f03/verify-contract.mjs
          node --test f03/tests/*.test.mjs
          node f03/login-design/verify-contract.mjs
          node --test f03/login-design/test/*.test.mjs
          node f03/runtime-design/verify-contract.mjs
          node --test f03/runtime-design/tests/*.test.mjs
          node --test f03/runtime-facts/tests/evidence-hashes.test.mjs
          node --test f03/runtime-scope/tests/archive-evidence.test.mjs
      - name: Create one disposable isolated PG16, no old/customer/prod database
        run: |
          set -euo pipefail
          ids="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE f03_ci WITH LOGIN PASSWORD 'f03_ci_synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE f03_auth_test OWNER f03_ci"
          if F03_1_DATABASE_URL=postgres://f03_ci:wrong@127.0.0.1:5432/other node f03-1/runner.mjs --bootstrap; then exit 1; fi
          if F03_1_ISOLATION_CONFIRM=NO node f03-1/runner.mjs --bootstrap; then exit 1; fi
      - name: Apply exact frozen F02 000001, F03-1 000002 and 1B 000003 only
        run: |
          set -euo pipefail
          node f03-1/runner.mjs --bootstrap
          node f03-1/runner.mjs --apply
          node f03-1/runner.mjs --verify
          node f03/runtime-scope/runner.mjs --apply
          node f03/runtime-scope/runner.mjs --verify
      - name: Make ONLY synthetic prior-auth, existing customer scope and second Admin fixture
        run: |
          set -euo pipefail
          node f03-1/fixtures.mjs
          node f03/runtime-scope/fixtures.mjs
          node f03/runtime-governance-template/fixtures.mjs
      - name: T01-T08 and T10 real PG16 scoped governance writes, faults and concurrent Admin tests
        run: |
          set -euo pipefail
          mkdir -p f03/runtime-governance-template/artifacts
          node --test f03/runtime-governance-template/tests/integration.test.mjs 2>&1 | tee f03/runtime-governance-template/artifacts/pg16-governance.log
          grep -q '# fail 0' f03/runtime-governance-template/artifacts/pg16-governance.log
          node f03/runtime-scope/runner.mjs --verify
      - name: Export 81-table structure and full inventory using unchanged approved evidence logic
        run: |
          set -euo pipefail
          mkdir -p f03/runtime-scope/artifacts
          node f03/runtime-scope/evidence.mjs --new
          ids="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          docker exec -e PGPASSWORD=f03_ci_synthetic_only "$ids" pg_dump --host=127.0.0.1 --username=f03_ci --dbname=f03_auth_test --schema-only --no-owner --no-privileges --schema=public > f03/runtime-governance-template/artifacts/pg16_schema_only.sql
          cp f03/runtime-scope/artifacts/pg16_inventory.json f03/runtime-governance-template/artifacts/pg16_inventory.json
          cp f03/runtime-scope/artifacts/new-structure.json f03/runtime-governance-template/artifacts/new-structure.json
          sha256sum f03/runtime-governance-template/artifacts/{pg16_schema_only.sql,pg16_inventory.json,new-structure.json} > f03/runtime-governance-template/artifacts/sha256sums.txt
          node --input-type=module -e "import assert from 'node:assert/strict';import{readFileSync}from'node:fs';const m=JSON.parse(readFileSync('f03/runtime-scope/000003.manifest.json'));const i=JSON.parse(readFileSync('f03/runtime-governance-template/artifacts/pg16_inventory.json'));const n=JSON.parse(readFileSync('f03/runtime-governance-template/artifacts/new-structure.json'));assert.deepEqual([i.tables,i.columns,i.constraints,i.indexes],[81,492,304,126]);assert.equal(n.structure_sha256,m.structure_sha256);assert.equal(i.versionChain.length,3);console.log('T10 sealed schema+versions PASS')"
      - name: Redact and restrict test artifacts
        if: always()
        run: |
          set -euo pipefail
          if test -d f03/runtime-governance-template/artifacts; then
            if grep -R -nE 'scrypt[$]v1[$]|__Host-mb_pc=[A-Za-z0-9_-]{43}|BEGIN PRIVATE KEY|SyntheticGovernanceEmployee_2026|SyntheticGovAdminTwo_2026' f03/runtime-governance-template/artifacts; then exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f03-2-2a-isolated-pg16-template-governance-evidence
          path: engineering/f03/runtime-governance-template/artifacts/
          retention-days: 30
          if-no-files-found: warn

  f03-1-frozen-integration-2a:
