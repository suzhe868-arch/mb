name: F03-2-2H SG06 Customer Owner synthetic CAS and one-table receipt PG16
on:
  push:
    branches: [feat/f03-customer-owner-handover-2h]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f03-2h-customer-owner-handover-pg16:
    name: F03-2-2H exact 89-table CI-only Customer Owner CAS/history/receipt on genuine PG16
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: engineering
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: engineering/package-lock.json
      - name: Validate frozen project and read-only structural checks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          node --check f03/runtime-customer-owner-handover/migration.mjs
          node --check f03/runtime-customer-owner-handover/service.mjs
          node --check f03/runtime-customer-owner-handover/evidence.mjs
          node --check f03/runtime-customer-owner-handover/fixtures.mjs
          node --check f03/runtime-customer-owner-handover/tests/integration.test.mjs
      - name: Disposable non-superuser new PG16 exact approved 000001 to 000004 baseline
        run: |
          set -euo pipefail
          ids="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE f03_ci WITH LOGIN PASSWORD 'f03_ci_synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE f03_auth_test OWNER f03_ci"
          node f03-1/runner.mjs --bootstrap
          node f03-1/runner.mjs --apply
          node f03/runtime-scope/runner.mjs --apply
          node f03/runtime-admin-population/runner.mjs --apply
          node f03/runtime-receiving-pool/runner.mjs --apply
          node f03/runtime-receiving-pool/runner.mjs --verify
          node f03/runtime-team-scope/runner.mjs --apply
          node f03/runtime-team-scope/runner.mjs --verify
      - name: Apply 000007 genuine frozen 88-table, seed ONLY CI synthetic identities/domain and old physical evidence
        run: |
          set -euo pipefail
          mkdir -p f03/runtime-customer-owner-handover/artifacts
          node f03/runtime-handover-ledger/runner.mjs --apply
          node f03/runtime-handover-ledger/runner.mjs --verify
          node f03-1/fixtures.mjs
          node f03/runtime-scope/fixtures.mjs
          node f03/runtime-governance-template/fixtures.mjs
          node f03/runtime-receiving-pool/fixtures.mjs
          node f03/runtime-team-scope/fixtures.mjs
          node f03/runtime-handover-ledger/fixtures.mjs
          node f03/runtime-manager-team-governance/fixtures.mjs
          node f03/runtime-handover-preflight/fixtures.mjs
          node f03/runtime-customer-owner-handover/fixtures.mjs
          node f03/runtime-customer-owner-handover/evidence.mjs --old
      - name: Prove injected 000008 migration fully rolled back with old frozen strict 88-table check
        run: |
          set -euo pipefail
          if node f03/runtime-customer-owner-handover/runner.mjs --inject; then echo 'H_INJECT_UNEXPECTED_SUCCESS'; exit 1; fi
          node f03/runtime-handover-ledger/runner.mjs --verify
      - name: Apply dedicated exactly pinned 000008 one-table append-only receipt migration
        run: |
          set -euo pipefail
          node f03/runtime-customer-owner-handover/runner.mjs --apply
          node f03/runtime-customer-owner-handover/runner.mjs --verify
          if node f03/runtime-handover-ledger/runner.mjs --verify; then echo 'OLD_88_GUARD_WRONGLY_ALLOWED_89'; exit 1; fi
      - name: H01-H09 real PG16 two actor competing Customer Owner single domain receipt and 6 fault rollback points
        run: |
          set -euo pipefail
          node --test f03/runtime-customer-owner-handover/tests/integration.test.mjs 2>&1 | tee f03/runtime-customer-owner-handover/artifacts/pg16-owner-handover-tests.log
          grep -q '# fail 0' f03/runtime-customer-owner-handover/artifacts/pg16-owner-handover-tests.log
          node f03/runtime-customer-owner-handover/runner.mjs --verify
      - name: Export original PG16 full 88-to-89 table physical catalog original schema-only and version inventory
        run: |
          set -euo pipefail
          node f03/runtime-customer-owner-handover/evidence.mjs --new
          ids="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          docker exec -e PGPASSWORD=f03_ci_synthetic_only "$ids" pg_dump --host=127.0.0.1 --username=f03_ci --dbname=f03_auth_test --schema-only --no-owner --no-privileges --schema=public > f03/runtime-customer-owner-handover/artifacts/pg16_schema_only.sql
          sha256sum f03/runtime-customer-owner-handover/artifacts/pg16_schema_only.sql f03/runtime-customer-owner-handover/artifacts/pg16_inventory.json > f03/runtime-customer-owner-handover/artifacts/sha256sums.txt
          if test -f f03/runtime-customer-owner-handover/evidence/SOURCE.md; then node f03/runtime-customer-owner-handover/evidence.mjs --archive-check; fi
      - name: Audit raw output for forbidden live credentials and token payloads
        run: |
          set -euo pipefail
          if grep -R -nE 'scrypt[$]v1[$]|__Host-mb_pc=[A-Za-z0-9_-]{43}|BEGIN PRIVATE KEY|SyntheticH2CustomerOwner_2026|SyntheticGovAdminTwo_2026|SyntheticAdmin_1234567' f03/runtime-customer-owner-handover/artifacts; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: f03-2-2h-real-pg16-89-owner-domain-immutable-receipt-evidence
          path: engineering/f03/runtime-customer-owner-handover/artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Archive only ORIGINAL CI 89-table physical evidence once to B branch
        run: |
          set -euo pipefail
          if test -f f03/runtime-customer-owner-handover/evidence/SOURCE.md; then
            echo 'F03-2-2H SOURCE archived, current physical catalog and normalized raw bytes verified'
          else
            test "$GITHUB_REF" = 'refs/heads/feat/f03-customer-owner-handover-2h'
            mkdir -p f03/runtime-customer-owner-handover/evidence
            for file in old-structure.json new-structure.json pg16_schema_only.sql pg16_inventory.json sha256sums.txt; do
              cp "f03/runtime-customer-owner-handover/artifacts/$file" "f03/runtime-customer-owner-handover/evidence/$file"
            done
            printf 'source_run_id: %s\nsource_commit_sha: %s\nsource_job_name: f03-2h-customer-owner-handover-pg16\nsource_artifact_name: f03-2-2h-real-pg16-89-owner-domain-immutable-receipt-evidence\nsource_files: original disposable PG16 physical bytes, no business rows, no live credentials\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > f03/runtime-customer-owner-handover/evidence/SOURCE.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- f03/runtime-customer-owner-handover/evidence/
            git diff --cached --quiet && { echo 'ARCHIVE_NOT_STAGED'; exit 1; }
            git commit -m 'F03-2-2H: archive original real PG16 000008 physical evidence source'
            git push origin HEAD:refs/heads/feat/f03-customer-owner-handover-2h
          fi
