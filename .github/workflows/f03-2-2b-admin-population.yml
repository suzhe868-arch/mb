name: F03-2-2B isolated System Admin population PG16
on:
  push:
    branches: [feat/f03-admin-population-2b]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover-2b-pg16:
    name: CI-only SG05 82-table structure discovery and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: engineering
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: engineering/package-lock.json
      - name: Install frozen dependencies and verify new source syntax
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          node --check f03/runtime-admin-population/migration.mjs
          node --check f03/runtime-admin-population/governance.mjs
          node --check f03/runtime-admin-population/bootstrap.mjs
      - name: Create only CI-run sealed disposable PG16
        run: |
          set -euo pipefail
          ids="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE f03_ci WITH LOGIN PASSWORD 'f03_ci_synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE f03_auth_test OWNER f03_ci"
          node f03-1/runner.mjs --bootstrap
          node f03-1/runner.mjs --apply
          node f03/runtime-scope/runner.mjs --apply
      - name: Rollback-only discovery (NOT acceptance)
        run: |
          set -euo pipefail
          node f03/runtime-admin-population/runner.mjs --discover
          node f03/runtime-scope/runner.mjs --verify
