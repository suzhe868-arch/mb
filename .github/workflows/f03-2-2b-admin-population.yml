name: F03-2-2B SG05 isolated population and bootstrap PG16
on:
  push:
    branches: [feat/f03-admin-population-2b]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f03-2b-population-82:
    name: F03-2-2B exact 82-table admin two-population / rollback / structure
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: engineering
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      F03_1_ISOLATION_CONFIRM: I_AUTHORIZE_F03_1_NEW_EMPTY_PG16_AUTH_ONLY
      F03_2B_INSTALLER_CONFIRM: I_AUTHORIZE_DISPOSABLE_PG16_FIRST_BOOTSTRAP_ONLY
      F03_1_DATABASE_URL: postgres://f03_ci:f03_ci_synthetic_only@127.0.0.1:5432/f03_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: engineering/package-lock.json
      - name: Validate frozen project safety, source syntax and pinned manifest
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          for name in migration governance bootstrap runner evidence fixtures; do node --check "f03/runtime-admin-population/$name.mjs"; done
          node --check f03/runtime-admin-population/tests/integration.test.mjs
          node --check f03/runtime-admin-population/tests/bootstrap.test.mjs
      - name: Seal disposable PostgreSQL 16 and prepare historical synthetic population
        run: |
          set -euo pipefail
          ids="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -eq 1
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE f03_ci WITH LOGIN PASSWORD 'f03_ci_synthetic_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          docker exec "$ids" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE f03_auth_test OWNER f03_ci"
          node f03-1/runner.mjs --bootstrap
          node f03-1/runner.mjs --apply
          node f03/runtime-scope/runner.mjs --apply
          mkdir -p f03/runtime-admin-population/artifacts
          node f03/runtime-admin-population/evidence.mjs --old
          node f03-1/fixtures.mjs
          node f03/runtime-scope/fixtures.mjs
          node f03/runtime-governance-template/fixtures.mjs
          node f03/runtime-admin-population/fixtures.mjs
          node f03/runtime-admin-population/runner.mjs --apply
          node f03/runtime-admin-population/runner.mjs --verify
          node f03/runtime-admin-population/runner.mjs --apply
      - name: Run real PG16 A2B identity/session/population, concurrency, fault and namespace negatives
        run: |
          set -euo pipefail
          node --test f03/runtime-admin-population/tests/integration.test.mjs 2>&1 | tee f03/runtime-admin-population/artifacts/pg16-population.log
          grep -q '# fail 0' f03/runtime-admin-population/artifacts/pg16-population.log
          node f03/runtime-admin-population/runner.mjs --verify
      - name: Export original PG16 physical SQL, immutable manifest version chain and raw SHA256
        run: |
          set -euo pipefail
          node f03/runtime-admin-population/evidence.mjs --new
          ids="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          docker exec -e PGPASSWORD=f03_ci_synthetic_only "$ids" pg_dump --host=127.0.0.1 --username=f03_ci --dbname=f03_auth_test --schema-only --no-owner --no-privileges --schema=public > f03/runtime-admin-population/artifacts/pg16_schema_only.sql
          sha256sum f03/runtime-admin-population/artifacts/pg16_schema_only.sql f03/runtime-admin-population/artifacts/pg16_inventory.json > f03/runtime-admin-population/artifacts/sha256sums.txt
          if test -f f03/runtime-admin-population/evidence/SOURCE.md; then node f03/runtime-admin-population/evidence.mjs --archive-check; fi
      - name: Fail if credentials, tokens, password hashes or private keys leak to evidence
        run: |
          set -euo pipefail
          if grep -R -nE 'scrypt[$]v1[$]|__Host-mb_pc=[A-Za-z0-9_-]{43}|BEGIN PRIVATE KEY|SyntheticBootstrapAdmin_2026|SyntheticThirdAdmin_2026' f03/runtime-admin-population/artifacts; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: f03-2-2b-sg05-82-pg16-physical-and-negative-evidence
          path: engineering/f03/runtime-admin-population/artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Archive original tested PG16 structural bytes on B branch once; final CI read-only
        run: |
          set -euo pipefail
          if test -f f03/runtime-admin-population/evidence/SOURCE.md; then
            echo 'F03-2-2B source structural evidence already frozen; current-run raw hash and catalog check passed'
          else
            test "$GITHUB_REF" = 'refs/heads/feat/f03-admin-population-2b'
            mkdir -p f03/runtime-admin-population/evidence
            for name in old-structure.json new-structure.json pg16_schema_only.sql pg16_inventory.json sha256sums.txt; do
              cp "f03/runtime-admin-population/artifacts/$name" "f03/runtime-admin-population/evidence/$name"
            done
            printf 'source_run_id: %s\nsource_commit_sha: %s\nsource_job_name: f03-2b-population-82\nsource_artifact_name: f03-2-2b-sg05-82-pg16-physical-and-negative-evidence\nsource_files: raw CI bytes only, no credentials or fixture rows\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > f03/runtime-admin-population/evidence/SOURCE.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- f03/runtime-admin-population/evidence/
            git diff --cached --quiet && { echo 'MISSING_EVIDENCE_DELTA'; exit 1; }
            git commit -m 'F03-2-2B: archive original PG16 structural bytes and CI source provenance'
            git push origin HEAD:refs/heads/feat/f03-admin-population-2b
          fi
