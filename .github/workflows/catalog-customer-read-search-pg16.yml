name: F05 catalog Customer price projection and deterministic search PG16 non-production
on:
  push:
    branches:
      - feat/f05-catalog-customer-price-search-01
    paths:
      - '.github/workflows/catalog-customer-read-search-pg16.yml'
      - 'engineering/src/catalog-service.mjs'
      - 'engineering/src/catalog-http.mjs'
      - 'engineering/src/catalog-readiness.mjs'
      - 'engineering/src/f05-catalog-customer-read-service.mjs'
      - 'engineering/src/f05-catalog-search.mjs'
      - 'engineering/tests/f05-catalog-customer-search.test.mjs'
      - 'engineering/integration/f05-catalog-customer-search-price.pg16.test.mjs'
permissions:
  contents: read
concurrency:
  group: catalog-customer-read-search-pg16-${{ github.ref }}
  cancel-in-progress: false
jobs:
  catalog-customer-read-search:
    name: Customer price projection and Rule Dictionary search on isolated non-superuser PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_bootstrap_only
          POSTGRES_DB: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      NODE_ENV: test
      API_HOST: 127.0.0.1
      F05_CATALOG_TEST_CONSENT: I_AUTHORIZE_DISPOSABLE_F05_CATALOG_PG16_ONLY
      F05_CATALOG_DATABASE_URL: postgres://f05_catalog_ci:disposable_f05_ci_only@127.0.0.1:5432/f05_catalog_test
    defaults:
      run:
        working-directory: engineering
        shell: bash
    steps:
      - name: Exact checkout and authorized-path guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22 runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Final SHA, branch, path and syntax gates
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$GITHUB_REPOSITORY" = "suzhe868-arch/mb"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/feat/f05-catalog-customer-price-search-01"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          BASE="$(git merge-base origin/main HEAD)"
          git diff --check "$BASE" HEAD
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/catalog-customer-read-search-pg16.yml|\
              engineering/src/catalog-service.mjs|\
              engineering/src/catalog-http.mjs|\
              engineering/src/catalog-readiness.mjs|\
              engineering/src/f05-catalog-customer-read-service.mjs|\
              engineering/src/f05-catalog-search.mjs|\
              engineering/tests/f05-catalog-customer-search.test.mjs|\
              engineering/integration/f05-catalog-customer-search-price.pg16.test.mjs) ;;
              *) echo "FORBIDDEN_CHANGED_PATH $file"; exit 91 ;;
            esac
          done < <(git -c core.quotePath=false diff --name-only "$BASE" HEAD)
          while IFS= read -r file; do
            node --check "$file"
          done < <(git -c core.quotePath=false diff --name-only "$BASE" HEAD | grep -E '^engineering/.*\.(mjs|cjs|js)$')
          echo "F05_CATALOG_CUSTOMER_PRICE_SEARCH_BRANCH_SHA_PATH_AND_SYNTAX_PASS"
      - name: Frozen dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Catalog unit and backward-compatibility tests
        run: |
          set -euo pipefail
          mkdir -p f05-catalog-customer-search/artifacts
          node --test tests/catalog.test.mjs tests/catalog-regression.test.mjs tests/f05-catalog-customer-search.test.mjs 2>&1 | tee f05-catalog-customer-search/artifacts/unit-tests.log
          grep -q '# fail 0' f05-catalog-customer-search/artifacts/unit-tests.log
      - name: Bootstrap genuine isolated non-superuser PG16 schema
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import {readFile} from 'node:fs/promises';
          import {compileCurrentInitial} from './f02-1/compile-current.mjs';
          import {validateCatalogEnv,probeIsolatedCatalog} from './src/catalog-readiness.mjs';
          const expectedRef='refs/heads/feat/f05-catalog-customer-price-search-01';
          if(process.env.GITHUB_ACTIONS!=='true'||process.env.GITHUB_REPOSITORY!=='suzhe868-arch/mb'||
             process.env.GITHUB_EVENT_NAME!=='push'||process.env.GITHUB_REF!==expectedRef||
             !process.env.GITHUB_RUN_ID||!process.env.GITHUB_SHA)throw Error('CATALOG_BOOTSTRAP_GITHUB_SCOPE_DENIED');
          if(process.env.APP_ENV!=='test'||process.env.NODE_ENV!=='test'||process.env.API_HOST!=='127.0.0.1'||
             process.env.F05_CATALOG_TEST_CONSENT!=='I_AUTHORIZE_DISPOSABLE_F05_CATALOG_PG16_ONLY')
            throw Error('CATALOG_BOOTSTRAP_TEST_ENV_REQUIRED');
          validateCatalogEnv(process.env);
          const admin=new pg.Client({connectionString:'postgres://postgres:disposable_bootstrap_only@127.0.0.1:5432/postgres',
            connectionTimeoutMillis:1000,query_timeout:3000,statement_timeout:3000,application_name:'catalog_search_bootstrap_admin_disposable'});
          let client;
          try{
            await admin.connect();
            const identity=(await admin.query("SELECT current_database() db,current_user role,current_setting('server_version_num')::integer version,(SELECT rolsuper FROM pg_catalog.pg_roles WHERE rolname=current_user) superuser")).rows[0];
            if(identity.db!=='postgres'||identity.role!=='postgres'||identity.superuser!==true||identity.version<160000||identity.version>=170000)
              throw Error('CATALOG_BOOTSTRAP_ADMIN_PG16_IDENTITY_DENIED');
            const roleExists=(await admin.query("SELECT 1 FROM pg_catalog.pg_roles WHERE rolname='f05_catalog_ci'")).rowCount!==0;
            const dbExists=(await admin.query("SELECT 1 FROM pg_catalog.pg_database WHERE datname='f05_catalog_test'")).rowCount!==0;
            if(roleExists||dbExists)throw Error('CATALOG_BOOTSTRAP_TARGET_PREEXISTS');
            await admin.query("CREATE ROLE f05_catalog_ci WITH LOGIN PASSWORD 'disposable_f05_ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION");
            await admin.query("CREATE DATABASE f05_catalog_test OWNER f05_catalog_ci");
            client=new pg.Client({connectionString:process.env.F05_CATALOG_DATABASE_URL,connectionTimeoutMillis:1000,
              query_timeout:5000,statement_timeout:5000,application_name:'catalog_search_bootstrap_nonprivileged'});
            await client.connect();
            const app=(await client.query("SELECT current_database() db,current_user role,current_setting('server_version_num')::integer version,(SELECT rolsuper FROM pg_catalog.pg_roles WHERE rolname=current_user) superuser")).rows[0];
            if(app.db!=='f05_catalog_test'||app.role!=='f05_catalog_ci'||app.superuser!==false||app.version<160000||app.version>=170000)
              throw Error('CATALOG_BOOTSTRAP_NONPRIVILEGED_PG16_IDENTITY_DENIED');
            await client.query('BEGIN');
            try{
              const candidate=await compileCurrentInitial();
              const pinned=JSON.parse(await readFile('f02-1/migrations/000001_current_initial.manifest.json','utf8'));
              if(candidate.checksum!==pinned.sha256||candidate.stats.tables!==76||JSON.stringify(candidate.stats)!==JSON.stringify(pinned.stats))
                throw Error('CATALOG_BOOTSTRAP_F02_SCHEMA_CHECKSUM_MISMATCH');
              await client.query(candidate.sql);
              const count=(await client.query("SELECT count(*)::integer n FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace ns ON ns.oid=c.relnamespace WHERE ns.nspname='public' AND c.relkind='r'")).rows[0].n;
              if(count!==76)throw Error('CATALOG_BOOTSTRAP_F02_TABLE_COUNT_MISMATCH');
              const migrations=[
                '000027_catalog_disposable_test_only.sql','000028_matching_invalidation_disposable_test_only.sql',
                '000029_matching_evidence_stale_disposable_test_only.sql','000030_matching_source_lock_disposable_test_only.sql',
                '000031_matching_ttl_retry_disposable_test_only.sql','000032_matching_dictionary_disposable_test_only.sql',
                '000033_matching_candidate_discovery_disposable_test_only.sql','000034_matching_hard_fields_disposable_test_only.sql',
                '000035_matching_discovery_paged_audit_disposable_test_only.sql','000036_matching_rule_change_discovery_disposable_test_only.sql',
                '000037_matching_dictionary_field_check_disposable_test_only.sql','000038_matching_optional_price_safe_view_disposable_test_only.sql',
                '000039_recommendation_lifecycle_disposable_test_only.sql','000040_priority_arbitration_disposable_test_only.sql',
                '000041_priority_safe_consumer_disposable_test_only.sql','000042_recommendation_free_price_disposable_test_only.sql',
                '000043_priority_ttl_sweep_disposable_test_only.sql','000044_priority_qualification_disposable_test_only.sql',
                '000045_demand_lifecycle_disposable_test_only.sql','000046_consultation_manager_capability_disposable_test_only.sql',
                '000047_vehicle_employee_read_scope_disposable_test_only.sql','000048_catalog_sort_facts_disposable_test_only.sql',
                '000049_consultation_human_response_disposable_test_only.sql','000050_priority_reliable_scheduler_disposable_test_only.sql'
              ];
              for(const filename of migrations)await client.query(await readFile('catalog/'+filename,'utf8'));
              await client.query("INSERT INTO public.vehicle_brands(brand_id,brand_name) VALUES(59001,'隔离测试品牌')");
              await client.query("INSERT INTO public.vehicle_series(series_id,brand_id,series_name) VALUES(59001,59001,'隔离测试车系')");
              await client.query("INSERT INTO public.vehicle_models(model_id,brand_id,series_id,model_name,model_year,profile_status) VALUES(59001,59001,59001,'隔离测试车型',2026,'incomplete')");
              const role=(await client.query("SELECT role_code FROM public.roles WHERE role_id=59001")).rows[0];
              const sales=(await client.query("SELECT role_id FROM public.roles WHERE role_code='sales' LIMIT 1")).rows[0];
              if(!role&&!sales)await client.query("INSERT INTO public.roles(role_id,role_code) VALUES(59001,'sales')");
              else if(!role||role.role_code!=='sales'||String(sales?.role_id??'59001')!=='59001')throw Error('CATALOG_BOOTSTRAP_CANONICAL_SALES_ROLE_DENIED');
              await client.query('COMMIT');
            }catch(e){await client.query('ROLLBACK').catch(()=>{});throw e}
            const pool=new pg.Pool({connectionString:process.env.F05_CATALOG_DATABASE_URL,max:2,connectionTimeoutMillis:900,query_timeout:1800,statement_timeout:1800});
            try{
              if(!await probeIsolatedCatalog(pool))throw Error('CATALOG_BOOTSTRAP_SCHEMA_PROBE_DENIED');
              const final=(await pool.query("SELECT current_database() db,current_user role,current_setting('server_version_num')::integer version,(SELECT rolsuper FROM pg_catalog.pg_roles WHERE rolname=current_user) superuser")).rows[0];
              if(final.db!=='f05_catalog_test'||final.role!=='f05_catalog_ci'||final.superuser!==false||final.version<160000||final.version>=170000)
                throw Error('CATALOG_BOOTSTRAP_FINAL_PG16_IDENTITY_DENIED');
              console.log(JSON.stringify({event:'catalog_schema_ready',database:final.db,role:final.role,version:final.version,superuser:final.superuser}));
            }finally{await pool.end()}
          }finally{await client?.end().catch(()=>{});await admin.end().catch(()=>{})}
          NODE
      - name: Existing catalog sort regression on PG16
        run: |
          set -euo pipefail
          node --test integration/f05-catalog-sorts.pg16.test.mjs 2>&1 | tee f05-catalog-customer-search/artifacts/catalog-sorts-regression.log
          grep -q '# fail 0' f05-catalog-customer-search/artifacts/catalog-sorts-regression.log
      - name: Existing price-unlock PG16 regression
        run: |
          set -euo pipefail
          node --test integration/f05-price-unlock.pg16.test.mjs 2>&1 | tee f05-catalog-customer-search/artifacts/price-unlock-regression.log
          grep -q '# fail 0' f05-catalog-customer-search/artifacts/price-unlock-regression.log
      - name: Existing Rule Dictionary PG16 regression
        run: |
          set -euo pipefail
          node --test integration/f05-matching-dictionary.pg16.test.mjs 2>&1 | tee f05-catalog-customer-search/artifacts/dictionary-regression.log
          grep -q '# fail 0' f05-catalog-customer-search/artifacts/dictionary-regression.log
      - name: Customer price, current session and deterministic search PG16 HTTP integration
        run: |
          set -euo pipefail
          node --test integration/f05-catalog-customer-search-price.pg16.test.mjs 2>&1 | tee f05-catalog-customer-search/artifacts/customer-search-price-pg16.log
          grep -q '# fail 0' f05-catalog-customer-search/artifacts/customer-search-price-pg16.log
      - name: Redacted same-SHA evidence and size gate
        id: evidence_gate
        if: always()
        run: |
          set -euo pipefail
          mkdir -p f05-catalog-customer-search/artifacts
          printf '%s\n' "$GITHUB_SHA" > f05-catalog-customer-search/artifacts/head-sha.txt
          printf '%s\n' "${{ github.run_id }}" > f05-catalog-customer-search/artifacts/run-id.txt
          printf '%s\n' "$GITHUB_REF" > f05-catalog-customer-search/artifacts/branch.txt
          (cd f05-catalog-customer-search/artifacts && find . -maxdepth 1 -type f ! -name 'sha256sums.txt' -print0 | sort -z | xargs -0 -r sha256sum > sha256sums.txt)
          size="$(du -sb f05-catalog-customer-search/artifacts | awk '{print $1}')"
          test "$size" -le 20971520
          if grep -R -nE 'postgres(ql)?://[^[:space:]]+|BEGIN PRIVATE KEY|Bearer[[:space:]]+[A-Za-z0-9._-]+' f05-catalog-customer-search/artifacts; then
            echo "CATALOG_EVIDENCE_CONTAINS_SENSITIVE_VALUE"
            exit 92
          fi
          echo "CATALOG_EVIDENCE_SIZE_BYTES=$size"
      - name: Upload minimal disposable evidence
        if: always() && steps.evidence_gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-customer-search-evidence-${{ github.run_id }}
          path: engineering/f05-catalog-customer-search/artifacts/
          retention-days: 1
          if-no-files-found: error
