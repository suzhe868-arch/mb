  safe-52:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Synthetic static and negative tests
        run: |
          node audit/h52-synthetic-graph/生成工作流.mjs --check
          node --test audit/h52-synthetic-graph/安全校验.test.mjs
          node audit/h52-synthetic-graph/安全校验.mjs --evidence
      - name: YAML alias anchor
        env:
          SYNTHETIC_CANARY: &z H52_SYNTHETIC_READ_ONLY_CANARY
        run: echo "$SYNTHETIC_CANARY"
      - name: YAML alias reference
        env:
          SYNTHETIC_CANARY: *z
        run: echo "$SYNTHETIC_CANARY"
      - name: Upload nonempty evidence
        uses: actions/upload-artifact@v4
        with:
          name: h52-synthetic-52-graph-safe-evidence
          path: audit/h52-synthetic-graph/原生证据.json
          if-no-files-found: error
          retention-days: 7
